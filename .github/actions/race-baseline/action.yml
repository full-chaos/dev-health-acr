name: race-baseline
description: >-
  CHAOS-12667: fetch main's last race-json artifact of one race job into
  .tmp/race-baseline/race.json, for the budget guard's real span report
  (RACE_BASELINE_JSON). The token is used in this step only, and the step runs
  only gh: no repository script, Makefile or test sees it (Codex #1967 r1). It
  reads successful push runs of main only. A miss prints its reason and leaves
  no file; the guard then warns and skips the comparison. Never fails the job.
inputs:
  artifact:
    description: the artifact name, race-json-<job id>
    required: true
  token:
    description: a token with actions read, used for gh only
    required: true
runs:
  using: composite
  steps:
    - name: Fetch main's last race-json of this job
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        ARTIFACT: ${{ inputs.artifact }}
      run: |
        set -uo pipefail
        out=.tmp/race-baseline
        rm -rf "$out"
        mkdir -p "$out"
        if ! command -v gh >/dev/null 2>&1; then
          echo "race-baseline: gh is not installed; no baseline"
          exit 0
        fi
        if ! ids="$(gh run list -R "$GITHUB_REPOSITORY" --workflow ci.yml --branch main --event push --status success \
          --limit 10 --json databaseId -q '.[].databaseId' 2>/dev/null)"; then
          echo "race-baseline: gh run list failed; no baseline"
          exit 0
        fi
        for id in $ids; do
          case "$id" in '' | *[!0-9]*) continue ;; esac
          if gh run download "$id" -R "$GITHUB_REPOSITORY" -n "$ARTIFACT" -D "$out/$id" >/dev/null 2>&1; then
            got="$(find "$out/$id" -name race.json -type f -size +0c -print -quit)"
            if [ -n "$got" ]; then
              mv "$got" "$out/race.json"
              echo "race-baseline: main run $id, artifact $ARTIFACT"
              exit 0
            fi
          fi
        done
        echo "race-baseline: no $ARTIFACT in the last 10 successful main runs; no baseline"

name: go-modcache
description: >-
  The one Go module cache of a ci.yml run. mode=warm (only the gomodcache job)
  fills it on a miss; mode=restore fails the job on a miss, so a consumer never
  falls back to downloading modules silently.
inputs:
  mode:
    description: warm or restore
    required: true
runs:
  using: composite
  steps:
    # A directory of its own: setup-go restores its cache into the default
    # module cache, whose files are read-only, so extracting this cache over
    # that directory fails with "File exists".
    - name: Point Go at the module cache directory of this action
      shell: bash
      run: printf 'GOMODCACHE=%s\n' "$RUNNER_TEMP/gomodcache" >> "$GITHUB_ENV"
    - name: Compute the Go module cache key
      id: key
      shell: bash
      run: |
        set -euo pipefail
        printf 'key=gomod-v2-%s-%s-%s\n' "$RUNNER_OS" "$(go env GOVERSION)" \
          "$(cat go.mod go.sum scripts/ci/go-tool-pins.txt | sha256sum | cut -c1-24)" >> "$GITHUB_OUTPUT"
        printf 'path=%s\n' "$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"
    # actions/cache v6.1.0 (restore)
    - name: Restore the Go module cache
      id: restore
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: ${{ steps.key.outputs.path }}
        key: ${{ steps.key.outputs.key }}
        lookup-only: ${{ inputs.mode == 'warm' }}
        fail-on-cache-miss: ${{ inputs.mode == 'restore' }}
    - name: Download every module and pinned tool once
      if: ${{ inputs.mode == 'warm' && steps.restore.outputs.cache-hit != 'true' }}
      shell: bash
      run: |
        set -euo pipefail
        scripts/ci/retry.sh go mod download
        bin="$(mktemp -d)"
        while IFS= read -r pin; do
          [ -n "$pin" ] || continue
          GOBIN="$bin" scripts/ci/retry.sh go install "$pin"
        done < scripts/ci/go-tool-pins.txt
    - name: Verify the module cache against go.sum
      if: ${{ inputs.mode == 'restore' || steps.restore.outputs.cache-hit != 'true' }}
      shell: bash
      run: go mod verify
    # actions/cache v6.1.0 (save)
    - name: Save the Go module cache
      if: ${{ inputs.mode == 'warm' && steps.restore.outputs.cache-hit != 'true' }}
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: ${{ steps.key.outputs.path }}
        key: ${{ steps.key.outputs.key }}

---
name: ci

"on":
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  # CHAOS-4855: pull the ghcr.io/full-chaos mirror of every Docker Hub test
  # dependency and build/tooling image. Works whether the mirrored packages
  # are public or private, so CI does not depend on their visibility.
  packages: read

concurrency:
  # PR runs share one group per PR and still cancel on a new push -- a
  # superseded PR tip's run is genuinely moot.
  #
  # MAIN pushes get one group PER SHA, which is the whole point of the
  # `github.sha` fallback here. It used to be `github.ref`, so every main
  # push shared the single group `ci-refs/heads/main` and each landing
  # cancelled the previous main commit's run. Measured 2026-09-05
  # 21:28-21:55Z: four consecutive main runs cancelled, main had no
  # verdict at all for 53 minutes, and a lane watching its own landing had
  # nothing to watch.
  #
  # Why per-sha rather than simply turning cancellation off for pushes:
  # with `cancel-in-progress: false` the group still serializes, and
  # GitHub keeps at most ONE pending run per group -- a third landing
  # cancels the second while it is still pending. That reproduces the
  # exact defect (a main sha with no terminal verdict) precisely in the
  # rapid-landing case that motivated this, just one run later. A distinct
  # group per sha cannot collide at all, so every main commit runs and
  # reaches a terminal conclusion regardless of landing rate.
  #
  # The cost is real and accepted: concurrent landings now run concurrent
  # main CI rather than one at a time. That is the price of every main sha
  # having a verdict; scripts/ci/test-workflow-contract.sh pins the shape
  # so it cannot quietly revert to a shared main group.
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  # CHAOS-4855 R2: ci.yml and mirror-images.yml are independent workflows
  # triggered by the SAME push, with no cross-workflow `needs` (GitHub
  # Actions has none). The introducing PR hit this directly: mirror-images.yml
  # was still pushing acr's newly-mirrored images when this workflow's `unit`
  # job reached its first testcontainers pull, which failed `manifest
  # unknown` -- and five other jobs failed the identical way in the same run,
  # reading as six unrelated defects instead of one race.
  #
  # This job runs FIRST and resolves every mirrored image's manifest (read
  # only, no push) before any job that pulls one is allowed to start, so that
  # exact race now fails as ONE named error here ("run Mirror images first")
  # instead of scattering across every consuming job. It does not eliminate
  # the race -- mirror-images.yml still runs on its own schedule independent
  # of this workflow -- it makes the failure legible and immediate rather
  # than nine confusing ones.
  # Runner-routing contract v1.6. Repo variable SELF_HOSTED_RUNNERS gates
  # which of the two jobs below runs; both carry `name: mirror-preflight`
  # so the check reported to a PR is stable across the flip. The `if:`
  # pair is an exact complement (never both true, never both false,
  # fork PRs always fall back to hosted regardless of the switch), so
  # exactly one leg runs on every workflow run. No poller: same-workflow
  # jobs read each other's result via `needs` directly (see
  # scripts/ci/test-workflow-contract.sh's pair checks, and `verify`
  # below), so there is nothing to wait on or claim -- this replaces the
  # v1.5.1 cross-workflow wait/claim pattern (see #399/#402/#404/#410).
  mirror-preflight-hosted:
    name: mirror-preflight
    if: >-
      vars.SELF_HOSTED_RUNNERS != 'enabled'
      || (github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.full_name != github.repository)
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v7.0.0
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with: {persist-credentials: false}
      # docker/login-action v4.5.1. Read-only use here (imagetools inspect),
      # but the mirrored packages' visibility is not guaranteed public, so
      # this authenticates the same way every pulling job below does.
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify every mirrored image is resolvable before any job pulls one
        run: scripts/ci/verify-mirrored-images.sh "${{ github.repository }}"

  # The self-hosted leg. Read-only `docker buildx imagetools inspect`
  # only -- no image pull/run -- so it needs only the declared-present
  # Docker daemon; buildx ships with the actions-runner base image's
  # docker CLI. Measured pool wall under load: 36s-41s across this
  # lane's earlier runs; timeout sized well above that.
  mirror-preflight-self-hosted:
    name: mirror-preflight
    if: >-
      vars.SELF_HOSTED_RUNNERS == 'enabled'
      && (github.event_name != 'pull_request'
      || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, oci-arc-runners]
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with: {persist-credentials: false}
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify every mirrored image is resolvable before any job pulls one
        run: scripts/ci/verify-mirrored-images.sh "${{ github.repository }}"

  scripts-hosted:
    name: scripts
    if: >-
      vars.SELF_HOSTED_RUNNERS != 'enabled'
      || (github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.full_name != github.repository)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with: {persist-credentials: false}
      - name: Check release setup script modes
        run: |
          test -x scripts/release/setup-cosign-key.sh
          test -x scripts/release/export-tag-signing-key.sh
          test -x scripts/release/publish-private-release.sh
          test -x scripts/release/publish-private-image.sh
          test -x scripts/release/publish-ci-release.sh
          test -x scripts/release/revoke-private-release.sh
          test -x scripts/release/assemble-release-assets.sh
          test -x scripts/release/test-assemble-release-assets.sh
          test -x scripts/release/test-container-release-manifest.sh
          test -x scripts/release/test-publish-private-image.sh
          test -x scripts/release/test_release_scripts.sh
          test -x scripts/release/verify-mcp-binary-approval.sh
          test -x scripts/release/write-container-release-manifest.sh
      - name: Shellcheck CI release publisher
        run: |
          # SC2016: jq receives named arguments whose $names must remain literal
          # inside single-quoted jq programs rather than expand in the shell.
          shellcheck -x -e SC2016 scripts/release/publish-ci-release.sh
      - name: Shellcheck release policy contract tests
        run: |
          # SC2016: this test intentionally searches source files for literal
          # shell and jq variables such as $tag, $name, and $release_digest.
          shellcheck -x -e SC2016 scripts/release/test_release_scripts.sh
      - name: Shellcheck existing release scripts
        run: |
          find scripts/release -maxdepth 1 -type f -name '*.sh' \
            ! -name 'publish-ci-release.sh' \
            ! -name 'test_release_scripts.sh' -print0 \
            | xargs -0 shellcheck -x
      - name: Shellcheck container scripts
        run: |
          # SC2016: test-contract.sh intentionally greps scan.sh for literal
          # shell variables such as $trivy_db_mirror and $metadata.
          find scripts/container -type f -name '*.sh' -print0 \
            | xargs -0 shellcheck -x -e SC2016
      - name: Shellcheck CI workflow scripts
        run: |
          find scripts/ci -type f -name '*.sh' -print0 \
            | xargs -0 shellcheck -x
      - name: Test release asset assembly
        run: scripts/release/test-assemble-release-assets.sh
      - name: Test container release manifest
        run: scripts/release/test-container-release-manifest.sh
      - name: Test private image publisher
        run: scripts/release/test-publish-private-image.sh
      - name: Test release policy contracts
        run: scripts/release/test_release_scripts.sh
      - name: Test optional MCP binary approval gate
        run: |
          approval_gates=scripts/release/test-remote-gates.sh
          "$approval_gates" --mode dry-run \
            --fixtures testdata/release-approvals
          "$approval_gates" --mode reject-invalid \
            --fixtures testdata/release-approvals
      - name: Verify CI workflow contract
        run: scripts/ci/test-workflow-contract.sh
      # CHAOS-4855 R3: mirror-preflight and resolve-mirrored-images.sh only
      # verify the images this list's author already knew to add -- neither
      # notices a NEW or reintroduced bare-tag testcontainers image
      # reference anywhere else in the module (the exact gap that produced
      # 20 unpinned postgres:18-alpine call sites and one unpinned
      # edoburu/pgbouncer:latest call site, invisible until each one hit
      # `manifest unknown` in CI). This enumerates every such reference in
      # the module via `git grep` and fails naming the file:line if it is
      # not both digest-pinned and present in the mirror list.
      - name: Verify every testcontainers image is pinned and mirrored
        run: scripts/ci/test-testcontainers-image-pins.sh

  # The self-hosted leg. Go-less: no setup-go, so the arm64 check reads
  # `uname -m` (arm64 Linux reports `aarch64`) rather than `go env GOARCH`
  # the way the Go-backed jobs below do. shellcheck is the one tool this
  # job needs that the declared pool toolset does not carry and the ARC
  # image does not bake in -- GitHub-hosted `ubuntu-latest` ships it by
  # default, which is why the hosted leg never installs it. Installed
  # here the same guarded way the pool jobs below install psql: skip the
  # network call when it is already present, fail loudly (not skip) when
  # apt cannot provide it either. Measured pool wall under load: 21s-51s
  # across this lane's earlier runs; timeout sized well above that.
  scripts-self-hosted:
    name: scripts
    if: >-
      vars.SELF_HOSTED_RUNNERS == 'enabled'
      && (github.event_name != 'pull_request'
      || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, oci-arc-runners]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with: {persist-credentials: false}
      - name: Confirm this runner is actually arm64
        run: |
          set -euo pipefail
          arch="$(uname -m)"
          if [ "${arch}" != aarch64 ]; then
            echo "expected uname -m=aarch64 on oci-arc-runners, got '${arch}'" >&2
            exit 1
          fi
      - name: Install shellcheck (present on GitHub-hosted ubuntu-latest, not on this pool image)
        run: |
          set -euo pipefail
          if command -v shellcheck >/dev/null 2>&1; then
            shellcheck --version
            exit 0
          fi
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y shellcheck
          shellcheck --version
      - name: Check release setup script modes
        run: |
          test -x scripts/release/setup-cosign-key.sh
          test -x scripts/release/export-tag-signing-key.sh
          test -x scripts/release/publish-private-release.sh
          test -x scripts/release/publish-private-image.sh
          test -x scripts/release/publish-ci-release.sh
          test -x scripts/release/revoke-private-release.sh
          test -x scripts/release/assemble-release-assets.sh
          test -x scripts/release/test-assemble-release-assets.sh
          test -x scripts/release/test-container-release-manifest.sh
          test -x scripts/release/test-publish-private-image.sh
          test -x scripts/release/test_release_scripts.sh
          test -x scripts/release/verify-mcp-binary-approval.sh
          test -x scripts/release/write-container-release-manifest.sh
      - name: Shellcheck CI release publisher
        run: |
          # SC2016: jq receives named arguments whose $names must remain literal
          # inside single-quoted jq programs rather than expand in the shell.
          shellcheck -x -e SC2016 scripts/release/publish-ci-release.sh
      - name: Shellcheck release policy contract tests
        run: |
          # SC2016: this test intentionally searches source files for literal
          # shell and jq variables such as $tag, $name, and $release_digest.
          shellcheck -x -e SC2016 scripts/release/test_release_scripts.sh
      - name: Shellcheck existing release scripts
        run: |
          find scripts/release -maxdepth 1 -type f -name '*.sh' \
            ! -name 'publish-ci-release.sh' \
            ! -name 'test_release_scripts.sh' -print0 \
            | xargs -0 shellcheck -x
      - name: Shellcheck container scripts
        run: |
          # SC2016: test-contract.sh intentionally greps scan.sh for literal
          # shell variables such as $trivy_db_mirror and $metadata.
          find scripts/container -type f -name '*.sh' -print0 \
            | xargs -0 shellcheck -x -e SC2016
      - name: Shellcheck CI workflow scripts
        run: |
          find scripts/ci -type f -name '*.sh' -print0 \
            | xargs -0 shellcheck -x
      - name: Test release asset assembly
        run: scripts/release/test-assemble-release-assets.sh
      - name: Test container release manifest
        run: scripts/release/test-container-release-manifest.sh
      - name: Test private image publisher
        run: scripts/release/test-publish-private-image.sh
      - name: Test release policy contracts
        run: scripts/release/test_release_scripts.sh
      - name: Test optional MCP binary approval gate
        run: |
          approval_gates=scripts/release/test-remote-gates.sh
          "$approval_gates" --mode dry-run \
            --fixtures testdata/release-approvals
          "$approval_gates" --mode reject-invalid \
            --fixtures testdata/release-approvals
      - name: Verify CI workflow contract
        run: scripts/ci/test-workflow-contract.sh
      - name: Verify every testcontainers image is pinned and mirrored
        run: scripts/ci/test-testcontainers-image-pins.sh

  lint:
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v7.0.0
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with: {persist-credentials: false}
      # Caching was previously off with no recorded rationale (checked: no
      # commit message, PR body, or doc states one) -- every run cold-built
      # the module, its dependencies, and every test binary from scratch.
      # The cache is keyed on go.sum + Go version + runner, GitHub scopes
      # caches per branch with fork PRs isolated, and nothing in the build
      # is trusted on the basis of the cache: the reproducible container
      # rebuild and the release pipeline both still build cold.
      # actions/setup-go v6.5.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.27.0'
          cache: true
      - name: Verify Go formatting
        run: make fmt-check
      - name: Vet Go packages
        run: make vet
      # Runs here rather than in the Go-less `scripts` job because only a real
      # `go list ./...` can show the race matrix partitions the whole module.
      # scripts/ci/test-workflow-contract.sh proves the matrix is well-formed;
      # this proves it is total -- a race lane that silently tested fewer
      # packages would still report success.
      - name: Verify the race shards cover every package
        run: scripts/ci/test-shard-closure.sh
      - name: Check known Go vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.5.0 ./...

  # Renders every fenced ```mermaid block under docs/** with mermaid-cli so a
  # diagram mermaid's own parser rejects fails CI instead of rotting silently
  # (the standing diagram-update rule in
  # docs/design/context-fabric-architecture-diagrams.md only covers content
  # drift, not render-breaking syntax). Go-less and hosted-only on purpose:
  # mermaid-cli's Puppeteer/Chromium dependency has no published linux-arm64
  # build for many Chrome-for-Testing releases, so routing this to the
  # self-hosted arm64 pool risks a false failure from a missing platform
  # build, not a real diagram defect. scripts/docs/verify-mermaid.sh does the
  # actual extraction/render/assert-nonzero-count work and takes --root for
  # scripts/docs/test-verify-mermaid.sh's negative-control fixture; the
  # mermaid-cli version is pinned once in scripts/docs/mermaid-cli-version.txt
  # and read by both this job and the script so they cannot drift apart.
  docs-mermaid:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with: {persist-credentials: false}
      # actions/setup-node v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
      - name: Install pinned mermaid-cli
        run: npm install --no-save "@mermaid-js/mermaid-cli@$(cat scripts/docs/mermaid-cli-version.txt)"
      - name: Shellcheck the mermaid render check
        run: shellcheck -x scripts/docs/verify-mermaid.sh scripts/docs/test-verify-mermaid.sh
      - name: Render every fenced mermaid block under docs/**, and prove the check rejects a broken one
        run: scripts/docs/test-verify-mermaid.sh

  # Runner-routing contract: unit stays HOSTED-ONLY under v1.6 too. Routed
  # to the pool in an earlier version of #410; a real pool run (after
  # fixing the concurrency-driven test-timeout failure with
  # GOFLAGS=-timeout=25m) still failed with 3 internal/sidecar
  # CodeGraph-guard test failures ("codegraph index missing" / a
  # writable-managed-root assertion) not seen on hosted -- looks like an
  # environment difference in the self-hosted checkout (permissions/
  # ownership, or an absent index the hosted runner has some other way of
  # providing), not a concurrency artifact and not something this lane
  # chased further. Per chris's routing ruling (pool stays at 8 runners,
  # final; hosted is the designated overflow; route only what measurably
  # beats hosted under load), `unit` and the race matrix below stay
  # hosted-only by default -- their pool fix is a follow-up, not a
  # blocker for this migration. scripts/build/mirror-preflight/contracts/
  # race-devhealthschema are the v1.6-migrated pairs (see each job's own
  # comment).
  unit:
    # Sharded four ways for the same reason the race matrix below is: this
    # job ran the whole `./...` coverage suite in one leg and was the
    # critical path of every CI run (13m50s on main run 33991874730, with
    # the next-longest lane 2m32s behind it). The mechanism is the race
    # matrix's, reused rather than reinvented -- scripts/ci/test-shard.sh
    # partitions `go list ./...` round-robin -- with one difference: this
    # job passes --with-isolated, so internal/contextfabric/devhealthschema
    # is sharded IN rather than excluded. That package is excluded from the
    # race round-robin because its full-repo declaration walk is expensive
    # under -race and it needs its own -timeout (see race-devhealthschema
    # below, and isolated_packages in scripts/ci/test-shard.sh). This job
    # runs no race detector, and the unsharded `./...` it replaces always
    # covered that package -- dropping it here would silently shrink the
    # non-race suite, with every shard still green.
    # scripts/ci/test-shard-closure.sh proves, on a real `go list`, that the
    # union of these four shards is exactly `go list ./...` with nothing
    # doubled, and that the comparison saying so can actually reject a union
    # with a package missing.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    name: unit (shard ${{ matrix.shard }} of 4)
    runs-on: ubuntu-latest
    # v1.6 split mirror-preflight into two jobs sharing one name (see
    # below); exactly one runs per workflow run and the other is
    # `skipped` by design. This job runs on every workflow run
    # regardless of the switch, so it needs whichever leg actually ran
    # to have succeeded -- the default `needs:` skip-cascade would wrongly
    # skip this job too on the leg that was never going to run anyway.
    needs:
      - mirror-preflight-hosted
      - mirror-preflight-self-hosted
    if: >-
      !cancelled()
      && (needs.mirror-preflight-hosted.result == 'success'
      || needs.mirror-preflight-self-hosted.result == 'success')
    env:
      # CHAOS-4855: redirect every registry-less Docker Hub pull this suite
      # makes (postgres, clickhouse, falkordb, and testcontainers-go's own
      # hardcoded reaper) at the ghcr.io/full-chaos mirror. `go test ./...`
      # here runs testcontainers-backed fixtures with no build tag or skip
      # guard (chfixture, falkorgraph, the postgres fixtures), so this job
      # needs both the prefix and the ghcr login below.
      # CHAOS-4855 R1 (learned the hard way): ghcr.io/full-chaos is NOT a
      # writable-shared namespace -- GHCR ties package write access to
      # whichever repo's token created it. Mirroring acr's postgres digest
      # under ops's existing ghcr.io/full-chaos/postgres package 403'd
      # ("permission_denied: write_package") the first time this ran. acr
      # mirrors everything (including its own copy of the reaper) under its
      # own repo-scoped path instead -- see mirror-images.yml.
      TESTCONTAINERS_HUB_IMAGE_NAME_PREFIX: ghcr.io/${{ github.repository }}
    steps:
      # actions/checkout v7.0.0
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with: {persist-credentials: false}
      # actions/setup-go v6.5.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.27.0'
          cache: true
      # docker/login-action v4.5.1. No Docker Hub credentials exist in this
      # repo (CHAOS-4855) -- this authenticates only to the ghcr mirror, which
      # GITHUB_TOKEN already has read access to.
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # CHAOS-3859 sol review F1: deploy/compose/acr_db_init_integration_test.go
      # shells out to psql/pg_isready to prove acr-db-init.sh's runtime-acl
      # grants against a real Postgres. Without this, that test's own
      # "absent tool means skip, not fail" convention (see its own doc
      # comment) would let it skip green in CI forever -- the exact
      # skip-reads-as-ok trap the grant proof exists to close. Both the
      # unit and race jobs run this suite, so both install the client.
      - name: Install PostgreSQL client for the compose ACL integration test
        run: |
          set -euo pipefail
          # The runner image already ships the PostgreSQL 16 client binaries;
          # apt was only fetching the thin `postgresql-client` metapackage on
          # top of them. Splitting one job into several multiplied that
          # network call across every job that runs the suite, and a wedged
          # Ubuntu mirror then stalls each of them (observed: 18+ minutes on
          # `apt-get update` while every other lane finished). Use what is
          # already installed, and only reach for apt when it genuinely is
          # missing -- the step still fails, rather than skipping green, if
          # the tools cannot be provided either way.
          if command -v psql >/dev/null 2>&1 \
            && command -v pg_isready >/dev/null 2>&1; then
            psql --version
            pg_isready --version
            exit 0
          fi
          timeout 300 sudo apt-get update
          timeout 300 sudo apt-get install --no-install-recommends -y \
            postgresql-client
          psql --version
          pg_isready --version
      # The plain non-race run and the coverage run used to be two separate
      # cold `-count=1` runs of the same `./...` suite. They are now one
      # run: gotestsum emits the JSON stream, the JUnit report, and the
      # coverage profile from a single execution, so the failure analysis
      # below, the uploaded reports, and the non-race pass/fail signal all
      # come from this one run. The artifacts still upload with
      # `if: always()` so a failing run still leaves reports to inspect.
      # The shard's package set is computed here rather than baked into the
      # matrix so it is derived from the real `go list ./...` on the runner,
      # the same way the race shards below derive theirs. test-shard.sh
      # refuses to emit a partition at all if that listing fails, so a broken
      # package can never quietly shrink this shard's suite; and this
      # assignment runs before the `set +e` bracket below, so that refusal
      # fails the step instead of being read as a test result.
      - name: Run Go tests with coverage and JUnit reporting
        id: go-tests
        run: |
          packages="$(scripts/ci/test-shard.sh --with-isolated ${{ matrix.shard }} 4)"
          printf 'unit shard %s/4 packages:\n%s\n' '${{ matrix.shard }}' "$packages"
          set +e
          make test-coverage GOTEST_PKGS="$packages"
          status=$?
          set -e
          failure="$(jq -r '
            select(.Action == "fail") |
            if .Test then (.Package + "/" + .Test) else .Package end
          ' .tmp/coverage/go-test.json | head -n 1)"
          test -n "$failure" || failure=unknown
          failure="$(printf '%s' "$failure" | tr '\r\n' '  ' | cut -c1-180)"
          printf 'status=%s\nfailure=%s\n' "$status" "$failure" >>"$GITHUB_OUTPUT"
      - name: Enforce Go tests (${{ steps.go-tests.outputs.failure }})
        if: steps.go-tests.outputs.status != '0'
        run: |
          jq -r '
            select(.Action == "output") |
            select(.Output | test("^(--- FAIL:|FAIL[[:space:]]|panic:|fatal error:|[[:space:]]+.*_test\\.go:[0-9]+:|[[:space:]]+Error Trace:|[[:space:]]+Error:|[[:space:]]+Messages:|[[:space:]]+expected|[[:space:]]+actual)")) |
            .Output
          ' .tmp/coverage/go-test.json
          exit 1
      # actions/upload-artifact v7.0.1
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: go-coverage-shard-${{ matrix.shard }}
          path: .tmp/coverage/coverage.xml
          if-no-files-found: warn
          retention-days: 90
      # actions/upload-artifact v7.0.1
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: go-junit-shard-${{ matrix.shard }}
          path: .tmp/coverage/junit.xml
          if-no-files-found: warn
          retention-days: 90

  # Runner-routing contract: race shards stay HOSTED-ONLY for now. Routed
  # to the pool alongside scripts/unit/build/race-devhealthschema in an
  # earlier version of this PR, all 4 shards failed under real concurrent
  # load on bigboy (load ~65 at the time: codex rounds + other suites
  # sharing the box, not a per-shard arm64 defect) -- testcontainers'
  # reaper hit `context deadline exceeded: failed to create network`
  # under contention. Revisit once the shards can run serially against the
  # pool or the pool has headroom measured under realistic concurrent load.
  race:
    # See `unit`'s identical comment: mirror-preflight is now a v1.6 pair,
    # exactly one leg runs, this job runs unconditionally and needs
    # whichever leg succeeded.
    needs:
      - mirror-preflight-hosted
      - mirror-preflight-self-hosted
    if: >-
      !cancelled()
      && (needs.mirror-preflight-hosted.result == 'success'
      || needs.mirror-preflight-self-hosted.result == 'success')
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    name: race (shard ${{ matrix.shard }} of 4)
    runs-on: ubuntu-latest
    env:
      # CHAOS-4855: see the identical env on the unit job above -- the race
      # shards run the same testcontainers-backed suite, partitioned.
      # CHAOS-4855 R1: see the unit job's env above for why this is
      # ghcr.io/<owner>/<repo>, not the flat ghcr.io/<owner>.
      TESTCONTAINERS_HUB_IMAGE_NAME_PREFIX: ghcr.io/${{ github.repository }}
    steps:
      # actions/checkout v7.0.0
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with: {persist-credentials: false}
      # actions/setup-go v6.5.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.27.0'
          cache: true
      # docker/login-action v4.5.1. No Docker Hub credentials exist in this
      # repo (CHAOS-4855) -- this authenticates only to the ghcr mirror, which
      # GITHUB_TOKEN already has read access to.
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # CHAOS-3859 sol review F1: deploy/compose/acr_db_init_integration_test.go
      # shells out to psql/pg_isready to prove acr-db-init.sh's runtime-acl
      # grants against a real Postgres. Without this, that test's own
      # "absent tool means skip, not fail" convention (see its own doc
      # comment) would let it skip green in CI forever -- the exact
      # skip-reads-as-ok trap the grant proof exists to close. Both the
      # unit and race jobs run this suite, so both install the client.
      - name: Install PostgreSQL client for the compose ACL integration test
        run: |
          set -euo pipefail
          # The runner image already ships the PostgreSQL 16 client binaries;
          # apt was only fetching the thin `postgresql-client` metapackage on
          # top of them. Splitting one job into several multiplied that
          # network call across every job that runs the suite, and a wedged
          # Ubuntu mirror then stalls each of them (observed: 18+ minutes on
          # `apt-get update` while every other lane finished). Use what is
          # already installed, and only reach for apt when it genuinely is
          # missing -- the step still fails, rather than skipping green, if
          # the tools cannot be provided either way.
          if command -v psql >/dev/null 2>&1 \
            && command -v pg_isready >/dev/null 2>&1; then
            psql --version
            pg_isready --version
            exit 0
          fi
          timeout 300 sudo apt-get update
          timeout 300 sudo apt-get install --no-install-recommends -y \
            postgresql-client
          psql --version
          pg_isready --version
      # The shuffle seed and the -timeout semantics are unchanged from the
      # single-job run; only the package set is partitioned, four ways, by
      # scripts/ci/test-shard.sh, so each shard still runs a real subset of
      # `go list ./...` under -race with the same deterministic shuffle.
      - name: Run race and deterministic shuffle tests
        run: |
          set -euo pipefail
          packages="$(scripts/ci/test-shard.sh ${{ matrix.shard }} 4)"
          printf 'shard %s/4 packages:\n%s\n' '${{ matrix.shard }}' "$packages"
          make test-race GOTEST_PKGS="$packages"

  # CHAOS-3974: internal/contextfabric/devhealthschema's full-repo
  # declaration-closure tests walk every file in the module, so their cost
  # under -race scales with the module's total .go file count rather than
  # with this package's own size. Sharing a race-matrix shard meant that
  # growth silently ate into a GOTEST_TIMEOUT budget the walk did not own
  # -- and other packages the round-robin happened to place beside it paid
  # for it too (the shard could also draw testcontainer-heavy packages,
  # compounding contention). CHAOS-3972 already hit the shared ceiling once
  # and the fix then was to raise GOTEST_TIMEOUT for every shard. This job
  # gives the walk its own scope and its own -timeout instead, so the next
  # time the repo grows only this job's budget has to grow -- the race
  # matrix's shared GOTEST_TIMEOUT never has to move again on this
  # package's account. scripts/ci/test-shard.sh excludes this package from
  # the round-robin split above (isolated_packages) so it is tested here
  # and only here; scripts/ci/test-shard-closure.sh proves the two together
  # still cover the whole module exactly once.
  #
  # Runner-routing contract v1.6: this job now shares its identity with a
  # `-self-hosted` twin below via a `name:` override and mutually
  # exclusive `if:` gates -- see that job's own comment for the pool leg,
  # and `verify`'s comment for the aggregator-side of the pair. No poller:
  # this replaces the v1.5.1 cross-workflow wait/claim pattern
  # (#399/#402/#404/#410), which is retired in this same change.
  race-devhealthschema-hosted:
    name: race (devhealthschema, isolated scope)
    if: >-
      vars.SELF_HOSTED_RUNNERS != 'enabled'
      || (github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.full_name != github.repository)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with: {persist-credentials: false}
      # actions/setup-go v6.5.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.27.0'
          cache: true
      - name: Run isolated devhealthschema race suite
        run: |
          set -euo pipefail
          packages="$(scripts/ci/test-shard.sh isolated)"
          printf 'isolated packages:\n%s\n' "$packages"
          make test-race GOTEST_PKGS="$packages" GOTEST_TIMEOUT=900s

  # The self-hosted leg -- the pilot for the whole v1.5.1/v1.6 routing
  # (#399/#402/#404), the one heavy acr job with no image-architecture
  # risk: it starts no containers, logs in to no registry, needs no psql
  # client. Measured pool wall under load: 9m51s-11m30s across this
  # lane's history; 25min timeout already carries ample headroom (kept
  # unchanged from v1.5.1's tuned value).
  race-devhealthschema-self-hosted:
    name: race (devhealthschema, isolated scope)
    if: >-
      vars.SELF_HOSTED_RUNNERS == 'enabled'
      && (github.event_name != 'pull_request'
      || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, oci-arc-runners]
    timeout-minutes: 25
    steps:
      # actions/checkout v7.0.0 -- the same pin the hosted leg uses. On a
      # pull request this checks out the merge ref, exactly as the hosted
      # leg does, so both legs test the identical tree.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with: {persist-credentials: false}
      # cache:false -- the pool mounts a shared GOMODCACHE/GOCACHE hostPath
      # (helm rev 6) that every self-hosted job reads and writes
      # concurrently; setup-go's own cache restore/save races that live
      # mount and can corrupt it for every other job on the pool. The
      # mount already provides the cache; this only installs the toolchain.
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.27.0'
          cache: false
      # A mislabeled or reassigned runner would make this job's result mean
      # something other than what it claims. The pool is arm64-only by
      # construction (OCI Ampere), so anything else is a misconfiguration to
      # fail loudly on, not to quietly validate the wrong architecture.
      - name: Confirm this runner is actually arm64
        run: |
          set -euo pipefail
          uname -m
          arch="$(go env GOARCH)"
          if [ "${arch}" != "arm64" ]; then
            echo "expected GOARCH=arm64 on oci-arc-runners, got '${arch}'" >&2
            exit 1
          fi
      # The result-line count is the salted positive, and it is keyed on the
      # POPULATION rather than on a pattern: `go test` exits 0 having run
      # nothing when its package list is empty, so an edit to test-shard.sh's
      # isolated_packages that emptied this set would leave this job green
      # having proved nothing. Asserting one `ok` line per package proves
      # every package the shard list names actually produced a result.
      - name: Run the isolated devhealthschema race suite on arm64
        run: |
          set -euo pipefail
          packages="$(scripts/ci/test-shard.sh isolated)"
          printf 'isolated packages:\n%s\n' "$packages"
          expected="$(printf '%s' "$packages" | wc -w | tr -d '[:space:]')"
          if [ "$expected" -eq 0 ]; then
            echo "test-shard.sh isolated printed no packages -- refusing to report a pass over an empty set" >&2
            exit 1
          fi
          out="${RUNNER_TEMP}/race-output.txt"
          make test-race GOTEST_PKGS="$packages" GOTEST_TIMEOUT=900s 2>&1 | tee "$out"
          passed="$(grep -c '^ok' "$out" || true)"
          printf 'packages expected: %s, packages reporting ok: %s\n' "$expected" "$passed"
          if [ "$passed" -ne "$expected" ]; then
            echo "expected one result line per isolated package; a package that produced no result means this job proved less than it claims" >&2
            exit 1
          fi

  build-hosted:
    name: build
    if: >-
      vars.SELF_HOSTED_RUNNERS != 'enabled'
      || (github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.full_name != github.repository)
    runs-on: ubuntu-latest
    needs: mirror-preflight-hosted
    env:
      # CHAOS-4855: `make hosted-integration` below sets ACR_HOSTED_INTEGRATION=1,
      # which starts real postgres/clickhouse testcontainers fixtures
      # (cmd/acr-api/hosted_real_integration_test.go) -- same mirror redirect
      # as the unit/race jobs.
      # CHAOS-4855 R1: see the unit job's env above for why this is
      # ghcr.io/<owner>/<repo>, not the flat ghcr.io/<owner>.
      TESTCONTAINERS_HUB_IMAGE_NAME_PREFIX: ghcr.io/${{ github.repository }}
    steps:
      # actions/checkout v7.0.0
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with: {persist-credentials: false}
      # actions/setup-go v6.5.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.27.0'
          cache: true
      # docker/login-action v4.5.1. No Docker Hub credentials exist in this
      # repo (CHAOS-4855) -- this authenticates only to the ghcr mirror, which
      # GITHUB_TOKEN already has read access to.
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Cross-compile supported targets
        run: make crosscompile
      - name: Build all shipped commands
        run: make build
      - name: Test deterministic native-client harness
        run: make clients-real
      - name: Test hosted runtime with disposable dependencies
        run: make hosted-integration

  # The self-hosted leg. Same four make targets as hosted, in the same
  # order. Measured pool wall under load: 4m30s-4m52s across this lane's
  # history; timeout sized well above that.
  build-self-hosted:
    name: build
    if: >-
      vars.SELF_HOSTED_RUNNERS == 'enabled'
      && (github.event_name != 'pull_request'
      || github.event.pull_request.head.repo.full_name == github.repository)
    needs: mirror-preflight-self-hosted
    runs-on: [self-hosted, oci-arc-runners]
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    env:
      TESTCONTAINERS_HUB_IMAGE_NAME_PREFIX: ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with: {persist-credentials: false}
      # cache:false -- the pool mounts a shared GOMODCACHE/GOCACHE hostPath
      # (helm rev 6) that every self-hosted job reads and writes
      # concurrently; setup-go's own cache restore/save races that live
      # mount and can corrupt it for every other job on the pool. The
      # mount already provides the cache; this only installs the toolchain.
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.27.0'
          cache: false
      - name: Confirm this runner is actually arm64
        run: |
          set -euo pipefail
          arch="$(go env GOARCH)"
          if [ "${arch}" != "arm64" ]; then
            echo "expected GOARCH=arm64 on oci-arc-runners, got '${arch}'" >&2
            exit 1
          fi
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Cross-compile supported targets
        run: make crosscompile
      - name: Build all shipped commands
        run: make build
      - name: Test deterministic native-client harness
        run: make clients-real
      - name: Test hosted runtime with disposable dependencies
        run: make hosted-integration

  contracts-hosted:
    name: contracts
    if: >-
      vars.SELF_HOSTED_RUNNERS != 'enabled'
      || (github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.full_name != github.repository)
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v7.0.0
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with: {persist-credentials: false}
      # actions/setup-go v6.5.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.27.0'
          cache: true
      # Must run before anything else in this job that could dirty the
      # worktree: the script refuses to start unless `git status --porcelain`
      # is empty.
      - name: Verify canonical receipts
        run: make canonical-receipts
      - name: Verify wire contracts
        run: make contract-test
      - name: Verify CodeGraph contract
        run: make codegraph-contract
      # CHAOS-4100. Runs HERE, not only in `make verify`: this job is what
      # actually executes script gates in CI, and a target that exists only
      # in the local aggregate protects nothing on a pull request. It is
      # also the only place the plan-only path is exercised in an
      # environment with no sibling dev-health checkout and no ops/.env --
      # which is the exact shape that broke it, and the shape no developer
      # machine reproduces.
      - name: Verify trial shard layout
        run: make shard-plan
      - name: Verify full-stack offline contract
        run: make fullstack-contract
      # CHAOS-3273 L3: the endpoint-profile gate (guardrail G-1) validates
      # endpoint-profiles.acr.json against a closed vocabulary OWNED BY OPS
      # (endpoint-profile.schema.json, credential-classes.json) that this
      # repo does not vendor. A full checkout of dev-health-ops would work
      # too, but would silently track ops's moving default branch -- any
      # push to ops's main would change what this job validates against
      # with no acr commit recording that it happened. Pin instead: the
      # exact ops commit this repo trusts lives in ONE place
      # (ci/ops-contract.pin), a sparse checkout fetches ONLY the two
      # contract paths at that pin (not the whole ops repo -- ops and acr
      # stay two independently-triggered CI graphs, never a combined job),
      # and bumping the pin is the acr-side commit that makes a contract
      # change visible and re-runs this gate against it. Both repos are
      # public (verified via `gh repo view`), so this checkout needs no
      # token.
      - name: Read the pinned ops-owned contract commit
        id: ops-pin
        run: echo "sha=$(tr -d '[:space:]' < ci/ops-contract.pin)" >> "$GITHUB_OUTPUT"
      # A raw actions/checkout failure on an unresolvable ref reads as a
      # cryptic git error with no context. Probe first with a message that
      # distinguishes the ONE expected failure mode (the pinning lane's
      # ops-side work has not merged to origin/main yet -- see
      # ci/ops-contract.pin's own commit message for which lane/branch)
      # from every other one (a stale or simply wrong pin), so a red run
      # here is never mistaken for a broken mechanism.
      # A pin that accepts any resolvable ref is not a pin. Merge-gate
      # finding (CHAOS-3273, terra round on 896ca76e, EXECUTED): with only
      # the resolvability probe below, putting the literal `main` in
      # ci/ops-contract.pin passed and the sparse checkout then followed
      # ops's default branch -- silently reintroducing exactly the floating
      # ref this whole mechanism exists to reject, while the file, the
      # commit message and this comment block all claimed otherwise. A
      # mechanism documented as bought must actually be bought, so the
      # shape is checked BEFORE the ref is resolved: a branch or tag name
      # is rejected on its face, not by whether it happens to resolve.
      - name: Verify the pin names an immutable commit, not a floating ref
        run: |
          set -euo pipefail
          sha="${{ steps.ops-pin.outputs.sha }}"
          if ! printf '%s' "$sha" | grep -Eq '^[0-9a-f]{40}$'; then
            cat >&2 <<EOF
          ci/ops-contract.pin must name a full 40-character lowercase commit
          SHA. It currently holds: $sha

          REJECTED CASE: a branch name or tag (e.g. "main", "v1.2.0") -- any
          floating ref. Those resolve perfectly well, which is the problem:
          the checkout would then track whatever that ref points at, so a
          push to dev-health-ops would change what this job validates
          against with no commit in this repo recording that it happened.
          The pin exists to make a contract change an acr-side commit. An
          abbreviated SHA is rejected for the same reason it is rejected in
          go.mod: it is not stable against future collisions.

          Put the full SHA of the ops commit this repo trusts.
          EOF
            exit 1
          fi
          # git ls-remote only resolves NAMED refs (branches/tags), never
          # an arbitrary commit SHA -- verified against ops's own current
          # origin/main tip, which it reports as absent too. A bare
          # `git fetch <url> <sha>` DOES work for a reachable, full 40-char
          # SHA on a remote that allows it (GitHub.com does, for public
          # repos) -- verified the same way, against the same tip.
          if git fetch --depth 1 https://github.com/full-chaos/dev-health-ops.git "$sha" >/dev/null 2>&1; then
            exit 0
          fi
          cat >&2 <<EOF
          ci/ops-contract.pin names $sha, which does not exist on
          full-chaos/dev-health-ops's remote (git fetch found nothing).

          EXPECTED failure mode: the ops-side lane that produced this pin
          has not merged to ops's origin/main yet. ci/ops-contract.pin's
          own commit message names the exact ops branch/lane this SHA came
          from -- once that lane merges, re-pin this file to the merged
          SHA and this step passes.

          If that ops lane HAS already merged and this still fails, the
          pin itself is stale or wrong: check it against ops's actual
          history. Do not "fix" this by pointing the pin at ops main or by
          removing/weakening the pin -- see ci/ops-contract.pin's commit
          message for why a floating ref was rejected.
          EOF
          exit 1
      # actions/checkout v7.0.0 -- public repo, no token needed. Sparse,
      # non-cone mode: fetches exactly the two listed file paths, not a
      # directory tree.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          repository: full-chaos/dev-health-ops
          ref: ${{ steps.ops-pin.outputs.sha }}
          path: .ops-contract
          persist-credentials: false
          sparse-checkout: |
            contracts/auth/v1/endpoint-profile.schema.json
            contracts/auth/v1/credential-classes.json
            contracts/auth/v1/credential-classes.schema.json
          sparse-checkout-cone-mode: false
      # credential-classes.schema.json joined this list at the merge-gate
      # round: the gate validated the endpoint-profile inventory against its
      # schema but loaded the credential-class document only to harvest ids,
      # so a vocabulary whose entries had lost their issuer, validator,
      # lifecycle authority and allowed route set still passed. Validating it
      # needs its schema present, so a missing entry here would turn a real
      # check back into an absent one.
      - name: Verify endpoint-profile inventory against the pinned ops contract
        env:
          ACR_ENDPOINT_PROFILE_SCHEMA: ${{ github.workspace }}/.ops-contract/contracts/auth/v1/endpoint-profile.schema.json
          ACR_CREDENTIAL_CLASSES: ${{ github.workspace }}/.ops-contract/contracts/auth/v1/credential-classes.json
          ACR_CREDENTIAL_CLASSES_SCHEMA: ${{ github.workspace }}/.ops-contract/contracts/auth/v1/credential-classes.schema.json
          # ACR_CONTRACT_GATE marks THIS step as the one job that is
          # required to run the real-tree contract proof, and is the
          # predicate the proof's fail-closed branch keys on.
          #
          # It replaces a check on `CI`, which was the wrong predicate:
          # `CI` is set in every job on every runner, but the sparse
          # checkout that delivers the three ops-owned inputs exists only
          # here -- so the proof failed in `unit` and in every `race`
          # shard, which is a red build that says nothing about the
          # contract. Keying on a marker only this step sets means the
          # proof fails loudly exactly where it is supposed to run, and
          # skips (with its reason) where it is not.
          #
          # "Then a deleted step means the gate silently never runs" is the
          # obvious objection, and it is why scripts/ci/test-workflow-contract.sh
          # asserts this step exists and sets all three input paths plus
          # this marker. The runtime guard proves the inputs ARRIVED; the
          # workflow-contract test proves the step still EXISTS. Neither
          # alone closes the class.
          ACR_CONTRACT_GATE: required
        run: go test ./ci/checkendpointprofiles/...

  # The self-hosted leg. Container-free (no docker login, no
  # testcontainers) -- confirmed by grepping the job and every `make`
  # target it runs for docker/testcontainers references, none found.
  # Same steps as hosted, same order, including the sparse checkout of
  # the public full-chaos/dev-health-ops repo (no token needed) and the
  # `git fetch` probe against it -- both plain network operations, no
  # different on arm64. Measured pool wall under load: 8m23s in this
  # lane's earlier (reverted, pre-v1.6) revision; timeout sized from that.
  contracts-self-hosted:
    name: contracts
    if: >-
      vars.SELF_HOSTED_RUNNERS == 'enabled'
      && (github.event_name != 'pull_request'
      || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, oci-arc-runners]
    timeout-minutes: 17
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with: {persist-credentials: false}
      # cache:false -- see race-devhealthschema-self-hosted's comment above
      # for why (shared GOMODCACHE/GOCACHE hostPath mount, helm rev 6).
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.27.0'
          cache: false
      - name: Confirm this runner is actually arm64
        run: |
          set -euo pipefail
          arch="$(go env GOARCH)"
          if [ "${arch}" != "arm64" ]; then
            echo "expected GOARCH=arm64 on oci-arc-runners, got '${arch}'" >&2
            exit 1
          fi
      - name: Verify canonical receipts
        run: make canonical-receipts
      - name: Verify wire contracts
        run: make contract-test
      - name: Verify CodeGraph contract
        run: make codegraph-contract
      - name: Verify trial shard layout
        run: make shard-plan
      - name: Verify full-stack offline contract
        run: make fullstack-contract
      - name: Read the pinned ops-owned contract commit
        id: ops-pin
        run: echo "sha=$(tr -d '[:space:]' < ci/ops-contract.pin)" >> "$GITHUB_OUTPUT"
      - name: Verify the pin names an immutable commit, not a floating ref
        run: |
          set -euo pipefail
          sha="${{ steps.ops-pin.outputs.sha }}"
          if ! printf '%s' "$sha" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "ci/ops-contract.pin must name a full 40-character lowercase commit SHA. It currently holds: $sha" >&2
            exit 1
          fi
          if git fetch --depth 1 https://github.com/full-chaos/dev-health-ops.git "$sha" >/dev/null 2>&1; then
            exit 0
          fi
          echo "ci/ops-contract.pin names $sha, which does not exist on full-chaos/dev-health-ops's remote (git fetch found nothing)." >&2
          exit 1
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          repository: full-chaos/dev-health-ops
          ref: ${{ steps.ops-pin.outputs.sha }}
          path: .ops-contract
          persist-credentials: false
          sparse-checkout: |
            contracts/auth/v1/endpoint-profile.schema.json
            contracts/auth/v1/credential-classes.json
            contracts/auth/v1/credential-classes.schema.json
          sparse-checkout-cone-mode: false
      - name: Verify endpoint-profile inventory against the pinned ops contract
        env:
          ACR_ENDPOINT_PROFILE_SCHEMA: ${{ github.workspace }}/.ops-contract/contracts/auth/v1/endpoint-profile.schema.json
          ACR_CREDENTIAL_CLASSES: ${{ github.workspace }}/.ops-contract/contracts/auth/v1/credential-classes.json
          ACR_CREDENTIAL_CLASSES_SCHEMA: ${{ github.workspace }}/.ops-contract/contracts/auth/v1/credential-classes.schema.json
          ACR_CONTRACT_GATE: required
        run: go test ./ci/checkendpointprofiles/...

  container-contract-smoke:
    runs-on: ubuntu-24.04
    # See `unit`'s identical comment: mirror-preflight is now a v1.6 pair,
    # exactly one leg runs, this job runs unconditionally and needs
    # whichever leg succeeded.
    needs:
      - mirror-preflight-hosted
      - mirror-preflight-self-hosted
    if: >-
      !cancelled()
      && (needs.mirror-preflight-hosted.result == 'success'
      || needs.mirror-preflight-self-hosted.result == 'success')
    env:
      # CHAOS-4855: golang (Dockerfile), tonistiigi/binfmt, moby/buildkit,
      # aquasec/trivy, anchore/syft, and the verify.sh postgres probe all
      # redirect at the ghcr.io/full-chaos mirror -- see docs/container-images.md.
      # CHAOS-4855 R1: ghcr.io/<owner>/<repo>, not the flat ghcr.io/<owner> --
      # see the unit job's TESTCONTAINERS_HUB_IMAGE_NAME_PREFIX comment above
      # for why (GHCR package write access is per-creating-repo, not shared
      # org-wide; the flat path 403'd against an existing ops-owned package).
      ACR_IMAGE_MIRROR_PREFIX: ghcr.io/${{ github.repository }}/
    steps:
      # actions/checkout v7.0.0
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with: {persist-credentials: false}
      # docker/login-action v4.5.1. No Docker Hub credentials exist in this
      # repo (CHAOS-4855) -- this authenticates only to the ghcr mirror, which
      # GITHUB_TOKEN already has read access to. Login persists to this job's
      # docker credential store, so every subsequent docker pull in this job
      # (setup-qemu-action, setup-buildx-action's driver image, the
      # Dockerfile's golang FROM during the build, and scan.sh/verify.sh's
      # trivy/syft/postgres pulls) resolves against ghcr with no further
      # per-step auth -- works whether the mirrored package is public or
      # private.
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # docker/setup-qemu-action v3.6.0
      - uses: docker/setup-qemu-action@29109295f81e9208d7d86ff1c6c12d2833863392
        with:
          # yamllint disable rule:line-length
          image: ${{ env.ACR_IMAGE_MIRROR_PREFIX }}tonistiigi/binfmt:qemu-v10.2.3@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0
          # yamllint enable rule:line-length
          cache-image: false
      - name: Install checksum-verified Docker Buildx
        env:
          BUILDX_VERSION: v0.35.0
          BUILDX_SHA256: >-
            d41ece72044243b4f58b343441ae37446d9c29a7d6b5e11c61847bbcf8f7dfda
          BUILDX_URL: >-
            https://github.com/docker/buildx/releases/download/v0.35.0/buildx-v0.35.0.linux-amd64
        run: |
          mkdir -p "$RUNNER_TEMP/buildx" "$HOME/.docker/cli-plugins"
          curl --fail --location --proto '=https' --tlsv1.2 \
            "$BUILDX_URL" \
            --output "$RUNNER_TEMP/buildx/docker-buildx"
          printf '%s  %s\n' \
            "$BUILDX_SHA256" "$RUNNER_TEMP/buildx/docker-buildx" \
            | sha256sum --check -
          install -m 0755 \
            "$RUNNER_TEMP/buildx/docker-buildx" \
            "$HOME/.docker/cli-plugins/docker-buildx"
          docker buildx version | grep -F "$BUILDX_VERSION"
      # docker/setup-buildx-action v3.11.1
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435  # yamllint disable-line rule:line-length
        with:
          # yamllint disable rule:line-length
          driver-opts: image=${{ env.ACR_IMAGE_MIRROR_PREFIX }}moby/buildkit:v0.31.0@sha256:a095b3d11ce1a9a05b6064ef515dfca0291ec5bcf2ea8178da8f6461924294e1
          # yamllint enable rule:line-length
          cache-binary: false
      # `make container-pins` is deliberately not run here. It resolved each reviewed tag over
      # the network and failed when the digest had moved — but the Dockerfile and the compose
      # files pin every image by digest, so a moved tag cannot change what is built. It
      # protected nothing and failed on upstream's release cadence: nine of the reviewed
      # references are on tags that move by design (`:latest`, `nonroot`, and rolling series
      # like `postgres:18-alpine`). A red gate that fires for a reason unrelated to the change
      # under review trains reviewers to click through, which costs more than the signal was
      # worth. The pin list itself is still load-bearing and still enforced offline:
      # scripts/e2e/test-compose.sh requires every compose image to appear in it, which is what
      # keeps an unreviewed image out of the stack.
      - name: Validate container contract and native runtime smoke tests
        run: make container-test


---
name: ci

"on":
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v7.0.0
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with: {persist-credentials: false}
      # actions/setup-go v6.5.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.26.5'
          cache: false
      - name: Check release setup script modes
        run: |
          test -x scripts/release/setup-cosign-key.sh
          test -x scripts/release/export-tag-signing-key.sh
          test -x scripts/release/publish-private-release.sh
          test -x scripts/release/publish-private-image.sh
          test -x scripts/release/publish-ci-release.sh
          test -x scripts/release/revoke-private-release.sh
          test -x scripts/release/assemble-release-assets.sh
          test -x scripts/release/test-assemble-release-assets.sh
          test -x scripts/release/test-container-release-manifest.sh
          test -x scripts/release/test-publish-private-image.sh
          test -x scripts/release/test_release_scripts.sh
          test -x scripts/release/verify-mcp-binary-approval.sh
          test -x scripts/release/write-container-release-manifest.sh
      - name: Shellcheck CI release publisher
        run: |
          # SC2016: jq receives named arguments whose $names must remain literal
          # inside single-quoted jq programs rather than expand in the shell.
          shellcheck -x -e SC2016 scripts/release/publish-ci-release.sh
      - name: Shellcheck release policy contract tests
        run: |
          # SC2016: this test intentionally searches source files for literal
          # shell and jq variables such as $tag, $name, and $release_digest.
          shellcheck -x -e SC2016 scripts/release/test_release_scripts.sh
      - name: Shellcheck existing release scripts
        run: |
          find scripts/release -maxdepth 1 -type f -name '*.sh' \
            ! -name 'publish-ci-release.sh' \
            ! -name 'test_release_scripts.sh' -print0 \
            | xargs -0 shellcheck -x
      - name: Shellcheck container scripts
        run: |
          # SC2016: test-contract.sh intentionally greps scan.sh for literal
          # shell variables such as $trivy_db_mirror and $metadata.
          find scripts/container -type f -name '*.sh' -print0 \
            | xargs -0 shellcheck -x -e SC2016
      - name: Test release asset assembly
        run: scripts/release/test-assemble-release-assets.sh
      - name: Test container release manifest
        run: scripts/release/test-container-release-manifest.sh
      - name: Test private image publisher
        run: scripts/release/test-publish-private-image.sh
      - name: Test release policy contracts
        run: scripts/release/test_release_scripts.sh
      - name: Test optional MCP binary approval gate
        run: |
          approval_gates=scripts/release/test-remote-gates.sh
          "$approval_gates" --mode dry-run \
            --fixtures testdata/release-approvals
          "$approval_gates" --mode reject-invalid \
            --fixtures testdata/release-approvals
      - name: Verify Go formatting
        run: make fmt-check
      - name: Vet Go packages
        run: make vet
      - name: Analyze Go tests
        id: go-tests
        run: |
          set +e
          go test -count=1 -json ./... >"$RUNNER_TEMP/go-test.json"
          status=$?
          set -e
          failure="$(jq -r '
            select(.Action == "fail") |
            if .Test then (.Package + "/" + .Test) else .Package end
          ' "$RUNNER_TEMP/go-test.json" | head -n 1)"
          test -n "$failure" || failure=unknown
          failure="$(printf '%s' "$failure" | tr '\r\n' '  ' | cut -c1-180)"
          printf 'status=%s\nfailure=%s\n' "$status" "$failure" >>"$GITHUB_OUTPUT"
      - name: Enforce Go tests (${{ steps.go-tests.outputs.failure }})
        if: steps.go-tests.outputs.status != '0'
        run: |
          jq -r '
            select(.Action == "output") |
            select(.Output | test("^(--- FAIL:|FAIL[[:space:]]|panic:|fatal error:|[[:space:]]+.*_test\\.go:[0-9]+:|[[:space:]]+Error Trace:|[[:space:]]+Error:|[[:space:]]+Messages:|[[:space:]]+expected|[[:space:]]+actual)")) |
            .Output
          ' "$RUNNER_TEMP/go-test.json"
          exit 1
      - name: Run race and deterministic shuffle tests
        run: make test-race
      - name: Cross-compile supported targets
        run: make crosscompile
      - name: Verify wire contracts
        run: make contract-test
      - name: Verify CodeGraph contract
        run: make codegraph-contract
      - name: Verify canonical receipts
        run: make canonical-receipts
      - name: Verify full-stack offline contract
        run: make fullstack-contract
      - name: Build all shipped commands
        run: make build
      - name: Test deterministic native-client harness
        run: make clients-real
      - name: Test hosted runtime with disposable dependencies
        run: make hosted-integration
      - name: Check known Go vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.5.0 ./...
      # Reporting steps run last and with if: always() so a failure or flake
      # in coverage/JUnit generation or upload can never skip the product
      # verification gates above (crosscompile, contract-test, build,
      # govulncheck, etc.) -- those must run to completion (or fail on their
      # own terms) regardless of whether this reporting tail succeeds. This
      # also means the reports still get generated and uploaded when an
      # earlier gate step failed and stopped the job, giving CI a JUnit/
      # coverage artifact to inspect for exactly the run that failed.
      - name: Generate coverage and JUnit reports
        if: always()
        run: make test-coverage
      # actions/upload-artifact v7.0.1
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: go-coverage
          path: .tmp/coverage/coverage.xml
          if-no-files-found: warn
          retention-days: 90
      # actions/upload-artifact v7.0.1
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: go-junit
          path: .tmp/coverage/junit.xml
          if-no-files-found: warn
          retention-days: 90

  containers:
    runs-on: ubuntu-24.04
    steps:
      # actions/checkout v7.0.0
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with: {persist-credentials: false}
      # docker/setup-qemu-action v3.6.0
      - uses: docker/setup-qemu-action@29109295f81e9208d7d86ff1c6c12d2833863392
        with:
          # yamllint disable rule:line-length
          image: docker.io/tonistiigi/binfmt:qemu-v10.2.3@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0
          # yamllint enable rule:line-length
          cache-image: false
      - name: Install checksum-verified Docker Buildx
        env:
          BUILDX_VERSION: v0.35.0
          BUILDX_SHA256: >-
            d41ece72044243b4f58b343441ae37446d9c29a7d6b5e11c61847bbcf8f7dfda
          BUILDX_URL: >-
            https://github.com/docker/buildx/releases/download/v0.35.0/buildx-v0.35.0.linux-amd64
        run: |
          mkdir -p "$RUNNER_TEMP/buildx" "$HOME/.docker/cli-plugins"
          curl --fail --location --proto '=https' --tlsv1.2 \
            "$BUILDX_URL" \
            --output "$RUNNER_TEMP/buildx/docker-buildx"
          printf '%s  %s\n' \
            "$BUILDX_SHA256" "$RUNNER_TEMP/buildx/docker-buildx" \
            | sha256sum --check -
          install -m 0755 \
            "$RUNNER_TEMP/buildx/docker-buildx" \
            "$HOME/.docker/cli-plugins/docker-buildx"
          docker buildx version | grep -F "$BUILDX_VERSION"
      # docker/setup-buildx-action v3.11.1
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435  # yamllint disable-line rule:line-length
        with:
          # yamllint disable rule:line-length
          driver-opts: image=moby/buildkit:v0.31.0@sha256:a095b3d11ce1a9a05b6064ef515dfca0291ec5bcf2ea8178da8f6461924294e1
          # yamllint enable rule:line-length
          cache-binary: false
      # `make container-pins` is deliberately not run here. It resolved each reviewed tag over
      # the network and failed when the digest had moved — but the Dockerfile and the compose
      # files pin every image by digest, so a moved tag cannot change what is built. It
      # protected nothing and failed on upstream's release cadence: nine of the reviewed
      # references are on tags that move by design (`:latest`, `nonroot`, and rolling series
      # like `postgres:18-alpine`). A red gate that fires for a reason unrelated to the change
      # under review trains reviewers to click through, which costs more than the signal was
      # worth. The pin list itself is still load-bearing and still enforced offline:
      # scripts/e2e/test-compose.sh requires every compose image to appear in it, which is what
      # keeps an unreviewed image out of the stack.
      - name: Validate container contract and native runtime smoke tests
        run: make container-test
      - name: Rebuild the clean commit reproducibly
        run: make container-reproducible
      - name: Build and validate multi-architecture OCI archives
        run: make container-oci
      - name: Scan for HIGH/CRITICAL vulnerabilities and generate SPDX SBOMs
        env:
          CONTAINER_SCAN_OCI_ROOT: .tmp/container-oci
        run: make container-scan
      # actions/upload-artifact v7.0.1
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: container-reports
          # container-reports/ is the atomically-published known-good
          # generation (populated only on a fully successful scan).
          # container-scan-attempt*/ is scan.sh's own work-in-progress
          # report dir (CHAOS-3772 F2), aged out after 24h rather than
          # cleaned up immediately (R4-2): it carries whatever the run
          # managed to write -- including a resolved but rejected
          # trivy-db snapshot -- even when the job failed before
          # publication.
          path: |
            .tmp/container-reports/
            .tmp/container-scan-attempt*/
          if-no-files-found: warn
          retention-days: 7

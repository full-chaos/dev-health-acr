---
name: ci

"on":
  pull_request:

permissions:
  contents: read
  packages: read

jobs:
  served-state-row:
    name: served-state row on the old pin
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with: {persist-credentials: false}
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.27.2'
          cache: true
      - name: Run the served-state row only
        run: go test -count=1 -timeout 20m -run '^TestReadFactsServesFractionalTeamCountersOnBothColumnTypes$' ./internal/contextfabric/devhealthfacts

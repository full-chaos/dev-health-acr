  verify:
    # Single required gate. Every other job in this workflow must be listed in
    # `needs` and must have actually succeeded: `if: always()` makes this job
    # run even when a lane failed or was skipped, and the check below rejects
    # any result that is not `success`, so a skipped or cancelled lane can
    # never read as green. scripts/ci/test-workflow-contract.sh enforces that
    # every job is listed here, so adding a lane cannot silently escape it.
    #
    # Runner-routing contract v1.6: five of the lanes below (mirror-preflight,
    # scripts, build, contracts, race-devhealthschema) are now PAIRS -- a
    # `-hosted` and a `-self-hosted` job key sharing one `name:` -- with
    # mutually exclusive, exhaustive `if:` gates, so exactly one of each pair
    # runs per workflow run and the other reports `skipped`. Both keys of
    # every pair are listed in `needs` below (scripts/ci/test-workflow-contract.sh
    # pins this), and the assertion script below treats a pair as satisfied
    # when exactly one member succeeded, and fails if either member reports
    # anything other than success/skipped, or if BOTH report skipped (which
    # would mean that lane never ran at all). Ported from ask-dev PR #43's
    # aggregator logic, generalized from one pair to five.
    if: '!cancelled()'
    needs:
      - mirror-preflight-hosted
      - mirror-preflight-self-hosted
      - scripts-hosted
      - scripts-self-hosted
      - lint
      - docs-mermaid
      - unit
      - race
      - race-devhealthschema-hosted
      - race-devhealthschema-self-hosted
      - build-hosted
      - build-self-hosted
      - contracts-hosted
      - contracts-self-hosted
      - container-contract-smoke
      - container-reproducible
      - container-oci-scan
    runs-on: ubuntu-latest
    steps:
      - name: Assert every lane succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
          # v1.6 pair base names -- the job-key prefix shared by each
          # `<base>-hosted` / `<base>-self-hosted` pair.
          PAIRS: mirror-preflight scripts build contracts race-devhealthschema
        run: |
          set -euo pipefail
          failed=0

          for base in $PAIRS; do
            hosted_result="$(printf '%s' "$NEEDS" | jq -r --arg k "${base}-hosted" '.[$k].result // "missing"')"
            pool_result="$(printf '%s' "$NEEDS" | jq -r --arg k "${base}-self-hosted" '.[$k].result // "missing"')"
            printf '%s-hosted: %s\n' "$base" "$hosted_result"
            printf '%s-self-hosted: %s\n' "$base" "$pool_result"
            if [ "$hosted_result" != success ] && [ "$hosted_result" != skipped ]; then
              failed=1
            fi
            if [ "$pool_result" != success ] && [ "$pool_result" != skipped ]; then
              failed=1
            fi
            if [ "$hosted_result" = skipped ] && [ "$pool_result" = skipped ]; then
              printf 'neither %s-hosted nor %s-self-hosted ran\n' "$base" "$base" >&2
              failed=1
            fi
          done

          # Every other lane must be a literal success -- the pairs above are
          # the only jobs allowed to report `skipped` and still pass.
          while IFS=$'\t' read -r job result; do
            case " $PAIRS " in
              *" ${job%-hosted} "*) continue ;;
              *" ${job%-self-hosted} "*) continue ;;
            esac
            printf '%s: %s\n' "$job" "$result"
            if [ "$result" != success ]; then failed=1; fi
          done < <(printf '%s' "$NEEDS" | jq -r 'to_entries[] | [.key, .value.result] | @tsv')

          test "$(printf '%s' "$NEEDS" | jq -r 'length')" -gt 0 || {
            printf 'no lane results were reported\n' >&2; exit 1; }
          test "$failed" -eq 0 || { printf 'at least one lane did not succeed\n' >&2; exit 1; }

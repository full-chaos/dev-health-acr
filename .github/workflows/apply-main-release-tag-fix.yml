---
name: apply-main-release-tag-fix

"on":
  push:
    branches: [agent/fix-main-release-tag]

permissions:
  contents: write

concurrency:
  group: apply-main-release-tag-fix
  cancel-in-progress: true

jobs:
  apply-and-verify:
    if: >-
      github.repository == 'full-chaos/dev-health-acr' &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: agent/fix-main-release-tag
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.26.5'
          cache: false
      - name: Apply valid main GitHub Release tag
        run: |
          set -euo pipefail
          python3 scripts/release/apply-main-release-tag-fix.py
          git diff --check
          cat >"$RUNNER_TEMP/expected-files" <<'EXPECTED_FILES'
          README.md
          docs/container-images.md
          docs/release-notes-template.md
          docs/release-policy.md
          scripts/release/publish-ci-release.sh
          scripts/release/test_release_scripts.sh
          EXPECTED_FILES
          git diff --name-only | LC_ALL=C sort >"$RUNNER_TEMP/actual-files"
          LC_ALL=C sort -o "$RUNNER_TEMP/expected-files" "$RUNNER_TEMP/expected-files"
          diff -u "$RUNNER_TEMP/expected-files" "$RUNNER_TEMP/actual-files"
          git add README.md docs scripts/release/publish-ci-release.sh scripts/release/test_release_scripts.sh
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(release): prefix main GitHub Release tags'
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
      - name: Verify release correction
        run: |
          set -euo pipefail
          shellcheck -x -e SC2016 \
            scripts/release/publish-ci-release.sh \
            scripts/release/test_release_scripts.sh
          scripts/release/test_release_scripts.sh
          bash scripts/docs/verify.sh
          make verify
      - name: Push verified correction
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          git push origin HEAD:agent/fix-main-release-tag

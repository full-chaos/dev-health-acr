name: Context Fabric Reset 0C/0D focused fix

on:
  push:
    branches:
      - agent/chaos-3749-context-fabric-reset-scaffold
    paths:
      - .github/workflows/context-fabric-reset-fix.yml

permissions:
  contents: write
  issues: write

concurrency:
  group: context-fabric-reset-focused-fix
  cancel-in-progress: false

jobs:
  fix-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: agent/chaos-3749-context-fabric-reset-scaffold
          fetch-depth: 0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: go.mod
          cache: true
      - name: Apply focused corrections
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              if old not in text:
                  raise SystemExit(f"expected marker not found in {path}: {old[:160]!r}")
              file.write_text(text.replace(old, new, 1))

          # This test starts from an empty durable checkpoint, so its batch must
          # carry the same empty/current cursor before backend failure is reached.
          replace_once(
              "internal/contextfabric/projector_test.go",
              '''\tcheckpoints := &checkpointStoreStub{}
          \tworker, err := NewProjectionWorker(projectionSourceStub{batch: batch, available: true}, backend, checkpoints, ProjectionWorkerOptions{})''',
              '''\tcheckpoints := &checkpointStoreStub{checkpoint: ProjectionCheckpoint{OrgID: "org_1", Source: "dev-health-ops", Cursor: batch.Cursor}}
          \tworker, err := NewProjectionWorker(projectionSourceStub{batch: batch, available: true}, backend, checkpoints, ProjectionWorkerOptions{})''',
          )

          # Exercise the evidence-closure rule with an otherwise structurally
          # valid driver rather than failing earlier on unrelated driver fields.
          replace_once(
              "internal/contextfabric/model_test.go",
              '''\tresult.Drivers = []DriverJudgment{{
          \t\tDriverID: "driver_1", Standing: DriverPrincipal, Title: "Release readiness", Summary: "Release readiness remains incomplete.",
          \t}}''',
              '''\tproject := SubjectRef{Kind: SubjectProject, CanonicalID: "project_ask_dev", Label: "Ask Dev"}
          \tresult.Drivers = []DriverJudgment{{
          \t\tDriverID: "driver_12345678", Standing: DriverPrincipal, Category: "release_readiness",
          \t\tTitle: "Release readiness", Summary: "Release readiness remains incomplete.",
          \t\tAffectedSubjects: []SubjectRef{project}, EvidenceRefIDs: []string{},
          \t\tDerivation: DerivationRuleInferred, EpistemicStatus: EpistemicInferred,
          \t\tConfidence: 0.9, Current: true,
          \t}}''',
          )

          # Genkit's structured-output contract returns a JSON part. A text part
          # is a different model behavior and can be rejected before typed output
          # extraction even when its bytes happen to contain JSON.
          replace_once(
              "internal/contextfabric/genkitruntime/runtime_test.go",
              '''\t\treturn &ai.ModelResponse{
          \t\t\tMessage:      ai.NewModelTextMessage(string(encoded)),
          \t\t\tFinishReason: ai.FinishReasonStop,''',
              '''\t\treturn &ai.ModelResponse{
          \t\t\tMessage: &ai.Message{Role: ai.RoleModel, Content: []*ai.Part{ai.NewJSONPart(string(encoded))}},
          \t\t\tFinishReason: ai.FinishReasonStop,''',
          )

          # Relationship/content/episode triples may upsert their endpoint nodes.
          # Apply the canonical entity projection last so aliases, previous names,
          # identity attributes, and embedded text remain authoritative.
          replace_once(
              "internal/contextfabric/zepgraph/projection.go",
              '''\tfor _, entity := range batch.Entities {
          \t\tif err := a.projectEntity(ctx, batch.OrgID, entity); err != nil {
          \t\t\treturn contextfabric.ProjectionReceipt{}, err
          \t\t}
          \t}
          \tfor _, relationship := range batch.Relationships {''',
              '''\tfor _, relationship := range batch.Relationships {''',
          )
          replace_once(
              "internal/contextfabric/zepgraph/projection.go",
              '''\tfor _, episode := range batch.Episodes {
          \t\tif err := a.projectEpisode(ctx, batch.OrgID, episode); err != nil {
          \t\t\treturn contextfabric.ProjectionReceipt{}, err
          \t\t}
          \t}
          \tfor _, tombstone := range batch.Tombstones {''',
              '''\tfor _, episode := range batch.Episodes {
          \t\tif err := a.projectEpisode(ctx, batch.OrgID, episode); err != nil {
          \t\t\treturn contextfabric.ProjectionReceipt{}, err
          \t\t}
          \t}
          \tfor _, entity := range batch.Entities {
          \t\tif err := a.projectEntity(ctx, batch.OrgID, entity); err != nil {
          \t\t\treturn contextfabric.ProjectionReceipt{}, err
          \t\t}
          \t}
          \tfor _, tombstone := range batch.Tombstones {''',
          )
          PY
          gofmt -w internal/contextfabric/projector_test.go internal/contextfabric/model_test.go internal/contextfabric/genkitruntime/runtime_test.go internal/contextfabric/zepgraph/projection.go
          git diff --check
      - name: Commit focused corrections
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add internal/contextfabric/projector_test.go internal/contextfabric/model_test.go internal/contextfabric/genkitruntime/runtime_test.go internal/contextfabric/zepgraph/projection.go
          git commit -m "fix(context-fabric): close selected runtime verification gaps"
          git push origin HEAD:agent/chaos-3749-context-fabric-reset-scaffold
      - name: Verify Reset 0C/0D
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          : > "$RUNNER_TEMP/context-fabric-verification.log"
          go test -count=1 ./internal/contextfabric/... ./internal/contracts/v1 ./internal/contractcheck ./internal/api 2>&1 | tee -a "$RUNNER_TEMP/context-fabric-verification.log"
          status=${PIPESTATUS[0]}
          if [ "$status" -eq 0 ]; then
            make contract-test 2>&1 | tee -a "$RUNNER_TEMP/context-fabric-verification.log"
            status=${PIPESTATUS[0]}
          fi
          if [ "$status" -ne 0 ]; then
            {
              echo '### Context Fabric Reset 0C/0D focused verification diagnostics'
              echo
              echo '```text'
              tail -n 220 "$RUNNER_TEMP/context-fabric-verification.log"
              echo '```'
            } > "$RUNNER_TEMP/comment.md"
            gh api "repos/${GITHUB_REPOSITORY}/issues/76/comments" --method POST --field body="$(cat "$RUNNER_TEMP/comment.md")"
            exit "$status"
          fi

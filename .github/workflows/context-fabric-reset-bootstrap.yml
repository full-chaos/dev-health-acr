name: Context Fabric Reset 0C/0D bootstrap

on:
  push:
    branches:
      - agent/chaos-3749-context-fabric-reset-scaffold
    paths:
      - .github/workflows/context-fabric-reset-bootstrap.yml

permissions:
  contents: write

concurrency:
  group: context-fabric-reset-bootstrap
  cancel-in-progress: false

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: agent/chaos-3749-context-fabric-reset-scaffold
          fetch-depth: 0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: go.mod
          cache: true
      - name: Materialize reviewed Reset 0C/0D source bundle
        env:
          EXPECTED_SHA256: 358277285203d8b52f8df7afa96c9b5565155757fe3ed9745b62692a624726b6
        run: |
          set -euo pipefail
          cat .contextfabric-bootstrap/chunk-* > "$RUNNER_TEMP/context-fabric-reset.tar.gz.b64"
          base64 --decode "$RUNNER_TEMP/context-fabric-reset.tar.gz.b64" > "$RUNNER_TEMP/context-fabric-reset.tar.gz"
          printf '%s  %s\n' "$EXPECTED_SHA256" "$RUNNER_TEMP/context-fabric-reset.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/context-fabric-reset.tar.gz" -C .
          go mod tidy
      - name: Normalize selected adapter sources
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          for path, marker in (
              (Path("internal/contextfabric/zepgraph/reader.go"), '\n\t"fmt"\n'),
              (Path("internal/contextfabric/zepgraph/projection.go"), '\n\t"sort"\n'),
          ):
              text = path.read_text()
              if marker in text:
                  path.write_text(text.replace(marker, '\n', 1))
          PY
          gofmt -w internal/contextfabric/model_runtime.go internal/contextfabric/genkitruntime internal/contextfabric/zepgraph
          git diff --check
      - name: Commit selected SDK adapters and dependency lock
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add go.mod go.sum docs/adr/0007-context-fabric-zep-graph-adapter.md docs/adr/0008-context-fabric-genkit-model-runtime.md internal/contextfabric/model_runtime.go internal/contextfabric/genkitruntime internal/contextfabric/zepgraph
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "feat(context-fabric): implement selected graph and model runtimes"
          git push origin HEAD:agent/chaos-3749-context-fabric-reset-scaffold
      - name: Verify selected adapters and preserve diagnostics
        run: |
          set -uo pipefail
          : > "$RUNNER_TEMP/context-fabric-verification.log"
          go test -count=1 ./internal/contextfabric/... ./internal/contracts/v1 ./internal/contractcheck ./internal/api 2>&1 | tee -a "$RUNNER_TEMP/context-fabric-verification.log"
          test_status=${PIPESTATUS[0]}
          if [ "$test_status" -eq 0 ]; then
            make contract-test 2>&1 | tee -a "$RUNNER_TEMP/context-fabric-verification.log"
            test_status=${PIPESTATUS[0]}
          fi
          if [ "$test_status" -ne 0 ]; then
            cp "$RUNNER_TEMP/context-fabric-verification.log" .contextfabric-bootstrap/verification.log
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add .contextfabric-bootstrap/verification.log
            git commit -m "chore(context-fabric): capture adapter verification diagnostics" || true
            git push origin HEAD:agent/chaos-3749-context-fabric-reset-scaffold || true
            exit "$test_status"
          fi

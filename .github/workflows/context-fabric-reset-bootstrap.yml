name: Context Fabric Reset 0C/0D bootstrap

on:
  push:
    branches:
      - agent/chaos-3749-context-fabric-reset-scaffold
    paths:
      - .github/workflows/context-fabric-reset-bootstrap.yml

permissions:
  contents: write
  issues: write

concurrency:
  group: context-fabric-reset-bootstrap
  cancel-in-progress: false

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: agent/chaos-3749-context-fabric-reset-scaffold
          fetch-depth: 0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: go.mod
          cache: true
      - name: Materialize reviewed Reset 0C/0D source bundle
        env:
          EXPECTED_SHA256: 358277285203d8b52f8df7afa96c9b5565155757fe3ed9745b62692a624726b6
        run: |
          set -euo pipefail
          cat .contextfabric-bootstrap/chunk-* > "$RUNNER_TEMP/context-fabric-reset.tar.gz.b64"
          base64 --decode "$RUNNER_TEMP/context-fabric-reset.tar.gz.b64" > "$RUNNER_TEMP/context-fabric-reset.tar.gz"
          printf '%s  %s\n' "$EXPECTED_SHA256" "$RUNNER_TEMP/context-fabric-reset.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/context-fabric-reset.tar.gz" -C .
          go mod tidy
      - name: Reconcile selected adapters and scaffold fixtures
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          def replace_once(path, old, new):
              file = Path(path)
              text = file.read_text()
              if old not in text:
                  raise SystemExit(f"expected marker not found in {path}: {old[:120]!r}")
              file.write_text(text.replace(old, new, 1))

          # The reviewed bundle predates the final exact-hint rule. A canonical
          # server-owned ID is already resolved and authorized, so do not spend a
          # semantic request or let a weaker match displace it.
          replace_once(
              "internal/contextfabric/zepgraph/reader.go",
              '''\tif len(terms) == 0 && len(candidatesBySubject) == 0 {
          \t\treturn contextfabric.SubjectResolution{Candidates: []contextfabric.SubjectCandidate{}, Committed: []contextfabric.SubjectRef{}}, nil
          \t}
          \tfor _, term := range terms {''',
              '''\tif len(candidatesBySubject) > 0 {
          \t\tcandidates := make([]contextfabric.SubjectCandidate, 0, len(candidatesBySubject))
          \t\tcommitted := make([]contextfabric.SubjectRef, 0, len(candidatesBySubject))
          \t\tfor _, candidate := range candidatesBySubject {
          \t\t\tcandidates = append(candidates, candidate)
          \t\t\tcommitted = append(committed, candidate.Subject)
          \t\t}
          \t\tsort.Slice(candidates, func(i, j int) bool { return subjectKey(candidates[i].Subject) < subjectKey(candidates[j].Subject) })
          \t\tsort.Slice(committed, func(i, j int) bool { return subjectKey(committed[i]) < subjectKey(committed[j]) })
          \t\treturn contextfabric.SubjectResolution{Candidates: candidates, Committed: committed}, nil
          \t}
          \tif len(terms) == 0 {
          \t\treturn contextfabric.SubjectResolution{Candidates: []contextfabric.SubjectCandidate{}, Committed: []contextfabric.SubjectRef{}}, nil
          \t}
          \tfor _, term := range terms {''',
          )

          # Keep embedded subject text present when later relationship/content/
          # episode upserts touch the same canonical node.
          projection = Path("internal/contextfabric/zepgraph/projection.go")
          text = projection.read_text()
          replacements = [
              (
                  '''\t\tSourceNodeUUID: ptr(nodeUUID(orgID, relationship.From)), SourceNodeName: ptr(relationship.From.Label), SourceNodeLabels: []string{zepLabel(relationship.From.Kind)},
          \t\tSourceNodeAttributes:''',
                  '''\t\tSourceNodeUUID: ptr(nodeUUID(orgID, relationship.From)), SourceNodeName: ptr(relationship.From.Label), SourceNodeLabels: []string{zepLabel(relationship.From.Kind)},
          \t\tSourceNodeSummary: ptr(subjectSearchSummary(relationship.From)), SourceNodeAttributes:''',
              ),
              (
                  '''\t\tTargetNodeUUID:       ptr(nodeUUID(orgID, relationship.To)), TargetNodeName: ptr(relationship.To.Label), TargetNodeLabels: []string{zepLabel(relationship.To.Kind)},
          \t\tTargetNodeAttributes:''',
                  '''\t\tTargetNodeUUID:       ptr(nodeUUID(orgID, relationship.To)), TargetNodeName: ptr(relationship.To.Label), TargetNodeLabels: []string{zepLabel(relationship.To.Kind)},
          \t\tTargetNodeSummary: ptr(subjectSearchSummary(relationship.To)), TargetNodeAttributes:''',
              ),
              (
                  '''\t\tSourceNodeUUID: ptr(nodeUUID(orgID, content.Subject)), SourceNodeName: ptr(content.Subject.Label), SourceNodeLabels: []string{zepLabel(content.Subject.Kind)},
          \t\tSourceNodeAttributes:''',
                  '''\t\tSourceNodeUUID: ptr(nodeUUID(orgID, content.Subject)), SourceNodeName: ptr(content.Subject.Label), SourceNodeLabels: []string{zepLabel(content.Subject.Kind)},
          \t\tSourceNodeSummary: ptr(subjectSearchSummary(content.Subject)), SourceNodeAttributes:''',
              ),
              (
                  '''\t\tSourceNodeUUID: ptr(nodeUUID(orgID, episode.Subject)), SourceNodeName: ptr(episode.Subject.Label), SourceNodeLabels: []string{zepLabel(episode.Subject.Kind)},
          \t\tSourceNodeAttributes:''',
                  '''\t\tSourceNodeUUID: ptr(nodeUUID(orgID, episode.Subject)), SourceNodeName: ptr(episode.Subject.Label), SourceNodeLabels: []string{zepLabel(episode.Subject.Kind)},
          \t\tSourceNodeSummary: ptr(subjectSearchSummary(episode.Subject)), SourceNodeAttributes:''',
              ),
          ]
          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f"projection marker not found: {old[:120]!r}")
              text = text.replace(old, new, 1)
          helper_marker = "func entitySearchSummary(entity contextfabric.EntityProjection) string {"
          helper = '''func subjectSearchSummary(subject contextfabric.SubjectRef) string {
          \treturn strings.TrimSpace(subject.Label + "\\nCanonical ID: " + subject.CanonicalID + "\\nKind: " + string(subject.Kind))
          }

          '''
          if helper_marker not in text:
              raise SystemExit("entity summary helper marker not found")
          text = text.replace(helper_marker, helper + helper_marker, 1)
          projection.write_text(text)

          # Provider portability: Genkit still supplies/validates the typed JSON
          # schema, while ACR performs the binding semantic validation. Do not
          # require every selected provider to implement native constrained mode.
          runtime = Path("internal/contextfabric/genkitruntime/runtime.go")
          text = runtime.read_text()
          generation = '''\t\tai.WithSystem(request.System),
          \t\tai.WithPrompt("%s", request.Prompt),
          \t)'''
          replacement = '''\t\tai.WithSystem(request.System),
          \t\tai.WithPrompt("%s", request.Prompt),
          \t\tai.WithCustomConstrainedOutput(),
          \t)'''
          if text.count(generation) != 2:
              raise SystemExit(f"expected two Genkit generation call markers, got {text.count(generation)}")
          runtime.write_text(text.replace(generation, replacement))

          # Carry the canonical service version into the immutable result.
          replace_once(
              "internal/contextfabric/engine.go",
              '''\tif strings.TrimSpace(result.Versions.ContractVersion) == "" {
          \t\tresult.Versions.ContractVersion = InvestigationResultSchemaV1
          \t}
          \tif err := result.Validate(); err != nil {''',
              '''\tif strings.TrimSpace(result.Versions.ContractVersion) == "" {
          \t\tresult.Versions.ContractVersion = InvestigationResultSchemaV1
          \t}
          \tif strings.TrimSpace(result.Versions.CanonicalServiceVersion) == "" {
          \t\tresult.Versions.CanonicalServiceVersion = facts.Version
          \t}
          \tif err := result.Validate(); err != nil {''',
          )

          # Keep fact output in the canonical fact-family order rather than
          # accidental string ordering.
          registry = Path("internal/contextfabric/fact_registry.go")
          text = registry.read_text()
          text = text.replace(
              'sort.Slice(capabilities, func(i, j int) bool { return capabilities[i].Kind < capabilities[j].Kind })',
              'sort.Slice(capabilities, func(i, j int) bool { return factKindOrder(capabilities[i].Kind) < factKindOrder(capabilities[j].Kind) })',
              1,
          )
          text = text.replace(
              '''\t\tif facts[i].Kind != facts[j].Kind {
          \t\t\treturn facts[i].Kind < facts[j].Kind
          \t\t}''',
              '''\t\tif facts[i].Kind != facts[j].Kind {
          \t\t\treturn factKindOrder(facts[i].Kind) < factKindOrder(facts[j].Kind)
          \t\t}''',
              1,
          )
          order_helper = '''func factKindOrder(kind FactKind) int {
          \torder := map[FactKind]int{
          \t\tFactIdentity: 0, FactMembership: 1, FactStatus: 2, FactActualCompletion: 3,
          \t\tFactWork: 4, FactBlockers: 5, FactRequiredChildren: 6, FactPullRequests: 7,
          \t\tFactReviews: 8, FactContinuousIntegration: 9, FactDeployments: 10,
          \t\tFactIncidents: 11, FactMetrics: 12, FactHealth: 13, FactWorkload: 14,
          \t\tFactInvestment: 15, FactReadiness: 16, FactOperationalDeficiencies: 17,
          \t\tFactSourceHealth: 18, FactEvidence: 19,
          \t}
          \tif value, ok := order[kind]; ok {
          \t\treturn value
          \t}
          \treturn len(order)
          }

          '''
          helper_marker = "func stateRejectsFacts(state SourceState) bool {"
          if helper_marker not in text:
              raise SystemExit("fact order helper marker not found")
          text = text.replace(helper_marker, order_helper + helper_marker, 1)
          registry.write_text(text)

          # Refresh scaffold fixtures to satisfy the canonical Reset 0A contract
          # they now exercise.
          model_test = Path("internal/contextfabric/model_test.go")
          text = model_test.read_text()
          result_fixture = '''func validInvestigationResult() InvestigationResult {
          \tproject := SubjectRef{Kind: SubjectProject, CanonicalID: "project_ask_dev", Label: "Ask Dev"}
          \treturn InvestigationResult{
          \t\tSchemaVersion: InvestigationResultSchemaV1,
          \t\tResultID:      "result_12345678",
          \t\tRequestID:     "request_12345678",
          \t\tGeneratedAt:   time.Now().UTC(),
          \t\tStatus:        InvestigationComplete,
          \t\tQuestion:      "What is the actual status of Ask Dev and what is driving it?",
          \t\tInterpretation: InterpretedQuestion{
          \t\t\tShape: ShapeOpen, RequestedJudgment: "status_and_drivers",
          \t\t\tTimeContext: TimeContext{Axis: TemporalCurrent},
          \t\t\tFactRequirements: []FactRequirement{{Kind: FactStatus}},
          \t\t},
          \t\tSubjectResolution:   SubjectResolution{Candidates: []SubjectCandidate{}, Committed: []SubjectRef{project}},
          \t\tDirectJudgment:      "Ask Dev is not release-ready.",
          \t\tCurrentState:        "Release acceptance remains incomplete.",
          \t\tStrongestPressures:  []string{},
          \t\tDrivers:             []DriverJudgment{},
          \t\tRemainingWork:       []Finding{},
          \t\tReadinessGaps:       []Finding{},
          \t\tPaths:               []RelationshipPath{},
          \t\tConflicts:           []Finding{},
          \t\tLimitations:         []string{},
          \t\tEvidenceRefIDs:      []string{},
          \t\tCoverage:            Coverage{Sources: []SourceObservation{}, DegradedReasons: []string{}},
          \t\tVersions:            VersionSet{ServiceVersion: "test-v1", ContractVersion: InvestigationResultSchemaV1, Backend: "test", ProjectionVersion: "projection-v1", QueryVersion: "query-v1", InterpretationVersion: "interpret-v1", SynthesisVersion: "synthesis-v1", CanonicalServiceVersion: "ops-v1"},
          \t\tDeterministicAnswer: "Ask Dev is not release-ready because required acceptance work remains open.",
          \t\tWarnings:            []string{},
          \t}
          }
          '''
          text, count = re.subn(r'func validInvestigationResult\(\) InvestigationResult \{.*?\n\}', result_fixture, text, count=1, flags=re.S)
          if count != 1:
              raise SystemExit(f"validInvestigationResult replacement count = {count}")
          projection_fixture = '''func validProjectionBatch() ProjectionBatch {
          \tnow := time.Now().UTC()
          \treturn ProjectionBatch{
          \t\tSchemaVersion: ProjectionBatchSchemaV1,
          \t\tBatchID:       "batch_12345678",
          \t\tOrgID:         "org_1",
          \t\tSource:        "dev-health-ops",
          \t\tSourceVersion: "source_v1",
          \t\tCursor:        "cursor_1",
          \t\tNextCursor:    "cursor_2",
          \t\tGeneratedAt:   now,
          \t\tEntities: []EntityProjection{{
          \t\t\tSubject: SubjectRef{Kind: SubjectProject, CanonicalID: "project_1", Label: "Ask Dev"},
          \t\t\tAuthorization: AuthorizationScope{ProjectIDs: []string{"project_1"}},
          \t\t\tEvidenceRefIDs: []string{"evidence_project_1"}, ObservedAt: now, SourceVersion: "source_v1",
          \t\t}},
          \t\tRelationships: []RelationshipProjection{},
          \t\tContents:      []ContentProjection{},
          \t\tEpisodes:      []EpisodeProjection{},
          \t\tTombstones:    []ProjectionTombstone{},
          \t}
          }
          '''
          text, count = re.subn(r'func validProjectionBatch\(\) ProjectionBatch \{.*?\n\}', projection_fixture, text, count=1, flags=re.S)
          if count != 1:
              raise SystemExit(f"validProjectionBatch replacement count = {count}")
          model_test.write_text(text)

          # The engine test synthesizer must return a structurally valid draft;
          # the engine still owns identity, interpretation, subject binding and
          # canonical service version stamping.
          engine_test = Path("internal/contextfabric/engine_test.go")
          text = engine_test.read_text()
          old = '''\t\t\treturn InvestigationResult{
          \t\t\t\tStatus: InvestigationComplete, DirectJudgment: "Ask Dev is not ready to ship.",
          \t\t\t\tDeterministicAnswer: "Ask Dev is not ready to ship because release-readiness blockers remain.",
          \t\t\t\tVersions: VersionSet{
          \t\t\t\t\tBackend: "test", ProjectionVersion: "projection-v1", QueryVersion: "query-v1",
          \t\t\t\t\tInterpretationVersion: "interpret-v1", SynthesisVersion: "synthesis-v1",
          \t\t\t\t},
          \t\t\t}, nil'''
          new = '''\t\t\treturn InvestigationResult{
          \t\t\t\tStatus: InvestigationComplete, DirectJudgment: "Ask Dev is not ready to ship.",
          \t\t\t\tCurrentState: "Release-readiness blockers remain.", StrongestPressures: []string{},
          \t\t\t\tDrivers: []DriverJudgment{}, RemainingWork: []Finding{}, ReadinessGaps: []Finding{},
          \t\t\t\tPaths: []RelationshipPath{}, Conflicts: []Finding{}, Limitations: []string{},
          \t\t\t\tEvidenceRefIDs: []string{}, Coverage: Coverage{Sources: []SourceObservation{}, DegradedReasons: []string{}},
          \t\t\t\tDeterministicAnswer: "Ask Dev is not ready to ship because release-readiness blockers remain.", Warnings: []string{},
          \t\t\t\tVersions: VersionSet{
          \t\t\t\t\tBackend: "test", ProjectionVersion: "projection-v1", QueryVersion: "query-v1",
          \t\t\t\t\tInterpretationVersion: "interpret-v1", SynthesisVersion: "synthesis-v1",
          \t\t\t\t},
          \t\t\t}, nil'''
          if old not in text:
              raise SystemExit("engine test synthesis marker not found")
          engine_test.write_text(text.replace(old, new, 1))

          # Remove imports left stale by the reviewed bundle and format all
          # touched Go files before committing.
          for path, marker in (
              (Path("internal/contextfabric/zepgraph/reader.go"), '\n\t"fmt"\n'),
              (Path("internal/contextfabric/zepgraph/projection.go"), '\n\t"sort"\n'),
          ):
              text = path.read_text()
              if marker in text:
                  path.write_text(text.replace(marker, '\n', 1))
          PY
          gofmt -w internal/contextfabric/model_runtime.go internal/contextfabric/genkitruntime internal/contextfabric/zepgraph internal/contextfabric/engine.go internal/contextfabric/engine_test.go internal/contextfabric/fact_registry.go internal/contextfabric/model_test.go
          git diff --check
      - name: Commit selected SDK adapters and verification corrections
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add go.mod go.sum docs/adr/0007-context-fabric-zep-graph-adapter.md docs/adr/0008-context-fabric-genkit-model-runtime.md internal/contextfabric/model_runtime.go internal/contextfabric/genkitruntime internal/contextfabric/zepgraph internal/contextfabric/engine.go internal/contextfabric/engine_test.go internal/contextfabric/fact_registry.go internal/contextfabric/model_test.go
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "feat(context-fabric): complete selected graph and model runtimes"
          git push origin HEAD:agent/chaos-3749-context-fabric-reset-scaffold
      - name: Verify selected adapters and publish diagnostics on failure
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          : > "$RUNNER_TEMP/context-fabric-verification.log"
          go test -count=1 ./internal/contextfabric/... ./internal/contracts/v1 ./internal/contractcheck ./internal/api 2>&1 | tee -a "$RUNNER_TEMP/context-fabric-verification.log"
          test_status=${PIPESTATUS[0]}
          if [ "$test_status" -eq 0 ]; then
            make contract-test 2>&1 | tee -a "$RUNNER_TEMP/context-fabric-verification.log"
            test_status=${PIPESTATUS[0]}
          fi
          if [ "$test_status" -ne 0 ]; then
            {
              echo '### Context Fabric Reset 0C/0D verification diagnostics'
              echo
              echo '```text'
              tail -n 220 "$RUNNER_TEMP/context-fabric-verification.log"
              echo '```'
            } > "$RUNNER_TEMP/context-fabric-comment.md"
            gh api "repos/${GITHUB_REPOSITORY}/issues/76/comments" --method POST --field body="$(cat "$RUNNER_TEMP/context-fabric-comment.md")"
            exit "$test_status"
          fi

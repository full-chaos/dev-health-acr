name: Context Fabric Reset 0C/0D bootstrap

on:
  push:
    branches:
      - agent/chaos-3749-context-fabric-reset-scaffold
    paths:
      - .github/workflows/context-fabric-reset-bootstrap.yml

permissions:
  contents: write

concurrency:
  group: context-fabric-reset-bootstrap
  cancel-in-progress: false

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: agent/chaos-3749-context-fabric-reset-scaffold
          fetch-depth: 0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: go.mod
          cache: true
      - name: Materialize reviewed Reset 0C/0D source bundle
        env:
          EXPECTED_SHA256: 358277285203d8b52f8df7afa96c9b5565155757fe3ed9745b62692a624726b6
        run: |
          set -euo pipefail
          cat .contextfabric-bootstrap/chunk-* > "$RUNNER_TEMP/context-fabric-reset.tar.gz.b64"
          base64 --decode "$RUNNER_TEMP/context-fabric-reset.tar.gz.b64" > "$RUNNER_TEMP/context-fabric-reset.tar.gz"
          printf '%s  %s\n' "$EXPECTED_SHA256" "$RUNNER_TEMP/context-fabric-reset.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/context-fabric-reset.tar.gz" -C .
          go mod tidy
      - name: Reconcile pre-existing Reset 0A/0B compile drift
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          tests = Path("internal/contextfabric/fact_registry_test.go")
          text = tests.read_text()
          replacements = [
              ("\t\t\t}},\n\t}\n\treadiness := &factProviderStub{", "\t\t\t}},\n\t\t},\n\t}\n\treadiness := &factProviderStub{"),
              ("\t\t\t}},\n\t}\n\tregistry, err := NewFactCapabilityRegistry", "\t\t\t}},\n\t\t},\n\t}\n\tregistry, err := NewFactCapabilityRegistry"),
          ]
          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f"expected fact-registry compile-drift marker not found: {old!r}")
              text = text.replace(old, new, 1)
          tests.write_text(text)

          validator = Path("internal/contracts/v1/validate_context_fabric_projection.go")
          text = validator.read_text()
          replacement = '''func (c ContextFabricCapabilities) Validate() error {
          if !c.Enabled {
          \tif c.SupportsOpenQuestions || c.SupportsPriorSubjectReceipts || len(c.SupportedRequestSchemaVersions) != 0 || len(c.SupportedResultSchemaVersions) != 0 {
          \t\treturn fmt.Errorf("disabled context fabric capabilities must not advertise active features")
          \t}
          \treturn nil
          }
          if !c.SupportsOpenQuestions || c.SupportedRequestSchemaVersions == nil || !uniqueStrings(c.SupportedRequestSchemaVersions) || c.SupportedResultSchemaVersions == nil || !uniqueStrings(c.SupportedResultSchemaVersions) {
          \treturn fmt.Errorf("context fabric capabilities violate v1 bounds")
          }
          if err := c.Limits.Validate(); err != nil {
          \treturn fmt.Errorf("limits: %w", err)
          }
          return nil
          }

          '''
          updated, count = re.subn(
              r'func \(c ContextFabricCapabilities\) Validate\(\) error \{.*?\n\}\n\n(?=func \(l ContextFabricCapabilityLimits\) Validate)',
              replacement,
              text,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit(f"expected one ContextFabricCapabilities validator, replaced {count}")
          validator.write_text(updated)
          PY
          gofmt -w internal/contextfabric/fact_registry_test.go internal/contracts/v1/validate_context_fabric_projection.go internal/contextfabric/model_runtime.go internal/contextfabric/genkitruntime internal/contextfabric/zepgraph
          git diff --check
      - name: Commit selected SDK adapters and reconciled contracts
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add go.mod go.sum docs/adr/0007-context-fabric-zep-graph-adapter.md docs/adr/0008-context-fabric-genkit-model-runtime.md internal/contextfabric/model_runtime.go internal/contextfabric/genkitruntime internal/contextfabric/zepgraph internal/contextfabric/fact_registry_test.go internal/contracts/v1/validate_context_fabric_projection.go
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "feat(context-fabric): implement selected graph and model runtimes"
          git push origin HEAD:agent/chaos-3749-context-fabric-reset-scaffold
      - name: Verify selected adapters
        run: |
          set -euo pipefail
          go test -count=1 ./internal/contextfabric/... ./internal/contracts/v1 ./internal/contractcheck ./internal/api
          make contract-test

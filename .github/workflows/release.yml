---
# yamllint disable rule:line-length
name: Release

"on":
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build and publish (vX.Y.Z[-dev.N|-beta.N])
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  preflight:
    if: github.repository == 'full-chaos/dev-health-acr'
    runs-on: ubuntu-24.04
    outputs:
      channel: ${{ steps.release.outputs.channel }}
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
      commit: ${{ steps.release.outputs.commit }}
      date: ${{ steps.release.outputs.date }}
    steps:
      # actions/checkout v7.0.0
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - name: Resolve release channel and source commit
        id: release
        env:
          ACR_RELEASE_OPERATORS: ${{ vars.ACR_RELEASE_OPERATORS }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          set -euo pipefail
          fail() {
            printf 'release preflight: %s\n' "$*" >&2
            exit 1
          }

          channel=""
          tag=""
          version=""
          commit=""

          case "$GITHUB_EVENT_NAME" in
            push)
              case "$GITHUB_REF" in
                refs/heads/main)
                  channel=main
                  commit="$GITHUB_SHA"
                  [[ "$commit" =~ ^[0-9a-f]{40}$ ]] \
                    || fail "main push did not provide a full commit SHA"
                  test "$(git rev-parse HEAD)" = "$commit" \
                    || fail "checked-out source does not match the main push commit"
                  tag="$commit"
                  version="$(scripts/release/publish-ci-release.sh --derive-main-version "$commit")"
                  printf '::notice::main publication uses immutable SHA %s and promotes it to latest only if it remains the main tip.\n' "$commit"
                  ;;
                refs/tags/*)
                  channel=versioned
                  tag="$GITHUB_REF_NAME"
                  ;;
                *) fail "unsupported push ref: $GITHUB_REF" ;;
              esac
              ;;
            workflow_dispatch)
              [[ "$GITHUB_REF" == refs/heads/main ]] \
                || fail "manual releases must run from main"
              channel=versioned
              tag="$INPUT_TAG"
              ;;
            *) fail "unsupported event: $GITHUB_EVENT_NAME" ;;
          esac

          if [[ "$channel" == versioned ]]; then
            [[ "$tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-(dev|beta)\.(1|[1-9][0-9]*))?$ ]] \
              || fail "tag must be vMAJOR.MINOR.PATCH, optionally followed by -dev.N or -beta.N"

            operators="${ACR_RELEASE_OPERATORS:-}"
            if [[ -n "$operators" && ",$operators," != *",$GITHUB_ACTOR,"* ]]; then
              fail "actor $GITHUB_ACTOR is not listed in ACR_RELEASE_OPERATORS"
            fi
            if [[ -z "$operators" ]]; then
              printf '::notice::ACR_RELEASE_OPERATORS is unset; repository tag permissions authorize this release.\n'
            fi

            git show-ref --verify --quiet "refs/tags/$tag" \
              || fail "tag does not exist in the repository: $tag"
            commit="$(git rev-list -n 1 "$tag")"
            [[ "$commit" =~ ^[0-9a-f]{40}$ ]] \
              || fail "tag did not resolve to a commit"
            git show-ref --verify --quiet refs/remotes/origin/main \
              || fail "origin/main was not fetched"
            git merge-base --is-ancestor "$commit" refs/remotes/origin/main \
              || fail "tag commit is not an ancestor of main"
            version="${tag#v}"

            tag_type="$(git cat-file -t "refs/tags/$tag")"
            if [[ "$tag_type" == tag ]]; then
              if git verify-tag "$tag" >/tmp/acr-tag-verify.log 2>&1; then
                printf '::notice::Verified annotated tag signature for %s.\n' "$tag"
              else
                printf '::warning::Annotated tag %s has no locally verifiable signature; GitHub tag permissions and the optional operator allowlist remain enforced.\n' "$tag"
              fi
            else
              printf '::notice::Using lightweight tag %s; GitHub tag permissions and the optional operator allowlist authorize publication.\n' "$tag"
            fi
          fi

          {
            printf 'channel=%s\n' "$channel"
            printf 'tag=%s\n' "$tag"
            printf 'version=%s\n' "$version"
            printf 'commit=%s\n' "$commit"
            printf 'date=%s\n' "$(date -u -d "$(git show -s --format=%cI "$commit")" +'%Y-%m-%dT%H:%M:%SZ')"
          } >> "$GITHUB_OUTPUT"

  build:
    needs: preflight
    runs-on: ubuntu-24.04
    steps:
      # actions/checkout v7.0.0
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ needs.preflight.outputs.commit }}
          persist-credentials: false
      # actions/setup-go v6.5.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: "1.27.0"
          check-latest: false
          cache: false
      - name: Verify source and dependencies
        run: |
          set -euo pipefail
          verify_module_cache="$(mktemp -d)"
          verify_build_cache="$(mktemp -d)"
          export GOMODCACHE="$verify_module_cache/mod" GOCACHE="$verify_build_cache/build"
          go mod download
          # CHAOS-4567: `make verify` runs the race suite as test-race-split --
          # the shared packages at GOTEST_TIMEOUT and the isolated ones
          # (internal/contextfabric/devhealthschema, per
          # scripts/ci/test-shard.sh) at GOTEST_ISOLATED_TIMEOUT -- the same
          # partition ci.yml's race matrix + race-devhealthschema job use.
          # The unsharded run this job used to do timed devhealthschema out
          # at 420s on every main merge from a4e2e5a3 (#327) on and stopped
          # image publication; do not collapse this back into one `go test`.
          make verify
          go mod verify
          go install golang.org/x/vuln/cmd/govulncheck@v1.5.0
          govulncheck ./...
      - name: Build deterministic matrix and final checksum manifest
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
          COMMIT: ${{ needs.preflight.outputs.commit }}
          DATE: ${{ needs.preflight.outputs.date }}
        run: |
          set -euo pipefail
          first_cache="$(mktemp -d)"
          second_cache="$(mktemp -d)"
          GOMODCACHE="$first_cache/mod" GOCACHE="$first_cache/build" go mod download
          GOMODCACHE="$first_cache/mod" GOCACHE="$first_cache/build" go run ./cmd/releasebuild build -version "$VERSION" -commit "$COMMIT" -date "$DATE" -out /tmp/first
          go run ./cmd/releasebuild verify -dir /tmp/first
          GOMODCACHE="$second_cache/mod" GOCACHE="$second_cache/build" go mod download
          GOMODCACHE="$second_cache/mod" GOCACHE="$second_cache/build" go run ./cmd/releasebuild build -version "$VERSION" -commit "$COMMIT" -date "$DATE" -out /tmp/second
          go run ./cmd/releasebuild verify -dir /tmp/second
          diff -qr --no-dereference /tmp/first /tmp/second
          mkdir release; cp /tmp/first/* release/
          for archive in release/*.tar.gz release/*.zip; do
            go run github.com/anchore/syft/cmd/syft@v1.46.0 "$archive" -o "spdx-json=${archive}.spdx.json"
          done
          (
            cd release
            find . -maxdepth 1 -type f \( -name '*.tar.gz' -o -name '*.zip' -o -name '*.spdx.json' -o -name release-manifest.json \) -printf '%f\n' | LC_ALL=C sort | while IFS= read -r file; do sha256sum "$file"; done
          ) > release/SHA256SUMS
      # actions/upload-artifact v7.0.1
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with: {name: binary-release, path: release/, if-no-files-found: error, retention-days: 7}

  container:
    needs: preflight
    runs-on: ubuntu-24.04
    steps:
      # actions/checkout v7.0.0
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ needs.preflight.outputs.commit }}
          persist-credentials: false
      # docker/setup-qemu-action v3.6.0
      - uses: docker/setup-qemu-action@29109295f81e9208d7d86ff1c6c12d2833863392
        with:
          image: docker.io/tonistiigi/binfmt:qemu-v10.2.3@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0
          cache-image: false
      - name: Install checksum-verified Docker Buildx
        env:
          BUILDX_VERSION: v0.35.0
          BUILDX_SHA256: >-
            d41ece72044243b4f58b343441ae37446d9c29a7d6b5e11c61847bbcf8f7dfda
          BUILDX_URL: >-
            https://github.com/docker/buildx/releases/download/v0.35.0/buildx-v0.35.0.linux-amd64
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/buildx" "$HOME/.docker/cli-plugins"
          curl --fail --location --proto '=https' --tlsv1.2 \
            "$BUILDX_URL" \
            --output "$RUNNER_TEMP/buildx/docker-buildx"
          printf '%s  %s\n' \
            "$BUILDX_SHA256" "$RUNNER_TEMP/buildx/docker-buildx" \
            | sha256sum --check -
          install -m 0755 \
            "$RUNNER_TEMP/buildx/docker-buildx" \
            "$HOME/.docker/cli-plugins/docker-buildx"
          docker buildx version | grep -F "$BUILDX_VERSION"
      # docker/setup-buildx-action v3.11.1
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435  # yamllint disable-line rule:line-length
        with:
          driver-opts: image=moby/buildkit:v0.31.0@sha256:a095b3d11ce1a9a05b6064ef515dfca0291ec5bcf2ea8178da8f6461924294e1
          cache-binary: false
      # CodeQL flags this step for cache poisoning (alert #11) — dismissed as a false
      # positive: no cache sink exists in this job (qemu cache-image and buildx
      # cache-binary are both false; no actions/cache or setup-go). Job-level
      # hardening for this workflow is tracked in CHAOS-3794.
      - name: Build, validate, scan, and SBOM exact multi-architecture OCI archives
        env:
          CONTAINER_VERSION: ${{ needs.preflight.outputs.version }}
          CONTAINER_COMMIT: ${{ needs.preflight.outputs.commit }}
          CONTAINER_BUILD_DATE: ${{ needs.preflight.outputs.date }}
          CONTAINER_SCAN_OCI_ROOT: .tmp/container-oci
        run: |
          set -euo pipefail
          # container-pins is not run: it resolved reviewed tags over the network and failed
          # whenever upstream moved one, which cannot affect a release whose images are all
          # digest-pinned. See the note in ci.yml.
          make container-oci
          make container-scan
      - name: Stage container release artifacts
        env:
          TAG: ${{ needs.preflight.outputs.tag }}
          VERSION: ${{ needs.preflight.outputs.version }}
          COMMIT: ${{ needs.preflight.outputs.commit }}
          DATE: ${{ needs.preflight.outputs.date }}
        run: |
          set -euo pipefail
          scripts/release/write-container-release-manifest.sh \
            --source .tmp/container-oci \
            --output container-release \
            --tag "$TAG" \
            --version "$VERSION" \
            --commit "$COMMIT" \
            --date "$DATE"
          # CHAOS-3772 F1: stage Trivy provenance (resolved DB digest, its
          # metadata, and the four per-image scan reports) alongside the
          # SBOMs, not only the SBOMs -- otherwise a release cannot prove
          # which trivy-db snapshot actually scanned it.
          cp .tmp/container-reports/*.spdx.json \
            .tmp/container-reports/*-trivy.json \
            .tmp/container-reports/trivy-db-metadata.json \
            .tmp/container-reports/trivy-db-snapshot.txt \
            container-release/
          (
            cd container-release
            find . -maxdepth 1 -type f -printf '%f\n' | LC_ALL=C sort \
              | while IFS= read -r file; do sha256sum "$file"; done
          ) >"$RUNNER_TEMP/CONTAINER-SHA256SUMS"
          mv "$RUNNER_TEMP/CONTAINER-SHA256SUMS" container-release/
      # actions/upload-artifact v7.0.1
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with: {name: container-release, path: container-release/, if-no-files-found: error, retention-days: 7}

  smoke-linux:
    needs: [preflight, build]
    runs-on: ubuntu-24.04
    steps:
      # actions/download-artifact v8.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with: {name: binary-release, path: release}
      - name: Verify and smoke Linux assets
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
          COMMIT: ${{ needs.preflight.outputs.commit }}
          DATE: ${{ needs.preflight.outputs.date }}
        run: |
          set -euo pipefail
          cd release; sha256sum --check SHA256SUMS; mkdir smoke
          tar -xzf "acr-api_${VERSION}_linux_amd64.tar.gz" -C smoke; tar -xzf "acr-mcp_${VERSION}_linux_amd64.tar.gz" -C smoke
          expected="$VERSION commit=$COMMIT built=$DATE"
          test "$(smoke/acr-api version)" = "$expected"; test "$(smoke/acr-mcp version)" = "$expected"
          smoke/acr-mcp doctor | jq -e '.status == "incomplete_configuration" and .credential_set == false and .api_url_set == false'

  smoke-macos:
    needs: [preflight, build]
    runs-on: macos-15
    steps:
      # actions/download-artifact v8.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with: {name: binary-release, path: release}
      - name: Verify and smoke macOS assets
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
          COMMIT: ${{ needs.preflight.outputs.commit }}
          DATE: ${{ needs.preflight.outputs.date }}
        run: |
          set -euo pipefail
          cd release; shasum -a 256 --check SHA256SUMS; mkdir smoke
          tar -xzf "acr-api_${VERSION}_darwin_arm64.tar.gz" -C smoke; tar -xzf "acr-mcp_${VERSION}_darwin_arm64.tar.gz" -C smoke
          expected="$VERSION commit=$COMMIT built=$DATE"
          test "$(smoke/acr-api version)" = "$expected"; test "$(smoke/acr-mcp version)" = "$expected"
          smoke/acr-mcp doctor | jq -e '.status == "incomplete_configuration" and .credential_set == false and .api_url_set == false'

  smoke-windows:
    needs: [preflight, build]
    runs-on: windows-2025
    steps:
      # actions/download-artifact v8.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with: {name: binary-release, path: release}
      - name: Verify and smoke Windows assets
        shell: pwsh
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
          COMMIT: ${{ needs.preflight.outputs.commit }}
          DATE: ${{ needs.preflight.outputs.date }}
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($asset in @("acr-api_$env:VERSION`_windows_amd64.zip", "acr-mcp_$env:VERSION`_windows_amd64.zip")) { $line = Get-Content release/SHA256SUMS | Where-Object { $_.EndsWith("  $asset") }; if ((Get-FileHash "release/$asset" -Algorithm SHA256).Hash.ToLower() -ne $line.Split(' ')[0]) { throw "checksum mismatch: $asset" } }
          Expand-Archive "release/acr-api_$env:VERSION`_windows_amd64.zip" smoke-api; Expand-Archive "release/acr-mcp_$env:VERSION`_windows_amd64.zip" smoke-mcp
          $expected = "$env:VERSION commit=$env:COMMIT built=$env:DATE"
          if ((& ./smoke-api/acr-api.exe version) -ne $expected -or (& ./smoke-mcp/acr-mcp.exe version) -ne $expected) { throw 'version mismatch' }
          $doctor = & ./smoke-mcp/acr-mcp.exe doctor | ConvertFrom-Json
          if ($doctor.status -ne 'incomplete_configuration' -or $doctor.credential_set -or $doctor.api_url_set) { throw 'doctor mismatch' }

  assemble:
    needs: [preflight, build, container, smoke-linux, smoke-macos, smoke-windows]
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
      id-token: write
      packages: write
    steps:
      # actions/checkout v7.0.0
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      # actions/download-artifact v8.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with: {name: binary-release, path: binary-release}
      # actions/download-artifact v8.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with: {name: container-release, path: container-release}
      - name: Assemble the verified GitHub Release asset set
        env:
          TAG: ${{ needs.preflight.outputs.tag }}
          VERSION: ${{ needs.preflight.outputs.version }}
          COMMIT: ${{ needs.preflight.outputs.commit }}
        run: |
          set -euo pipefail
          scripts/release/assemble-release-assets.sh \
            --binary binary-release \
            --container container-release \
            --output release \
            --tag "$TAG" \
            --version "$VERSION" \
            --commit "$COMMIT"
      # sigstore/cosign-installer pinned commit (Cosign v3.0.6)
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6
        with:
          cosign-release: v3.0.6
      - name: Install Skopeo from Ubuntu repositories
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y skopeo
          skopeo --version
          skopeo copy --help | grep -F -- '--all'
          skopeo copy --help | grep -F -- '--digestfile'
          skopeo copy --help | grep -F -- '--preserve-digests'
      - name: Publish GHCR images and GitHub Release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.preflight.outputs.tag }}
          VERSION: ${{ needs.preflight.outputs.version }}
          COMMIT: ${{ needs.preflight.outputs.commit }}
        run: |
          scripts/release/publish-ci-release.sh \
            --dir release \
            --tag "$TAG" \
            --version "$VERSION" \
            --commit "$COMMIT"
      # actions/upload-artifact v7.0.1
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with: {name: release, path: release/, if-no-files-found: error, retention-days: 7}

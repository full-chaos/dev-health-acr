---
name: fullstack-acceptance

# Full-stack Context Fabric acceptance (CHAOS-3065).
#
# The offline contract checks run in ci.yml through `make verify`. This
# workflow runs the heavyweight gate instead: the real Dev Health product
# slice, the real acr-api, the real host-local acr-mcp sidecar, and a real
# headless OpenCode session driven by a deterministic local model.
#
# The product slice is assembled from the PUBLIC full-chaos/dev-health-ops
# and full-chaos/dev-health-web repositories, checked out tokenlessly into a
# dev-health/{ops,web} layout, with a minimal CI-only compose file
# (.github/fullstack/compose.ci.yml, authored from scratch — see that file's
# header) copied to dev-health/compose.yml. "full-chaos/dev-health" is not a
# GitHub repository; it is chris's local folder name for that same layout,
# and DEV_HEALTH_ROOT/E2E_WEB_ROOT below name the CI equivalent of it.

"on":
  pull_request:
  push:
    tags: ["v*"]
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:
    inputs:
      scenario:
        description: smoke or full
        required: false
        default: full
      web_ref:
        description: optional full-chaos/dev-health-web ref to prove; empty uses its default branch
        required: false
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: fullstack-acceptance-${{ github.ref }}
  cancel-in-progress: true

env:
  OPENCODE_PINNED_VERSION: 1.18.4
  # The acceptance client loads this provider package at runtime. It is
  # pre-warmed into the npm cache so the graded run itself never depends on a
  # live registry. See docs/fullstack-acceptance.md section 6.
  PROVIDER_NPM_SPEC: "@ai-sdk/openai-compatible@3.0.14"

jobs:
  compose:
    name: compose acceptance
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      # scripts/e2e/compose.sh's ensure_image() references the locally-built ACR image by
      # digest (repo:tag@sha256:<id>) so Compose never quietly rebuilds or refetches it, but
      # that Image-ID-as-digest trick only resolves locally under Docker's containerd image
      # store -- the classic overlay2 graph driver GitHub-hosted runners ship by default has
      # no local record of that "digest" and falls through to an actual registry pull, which
      # 404s: "pull access denied for <project>-acr-api, repository does not exist". This must
      # run before anything else touches Docker in this job.
      - name: Enable the Docker containerd image store
        run: |
          echo '{"features": {"containerd-snapshotter": true}}' | sudo tee /etc/docker/daemon.json
          sudo systemctl restart docker
          docker info --format '{{.DriverStatus}}'
      # actions/checkout v7.0.0
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          path: dev-health-acr
          persist-credentials: false
      # actions/checkout v7.0.0 — public repo, no token needed.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          repository: full-chaos/dev-health-ops
          path: dev-health/ops
          persist-credentials: false
      # actions/checkout v7.0.0 — public repo, no token needed.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          repository: full-chaos/dev-health-web
          path: dev-health/web
          ref: ${{ inputs.web_ref }}
          persist-credentials: false
      - name: Assemble the product-slice compose file and record checked-out refs
        run: |
          set -euo pipefail
          cp dev-health-acr/.github/fullstack/compose.ci.yml dev-health/compose.yml
          ops_ref="$(git -C dev-health/ops rev-parse HEAD)"
          web_ref="$(git -C dev-health/web rev-parse HEAD)"
          echo "E2E_OPS_REF=$ops_ref" >> "$GITHUB_ENV"
          echo "E2E_WEB_REF=$web_ref" >> "$GITHUB_ENV"
      # E2E_WEB is 'off' on a pull_request (the web-agreement job below covers that path
      # instead) and 'on' otherwise -- see the "Run the full-stack acceptance gate" step's env
      # block. fullstack-opencode.sh's render_web_override() imports
      # dev-health/web/node_modules/@playwright/test directly and run_web_agreement_check()
      # requires it to already exist; a bare checkout has no node_modules at all.
      # pnpm/action-setup v6.0.9
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271
        if: github.event_name != 'pull_request'
        with:
          package_json_file: dev-health/web/package.json
      # actions/setup-node v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        if: github.event_name != 'pull_request'
        with:
          node-version: 25
      - name: Install web dependencies and the Playwright browser runtime
        if: github.event_name != 'pull_request'
        working-directory: dev-health/web
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium
      # actions/setup-go v6.5.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.27.0'
          cache: false

      - name: Install the pinned OpenCode release
        run: |
          # The npm package's own postinstall script (postinstall.mjs) runs the freshly
          # unpacked binary with `--version` to verify the download -- with no HOME/XDG
          # override of its own, so `npm install` itself (not just an explicit `opencode
          # --version` afterward) initialises ~/.config/opencode and ~/.local/share/opencode.
          # docs/fullstack-acceptance.md §6 already documents that even a bare version check
          # does this; the later "operator client configuration is absent" steps assert those
          # paths never exist on this runner at all, so the whole install must run against a
          # throwaway root, not just this step's own explicit version check.
          preflight="$RUNNER_TEMP/opencode-preflight"
          mkdir -p "$preflight"/{config,data,cache,state}
          export HOME="$preflight"
          export XDG_CONFIG_HOME="$preflight/config" XDG_DATA_HOME="$preflight/data"
          export XDG_CACHE_HOME="$preflight/cache" XDG_STATE_HOME="$preflight/state"
          npm install --global --no-fund --no-audit \
            "opencode-ai@${OPENCODE_PINNED_VERSION}"
          observed="$(opencode --version)"
          if [ "$observed" != "$OPENCODE_PINNED_VERSION" ]; then
            echo "want OpenCode $OPENCODE_PINNED_VERSION, got $observed" >&2
            exit 1
          fi

      # OpenCode fetches its own ~83MB @opencode-ai/plugin + @opencode-ai/sdk
      # bootstrap on a cold cache regardless of provider, and --pure and the
      # OPENCODE_DISABLE_* vars do not suppress it. The provider adapter is
      # installed on first use too. One throwaway run warms both. The native
      # deps are arch-specific, so this must run on the runner's own OS/arch.
      # Renders the ACTUAL tests/fullstack/opencode/opencode.json.template (the same one
      # render_client_sandbox() uses for every graded task) with placeholder values for the
      # MCP/ACR fields -- never dereferenced, since provider initialisation populates
      # OpenCode's package cache before it ever tries to reach the model server or spawn the
      # MCP subprocess -- rather than a bare {"$schema":...} config or a hand-rolled subset of
      # the template a prior version of this step used. Either of those, it turns out, is not
      # equivalent: OpenCode's own config/model-key resolution is exact-match and undocumented
      # in its failure mode (see docs/fullstack-acceptance.md §6's "Unexpected server error"
      # note), so reusing the identical, already-proven-working template file end to end is
      # the only way to be sure warmup exercises the real path rather than a close-but-subtly-
      # different one.
      - name: Pre-warm the OpenCode and provider caches
        run: |
          set -euo pipefail
          npm cache add "$PROVIDER_NPM_SPEC"
          warm="$RUNNER_TEMP/opencode-warm"
          mkdir -p "$warm"/config/opencode "$warm"/{data,cache,state}
          sed \
            -e "s#__MODEL_PORT__#1#g" \
            -e "s#__PROVIDER_NPM_SPEC__#${PROVIDER_NPM_SPEC}#g" \
            -e "s#__ACR_MCP_BIN__#/bin/true#g" \
            -e "s#__ACR_API_URL__#https://127.0.0.1:1#g" \
            -e "s#__ACR_TOKEN_FILE__#/dev/null#g" \
            -e "s#__ACR_CA_BUNDLE__#/dev/null#g" \
            -e "s#__ACR_SIDECAR_VERSION__#1.0.0#g" \
            dev-health-acr/tests/fullstack/opencode/opencode.json.template \
            > "$warm/config/opencode/opencode.json"
          export HOME="$warm"
          export XDG_CONFIG_HOME="$warm/config" XDG_DATA_HOME="$warm/data"
          export XDG_CACHE_HOME="$warm/cache" XDG_STATE_HOME="$warm/state"
          timeout 300 opencode --pure run --format json --model contextfabric/oracle "warmup" || true
          test -d "$warm/.npm" || echo "note: npm cache did not materialise" >&2
          # OpenCode's provider loader keeps its own resolved-package cache under
          # <XDG_CACHE_HOME>/opencode/packages/<name>@<version>/, entirely separate from any
          # node_modules tree -- confirmed live: with PROVIDER_NPM_OFFLINE=true below, the
          # graded run's provider-initialization step still makes a registry check that fails
          # closed even when the package already exists elsewhere (e.g. via
          # OPENCODE_RUNTIME_FIXTURE's node_modules), and stops failing the moment this exact
          # cache directory is pre-populated instead. See prepare_artifacts() in
          # fullstack-opencode.sh for where OPENCODE_PACKAGE_CACHE gets copied into each
          # task's own fresh $CLIENT_HOME.
          if [[ -d "$warm/cache/opencode/packages" ]]; then
            echo "OPENCODE_PACKAGE_CACHE=$warm/cache/opencode/packages" >> "$GITHUB_ENV"
          else
            echo "::warning::OpenCode provider package cache did not materialise during warmup; the offline graded run may fail to initialize its provider"
          fi

      # scripts/e2e/opencode-runtime-fixture.sh's OPENCODE_RUNTIME_FIXTURE mechanism: a
      # pre-verified node_modules tree the driver publishes into each task's client root,
      # covering <config>/opencode/node_modules specifically (a different concern from the
      # package cache above, which is what the offline run actually needed). Build one by
      # installing the provider package the same way OpenCode would, then hash the resulting
      # tree in the exact `<sha256>  <path>` manifest format the driver's validator requires.
      # No symlinks are allowed in the fixture tree; npm's node_modules/.bin/* entries are
      # always symlinks and are never needed to `require()` a library package, so they're
      # stripped rather than causing the whole fixture to fail validation.
      - name: Build the OpenCode provider runtime fixture
        run: |
          set -euo pipefail
          fixture="$RUNNER_TEMP/opencode-runtime-fixture"
          mkdir -p "$fixture/config/opencode"
          (
            cd "$fixture/config/opencode"
            npm init -y >/dev/null
            npm install --no-fund --no-audit "$PROVIDER_NPM_SPEC"
          )
          find "$fixture/config/opencode/node_modules" -type l -delete
          (
            cd "$fixture"
            find config/opencode -type f -print0 | LC_ALL=C sort -z \
              | xargs -0 sha256sum > tree-hashes.sha256
          )
          echo "OPENCODE_RUNTIME_FIXTURE=$fixture" >> "$GITHUB_ENV"

      - name: Record the operator client configuration is absent
        run: |
          test ! -e "$HOME/.config/opencode"
          test ! -e "$HOME/.local/share/opencode"

      # Release gate: exercise the released sidecar archive rather than a
      # source build, so the artifact customers install is what the gate
      # proves.
      - name: Stage the released acr-mcp archive
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: dev-health-acr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir -p .tmp/release-mcp
          gh release download "$GITHUB_REF_NAME" \
            --pattern "acr-mcp_${version}_linux_amd64.tar.gz" \
            --dir .tmp/release-mcp
          tar -xzf ".tmp/release-mcp/acr-mcp_${version}_linux_amd64.tar.gz" \
            -C .tmp/release-mcp
          test "$(.tmp/release-mcp/acr-mcp version)" = "$version"
          echo "ACR_MCP_BINARY=$PWD/.tmp/release-mcp/acr-mcp" >> "$GITHUB_ENV"

      # Without this the release job would gate a source build of acr-api while
      # claiming to gate the release: `ensure_image` builds from the checkout
      # whenever ACR_E2E_IMAGE is unset. Pinning the published digest makes the
      # container customers pull the one under test.
      - name: Pin the released acr-api image by digest
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}/acr-api:${GITHUB_REF_NAME}"
          docker pull "$image"
          digest="$(docker inspect --format '{{index .RepoDigests 0}}' "$image")"
          case "$digest" in
            *@sha256:*) ;;
            *) echo "released image did not resolve to a digest: ${digest}" >&2; exit 1 ;;
          esac
          echo "ACR_E2E_IMAGE=$digest" >> "$GITHUB_ENV"

      - name: Require the release run to grade the released image
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          test -n "${ACR_E2E_IMAGE:-}"
          test -n "${ACR_MCP_BINARY:-}"

      - name: Run the full-stack acceptance gate
        working-directory: dev-health-acr
        env:
          E2E_SCENARIO: >-
            ${{ github.event.inputs.scenario ||
                (github.event_name == 'pull_request' && 'smoke' || 'full') }}
          # Set by the release-gate step above; empty elsewhere, which
          # makes the driver build acr-mcp from source as usual.
          ACR_MCP_BINARY: ${{ env.ACR_MCP_BINARY }}
          # Set by the release-gate step above; empty elsewhere, where the
          # driver builds and pins the API image from the checkout instead.
          ACR_E2E_IMAGE: ${{ env.ACR_E2E_IMAGE }}
          # The web agreement check is expensive; on a pull request it is
          # handled by the contract-path job below instead.
          E2E_WEB: >-
            ${{ github.event_name == 'pull_request' && 'off' || 'on' }}
          DEV_HEALTH_ROOT: ${{ github.workspace }}/dev-health
          E2E_WEB_ROOT: ${{ github.workspace }}/dev-health/web
          E2E_PROJECT: acr-fs-ci-${{ github.run_id }}
          # Both caches are warmed above, so the graded run must not reach
          # the registry; a miss should fail loudly, not silently refetch.
          PROVIDER_NPM_OFFLINE: 'true'
          OPENCODE_RUNTIME_FIXTURE: ${{ env.OPENCODE_RUNTIME_FIXTURE }}
          OPENCODE_PACKAGE_CACHE: ${{ env.OPENCODE_PACKAGE_CACHE }}
        run: make fullstack-opencode-e2e

      - name: Prove the runner client configuration was never created
        if: always()
        run: |
          test ! -e "$HOME/.config/opencode"
          test ! -e "$HOME/.local/share/opencode"

      # actions/upload-artifact v7.0.1
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: fullstack-acceptance-${{ github.run_id }}
          path: dev-health-acr/.tmp/fullstack/
          if-no-files-found: warn
          retention-days: 7

  web-contract-changed:
    name: web agreement (contract paths)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    if: github.event_name == 'pull_request'
    steps:
      # See the equivalent step in the compose job for why this must run before anything else
      # touches Docker in this job.
      - name: Enable the Docker containerd image store
        run: |
          echo '{"features": {"containerd-snapshotter": true}}' | sudo tee /etc/docker/daemon.json
          sudo systemctl restart docker
          docker info --format '{{.DriverStatus}}'
      # actions/checkout v7.0.0
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          path: dev-health-acr
          fetch-depth: 0
          persist-credentials: false
      - name: Decide whether the ACR/web contract changed
        id: decide
        working-directory: dev-health-acr
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          # The wire contract, plus everything that implements or grades the web agreement
          # itself. The first four paths cover a change to what the two sides exchange; the
          # rest cover a change to the check or to the stack it boots. Without them a PR could
          # rewrite the browser driver, the L6 comparison, the compose product slice, or the
          # web half of the orchestrator and merge having never run a single browser-agreement
          # check, since the only job that runs one on a PR is this one.
          paths='^(contracts/|internal/contracts/|internal/api/'
          paths="${paths}|testdata/fullstack/"
          paths="${paths}|scripts/e2e/svs-browser\.mjs"
          paths="${paths}|scripts/e2e/device-login-browser\.mjs"
          paths="${paths}|scripts/e2e/fullstack-opencode\.sh"
          paths="${paths}|scripts/e2e/compose\.sh"
          paths="${paths}|\.github/fullstack/compose\.ci\.yml"
          paths="${paths}|deploy/compose/acr\.compose\.yml"
          paths="${paths}|\.github/workflows/fullstack-acceptance\.yml"
          paths="${paths}|Makefile"
          paths="${paths}|tests/fullstack/assertrun/)"
          if git diff --name-only "$base" "$head" | grep -Eq "$paths"; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      # actions/checkout v7.0.0 — public repo, no token needed.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        if: steps.decide.outputs.run == 'true'
        with:
          repository: full-chaos/dev-health-ops
          path: dev-health/ops
          persist-credentials: false
      # actions/checkout v7.0.0 — public repo, no token needed.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        if: steps.decide.outputs.run == 'true'
        with:
          repository: full-chaos/dev-health-web
          path: dev-health/web
          ref: ${{ inputs.web_ref }}
          persist-credentials: false
      - name: Assemble the product-slice compose file and record checked-out refs
        if: steps.decide.outputs.run == 'true'
        run: |
          set -euo pipefail
          cp dev-health-acr/.github/fullstack/compose.ci.yml dev-health/compose.yml
          ops_ref="$(git -C dev-health/ops rev-parse HEAD)"
          web_ref="$(git -C dev-health/web rev-parse HEAD)"
          echo "E2E_OPS_REF=$ops_ref" >> "$GITHUB_ENV"
          echo "E2E_WEB_REF=$web_ref" >> "$GITHUB_ENV"
      # fullstack-opencode.sh's render_web_override() imports
      # dev-health/web/node_modules/@playwright/test directly and run_web_agreement_check()
      # requires it to already exist; a bare checkout has no node_modules at all.
      # pnpm/action-setup v6.0.9
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271
        if: steps.decide.outputs.run == 'true'
        with:
          package_json_file: dev-health/web/package.json
      # actions/setup-node v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        if: steps.decide.outputs.run == 'true'
        with:
          node-version: 25
      - name: Install web dependencies and the Playwright browser runtime
        if: steps.decide.outputs.run == 'true'
        working-directory: dev-health/web
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium
      # actions/setup-go v6.5.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        if: steps.decide.outputs.run == 'true'
        with:
          go-version: '1.27.0'
          cache: false
      - name: Install the pinned OpenCode release
        if: steps.decide.outputs.run == 'true'
        run: |
          # See the equivalent step in the compose job: the npm package's own postinstall
          # script verifies the download by running the binary with `--version` against
          # whatever HOME the install itself runs under, so the whole `npm install` needs the
          # throwaway root, not just an explicit version check afterward. This job doesn't
          # assert the operator's config is absent today, but there's no reason for it to
          # touch the runner's real HOME either.
          preflight="$RUNNER_TEMP/opencode-preflight"
          mkdir -p "$preflight"/{config,data,cache,state}
          export HOME="$preflight"
          export XDG_CONFIG_HOME="$preflight/config" XDG_DATA_HOME="$preflight/data"
          export XDG_CACHE_HOME="$preflight/cache" XDG_STATE_HOME="$preflight/state"
          npm install --global --no-fund --no-audit \
            "opencode-ai@${OPENCODE_PINNED_VERSION}"
          test "$(opencode --version)" = "$OPENCODE_PINNED_VERSION"
      - name: Pre-warm the provider package into the npm cache
        if: steps.decide.outputs.run == 'true'
        run: npm cache add "$PROVIDER_NPM_SPEC"
      - name: Run the gate with the live Context Packet Explorer check
        if: steps.decide.outputs.run == 'true'
        working-directory: dev-health-acr
        env:
          E2E_SCENARIO: full
          E2E_WEB: 'on'
          DEV_HEALTH_ROOT: ${{ github.workspace }}/dev-health
          E2E_WEB_ROOT: ${{ github.workspace }}/dev-health/web
          E2E_PROJECT: acr-fs-web-${{ github.run_id }}
        run: make fullstack-opencode-e2e
      # actions/upload-artifact v7.0.1
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always() && steps.decide.outputs.run == 'true'
        with:
          name: fullstack-web-agreement-${{ github.run_id }}
          path: dev-health-acr/.tmp/fullstack/
          if-no-files-found: warn
          retention-days: 7

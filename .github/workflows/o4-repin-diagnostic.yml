name: o4-repin-diagnostic

"on":
  pull_request:

permissions:
  contents: read
  packages: read

jobs:
  repin:
    runs-on: ubuntu-latest
    env:
      TESTCONTAINERS_HUB_IMAGE_NAME_PREFIX: ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with: {persist-credentials: false}
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.27.2'
          cache: true
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Repin the recorded outcome
        run: make o4-oracle-repin
      - name: Show the manifest diff
        run: git diff --stat && git diff -- internal/contextfabric/factoracle/testdata/venue/manifest.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: o4-manifest
          path: internal/contextfabric/factoracle/testdata/venue/manifest.json

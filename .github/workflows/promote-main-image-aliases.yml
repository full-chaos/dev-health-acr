---
name: apply-main-image-aliases

"on":
  push:
    branches: [agent/align-main-image-tags]

permissions:
  contents: write

concurrency:
  group: apply-main-image-aliases
  cancel-in-progress: true

jobs:
  apply-and-verify:
    if: >-
      github.repository == 'full-chaos/dev-health-acr' &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: agent/align-main-image-tags
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.26.5'
          cache: false
      - name: Apply canonical publisher alignment
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              data = target.read_text()
              count = data.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one replacement target, found {count}")
              target.write_text(data.replace(old, new))

          publisher = "scripts/release/publish-ci-release.sh"

          replace_once(
              publisher,
              """    if [[ \"$channel\" == main ]]; then
              printf 'Immutable main-commit container images:\\n\\n'
            else
              printf 'Versioned container images:\\n\\n'
            fi
            jq -r --arg tag \"$tag\" '.images[] | \"- `\" + .repository + \":\" + $tag + \"` (`\" + .repository + \"@\" + .digest + \"`)\"' \\
              \"$release_dir/container-release-manifest.json\"
            if [[ \"$channel\" == main ]]; then
              printf '\\nIf this commit is still the tip of `main` when publication completes, the same image digests and this GitHub Release are promoted to `latest`.\\n'
            fi
          """,
              """    if [[ \"$channel\" == main ]]; then
              printf 'Main-commit container images:\\n\\n'
            else
              printf 'Versioned container images:\\n\\n'
            fi
            jq -r --arg tag \"$tag\" '.images[] | \"- `\" + .repository + \":\" + $tag + \"` (`\" + .repository + \"@\" + .digest + \"`)\"' \\
              \"$release_dir/container-release-manifest.json\"
            if [[ \"$channel\" == main ]]; then
              printf '\\nThe same digest is also published as `sha-%s`; if this commit is still the tip of `main`, it is promoted to both `main` and `latest`.\\n' \"${commit:0:7}\"
            fi
          """,
          )

          insert_marker = """if \"$publish_latest\"; then
            while IFS=$'\\t' read -r product repository archive image_digest archive_sha256; do
          """
          short_alias_block = """if [[ \"$channel\" == main ]]; then
            short_tag=\"sha-${commit:0:7}\"
            while IFS=$'\\t' read -r product repository archive image_digest archive_sha256; do
              test -f \"$release_dir/$archive\" || fail \"container archive is missing: $archive\"
              test \"$(checksum_file \"$release_dir/$archive\")\" = \"$archive_sha256\" \\
                || fail \"container archive checksum mismatch: $archive\"
              short_reference=\"${repository}:${short_tag}\"
              existing_raw=\"$tmp/$product-short-existing-manifest.json\"
              existing_error=\"$tmp/$product-short-existing-manifest.err\"
              if skopeo inspect --raw --authfile \"$authfile\" \"docker://$short_reference\" \\
                >\"$existing_raw\" 2>\"$existing_error\"; then
                existing_digest=\"sha256:$(checksum_file \"$existing_raw\")\"
                test \"$existing_digest\" = \"$image_digest\" \\
                  || fail \"immutable GHCR short-SHA tag conflict: $short_reference points to $existing_digest, expected $image_digest\"
              else
                if ! grep -Eqi '(manifest unknown|name unknown|HTTP[^0-9]*404|status[^0-9]*404)' \"$existing_error\"; then
                  cat \"$existing_error\" >&2
                  fail \"cannot determine whether GHCR short-SHA tag exists: $short_reference\"
                fi
                skopeo copy --all --preserve-digests \\
                  --authfile \"$authfile\" \\
                  --digestfile \"$tmp/$product-short.digest\" \\
                  \"oci-archive:$release_dir/$archive\" \\
                  \"docker://$short_reference\"
                test \"$(tr -d '\\n' <\"$tmp/$product-short.digest\")\" = \"$image_digest\" \\
                  || fail \"GHCR reported the wrong digest for $short_reference\"
              fi
              test \"$(manifest_digest \"$short_reference\")\" = \"$image_digest\" \\
                || fail \"short-SHA GHCR tag does not resolve to the verified main image: $short_reference\"
            done < <(
              jq -r '.images[] | [.product, .repository, .archive, .digest, .archive_sha256] | @tsv' \\
                \"$release_dir/container-release-manifest.json\"
            )
          fi

          if \"$publish_latest\"; then
            while IFS=$'\\t' read -r product repository archive image_digest archive_sha256; do
          """
          replace_once(publisher, insert_marker, short_alias_block)

          replace_once(
              publisher,
              """    latest_reference=\"${repository}:latest\"
              skopeo copy --all --preserve-digests \\
                --authfile \"$authfile\" \\
                --digestfile \"$tmp/$product-latest.digest\" \\
                \"oci-archive:$release_dir/$archive\" \\
                \"docker://$latest_reference\"
              test \"$(tr -d '\\n' <\"$tmp/$product-latest.digest\")\" = \"$image_digest\" \\
                || fail \"GHCR reported the wrong digest for $latest_reference\"
              test \"$(manifest_digest \"$latest_reference\")\" = \"$image_digest\" \\
                || fail \"latest GHCR tag does not resolve to the verified main image: $latest_reference\"
          """,
              """    for moving_tag in main latest; do
                moving_reference=\"${repository}:${moving_tag}\"
                skopeo copy --all --preserve-digests \\
                  --authfile \"$authfile\" \\
                  --digestfile \"$tmp/$product-$moving_tag.digest\" \\
                  \"oci-archive:$release_dir/$archive\" \\
                  \"docker://$moving_reference\"
                test \"$(tr -d '\\n' <\"$tmp/$product-$moving_tag.digest\")\" = \"$image_digest\" \\
                  || fail \"GHCR reported the wrong digest for $moving_reference\"
                test \"$(manifest_digest \"$moving_reference\")\" = \"$image_digest\" \\
                  || fail \"moving GHCR tag does not resolve to the verified main image: $moving_reference\"
              done
          """,
          )

          replace_once(
              publisher,
              "preserving %s as an immutable SHA release without moving latest.",
              "preserving %s as an immutable SHA release without moving main or latest.",
          )
          replace_once(
              publisher,
              "published immutable SHA assets and promoted main to latest: %s\\n",
              "published immutable SHA assets and promoted main and latest: %s\\n",
          )

          tests = "scripts/release/test_release_scripts.sh"
          replace_once(
              tests,
              """grep -F 'latest_reference=\"${repository}:latest\"' \"$root/scripts/release/publish-ci-release.sh\" >/dev/null
          grep -F 'git/ref/heads/main' \"$root/scripts/release/publish-ci-release.sh\" >/dev/null
          """,
              """grep -F 'short_tag=\"sha-${commit:0:7}\"' \"$root/scripts/release/publish-ci-release.sh\" >/dev/null
          grep -F 'short_reference=\"${repository}:${short_tag}\"' \"$root/scripts/release/publish-ci-release.sh\" >/dev/null
          grep -F 'for moving_tag in main latest' \"$root/scripts/release/publish-ci-release.sh\" >/dev/null
          grep -F 'moving_reference=\"${repository}:${moving_tag}\"' \"$root/scripts/release/publish-ci-release.sh\" >/dev/null
          grep -F 'git/ref/heads/main' \"$root/scripts/release/publish-ci-release.sh\" >/dev/null
          """,
          )
          replace_once(
              tests,
              "grep -F 'full commit SHA and `latest`' \"$root/docs/container-images.md\" >/dev/null",
              "grep -F 'full commit SHA, `sha-<short-sha>`, `main`, and `latest`' \"$root/docs/container-images.md\" >/dev/null",
          )

          replace_once(
              "docs/container-images.md",
              """successful current-tip `main` build publishes both the full commit SHA and
          `latest` for `acr-api` and `acr-mcp`; canonical version tags publish their own
          immutable `vX.Y.Z[-dev.N|-beta.N]` references. The workflow verifies every
          """,
              """successful `main` build publishes the full commit SHA and immutable
          `sha-<short-sha>` alias for `acr-api` and `acr-mcp`. The current tip also owns
          the moving `main` and `latest` aliases; canonical version tags publish their
          own immutable `vX.Y.Z[-dev.N|-beta.N]` references. The workflow verifies every
          """,
          )
          replace_once(
              "docs/container-images.md",
              """Before moving `latest`, it rechecks the current GitHub `main` ref so an older
          run finishing out of order cannot roll the channel backward. The full commit SHA and `latest` therefore identify the same image only for the current tip of
          `main`.
          """,
              """Before moving `main` or `latest`, it rechecks the current GitHub `main` ref so
          an older run finishing out of order cannot roll the channel backward. The full
          commit SHA, `sha-<short-sha>`, `main`, and `latest` therefore identify the same
          image for the current tip of `main`.
          """,
          )

          policy = "docs/release-policy.md"
          replace_once(
              policy,
              """- every successful push to `main` publishes an immutable commit-SHA release and
            promotes that exact build to the moving `latest` aliases when the commit is
            still the current tip of `main`;
          """,
              """- every successful push to `main` publishes immutable full-SHA and
            `sha-<short-sha>` references, then promotes that exact build to the moving
            `main` and `latest` aliases when the commit is still the current branch tip;
          """,
          )
          replace_once(
              policy,
              """   authorization boundary. The workflow publishes the full 40-character commit
             SHA and, after rechecking the branch tip, the `latest` aliases.
          """,
              """   authorization boundary. The workflow publishes the full 40-character commit
             SHA and `sha-<short-sha>`, then, after rechecking the branch tip, the `main`
             and `latest` aliases.
          """,
          )
          replace_once(
              policy,
              """Before changing either moving `latest` alias, the final publication job reads
          the current `refs/heads/main` value from GitHub. A superseded run still publishes
          and verifies its immutable SHA release, but it cannot move `latest`. This closes
          """,
              """Before changing the moving `main` or `latest` aliases, the final publication
          job reads the current `refs/heads/main` value from GitHub. A superseded run still
          publishes and verifies its immutable full-SHA and short-SHA references, but it
          cannot move `main` or `latest`. This closes
          """,
          )
          replace_once(
              policy,
              """For the current tip of `main`, the exact verified OCI archives are published
          without rebuilding to both the immutable SHA and mutable convenience alias:

          ```text
          ghcr.io/full-chaos/dev-health-acr/acr-api:<40-character-commit-SHA>
          ghcr.io/full-chaos/dev-health-acr/acr-api:latest
          ghcr.io/full-chaos/dev-health-acr/acr-mcp:<40-character-commit-SHA>
          ghcr.io/full-chaos/dev-health-acr/acr-mcp:latest
          ```
          """,
              """The exact verified OCI archives are published without rebuilding under the
          immutable full-SHA and Dev Health standard short-SHA references. For the current
          tip of `main`, the same digest also owns the moving `main` and `latest` aliases:

          ```text
          ghcr.io/full-chaos/dev-health-acr/acr-api:<40-character-commit-SHA>
          ghcr.io/full-chaos/dev-health-acr/acr-api:sha-<7-character-commit-SHA>
          ghcr.io/full-chaos/dev-health-acr/acr-api:main
          ghcr.io/full-chaos/dev-health-acr/acr-api:latest
          ghcr.io/full-chaos/dev-health-acr/acr-mcp:<40-character-commit-SHA>
          ghcr.io/full-chaos/dev-health-acr/acr-mcp:sha-<7-character-commit-SHA>
          ghcr.io/full-chaos/dev-health-acr/acr-mcp:main
          ghcr.io/full-chaos/dev-health-acr/acr-mcp:latest
          ```
          """,
          )
          replace_once(
              policy,
              """`latest` is intentionally mutable and is suitable for following `main` in
          development environments. Production and rollback controls remain
          digest-oriented.
          """,
              """`main` and `latest` are intentionally mutable and are suitable for following
          the branch in development environments. Production and rollback controls remain
          digest-oriented.
          """,
          )
          replace_once(
              policy,
              """- `latest` is updated only from a `main` run whose commit still equals the
            current branch tip; its resulting digest is verified after the copy.
          """,
              """- `main` and `latest` are updated only from a `main` run whose commit still
            equals the current branch tip; each resulting digest is verified after copy.
          """,
          )
          PY
          git diff --check
      - name: Verify canonical publication contract
        run: |
          set -euo pipefail
          bash -n scripts/release/publish-ci-release.sh scripts/release/test_release_scripts.sh
          shellcheck -x -e SC2016 scripts/release/publish-ci-release.sh scripts/release/test_release_scripts.sh
          scripts/release/test_release_scripts.sh
          bash scripts/docs/verify.sh
          make verify
      - name: Commit and push verified alignment
        run: |
          set -euo pipefail
          git add \
            scripts/release/publish-ci-release.sh \
            scripts/release/test_release_scripts.sh \
            docs/container-images.md \
            docs/release-policy.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(release): publish main and SHA image aliases'
          git push origin HEAD:agent/align-main-image-tags

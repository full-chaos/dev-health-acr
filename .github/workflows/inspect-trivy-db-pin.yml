---
name: inspect-trivy-db-pin

"on":
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  inspect:
    if: >-
      github.repository == 'full-chaos/dev-health-acr' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/fix-main-release-tag'
    runs-on: ubuntu-24.04
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
      - name: Resolve and validate current Trivy DB snapshot
        env:
          TRIVY_IMAGE: aquasec/trivy:0.69.3@sha256:bcc376de8d77cfe086a917230e818dc9f8528e3c852f7b1aff648949b6258d1c
        run: |
          set -euo pipefail
          mutable_ref='ghcr.io/aquasecurity/trivy-db:2'
          manifest="$RUNNER_TEMP/trivy-db-manifest.json"
          docker buildx imagetools inspect "$mutable_ref" --raw >"$manifest"
          manifest_digest="sha256:$(sha256sum "$manifest" | awk '{print $1}')"
          layer_digest="$(jq -er '.layers | select(length == 1) | .[0].digest' "$manifest")"
          [[ "$manifest_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$layer_digest" =~ ^sha256:[0-9a-f]{64}$ ]]

          immutable_ref="ghcr.io/aquasecurity/trivy-db@$manifest_digest"
          immutable_manifest="$RUNNER_TEMP/trivy-db-immutable-manifest.json"
          docker buildx imagetools inspect "$immutable_ref" --raw >"$immutable_manifest"
          cmp "$manifest" "$immutable_manifest"
          jq -e --arg layer "$layer_digest" '.layers | length == 1 and .[0].digest == $layer' \
            "$immutable_manifest" >/dev/null

          docker pull "$TRIVY_IMAGE" >/dev/null
          cache="$RUNNER_TEMP/trivy-cache"
          mkdir -p "$cache"
          docker run --rm --pull=never \
            --user "$(id -u):$(id -g)" \
            --read-only --tmpfs /tmp:rw,noexec,nosuid,nodev,size=512m,mode=1777 \
            --cap-drop ALL --security-opt no-new-privileges \
            -e HOME=/tmp \
            -v "$cache:/tmp/trivy-cache" \
            "$TRIVY_IMAGE" image \
            --cache-dir /tmp/trivy-cache \
            --db-repository "$immutable_ref" \
            --download-db-only \
            --no-progress

          metadata="$cache/db/metadata.json"
          jq -e '
            def epoch: sub("\\.[0-9]+Z$"; "Z") | fromdateiso8601;
            .Version == 2 and
            (.UpdatedAt | epoch) <= now and
            (.DownloadedAt | epoch) <= now and
            (.NextUpdate | epoch) > (.UpdatedAt | epoch) and
            ((now - (.UpdatedAt | epoch)) <= (168 * 60 * 60))
          ' "$metadata" >/dev/null

          printf 'TRIVY_DB=%s\n' "$immutable_ref"
          printf 'TRIVY_DB_LAYER=%s\n' "$layer_digest"
          printf 'TRIVY_DB_METADATA=%s\n' "$(jq -c '{Version,UpdatedAt,NextUpdate,DownloadedAt}' "$metadata")"

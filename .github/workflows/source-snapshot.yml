---
name: apply-keyless-consumer-fix

"on":
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: apply-keyless-consumer-fix-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  apply-and-verify:
    if: >-
      github.event.pull_request.head.ref == 'agent/publish-acr-artifacts' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
      START_SHA: ${{ github.event.pull_request.head.sha }}
      PATCH_GZIP_SHA256: 686c66496be204e8eafffe60e703787a79048a6c3974658bc704bf7499e32e04
      PATCH_SHA256: 94e7e9cff46861d2cf62699ee9271b0d4ee196dc2de1aef0e18dc4d39faa1719
      FOLLOWUP_GZIP_SHA256: d2400e14ab68187805dea7809cdfd0baba1758ea90cf1c14cd418067233ee20a
      FOLLOWUP_SHA256: 7b669db8af8317e373f0b711326dba660fc22e5278cd407bbac17bf4d570f8a8
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.26.5'
          cache: false
      - name: Reconstruct and apply verified patches
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$START_SHA"

          patch_gz="$RUNNER_TEMP/keyless-consumer.patch.gz"
          patch_file="$RUNNER_TEMP/keyless-consumer.patch"
          cat .github/patches/keyless-consumer.patch.gz.b64.* \
            | base64 --decode >"$patch_gz"
          printf '%s  %s\n' "$PATCH_GZIP_SHA256" "$patch_gz" | sha256sum --check -
          gzip --decompress --stdout "$patch_gz" >"$patch_file"
          printf '%s  %s\n' "$PATCH_SHA256" "$patch_file" | sha256sum --check -
          git apply --check "$patch_file"
          git apply "$patch_file"

          followup_gz="$RUNNER_TEMP/keyless-followup.patch.gz"
          followup_file="$RUNNER_TEMP/keyless-followup.patch"
          base64 --decode .github/patches/keyless-followup.patch.gz.b64 >"$followup_gz"
          printf '%s  %s\n' "$FOLLOWUP_GZIP_SHA256" "$followup_gz" | sha256sum --check -
          gzip --decompress --stdout "$followup_gz" >"$followup_file"
          printf '%s  %s\n' "$FOLLOWUP_SHA256" "$followup_file" | sha256sum --check -
          git apply --check "$followup_file"
          git apply "$followup_file"

          gofmt -w \
            internal/mcpclientfixtures/doc_parity_test.go \
            internal/mcpclientfixtures/install_snippet_targeted_verify_test.go \
            internal/mcpclientfixtures/install_snippets.go \
            internal/mcpclientfixtures/windows_snippet_failclosed_test.go \
            internal/mcpclientfixtures/windows_snippet_parity_test.go
          git diff --check
      - name: Prepare final clean commit
        run: |
          set -euo pipefail
          git rm .github/workflows/source-snapshot.yml
          git rm .github/patches/keyless-consumer.patch.gz.b64.*
          git rm .github/patches/keyless-followup.patch.gz.b64
          git add -A
          cat >"$RUNNER_TEMP/expected-files" <<'EXPECTED_FILES'
          .github/patches/keyless-consumer.patch.gz.b64.00
          .github/patches/keyless-consumer.patch.gz.b64.01
          .github/patches/keyless-consumer.patch.gz.b64.02
          .github/patches/keyless-consumer.patch.gz.b64.03
          .github/patches/keyless-followup.patch.gz.b64
          .github/workflows/source-snapshot.yml
          docs/examples/mcp-clients/README.md
          docs/examples/mcp-clients/claude-code.md
          docs/examples/mcp-clients/codex.md
          docs/examples/mcp-clients/cursor.md
          docs/examples/mcp-clients/generic-stdio.md
          docs/examples/mcp-clients/opencode.md
          docs/implementation-backlog.md
          docs/operations.md
          docs/release-notes-template.md
          docs/release-policy.md
          internal/mcpclientfixtures/doc_parity_test.go
          internal/mcpclientfixtures/install_snippet_targeted_verify_test.go
          internal/mcpclientfixtures/install_snippets.go
          internal/mcpclientfixtures/windows_snippet_failclosed_test.go
          internal/mcpclientfixtures/windows_snippet_parity_test.go
          EXPECTED_FILES
          git diff --cached --name-only | LC_ALL=C sort >"$RUNNER_TEMP/actual-files"
          LC_ALL=C sort -o "$RUNNER_TEMP/expected-files" "$RUNNER_TEMP/expected-files"
          diff -u "$RUNNER_TEMP/expected-files" "$RUNNER_TEMP/actual-files"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(docs): align release verification with sigstore bundle'
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
      - name: Verify documentation contract
        run: bash scripts/docs/verify.sh
      - name: Run MCP client fixture contract
        id: fixture-test
        run: |
          set +e
          go test ./internal/mcpclientfixtures -count=1 -v \
            >"$RUNNER_TEMP/mcpclientfixtures.log" 2>&1
          status=$?
          set -e
          printf 'status=%s\n' "$status" >>"$GITHUB_OUTPUT"
      - name: Upload MCP client fixture diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: mcpclientfixtures-diagnostics
          path: ${{ runner.temp }}/mcpclientfixtures.log
          if-no-files-found: error
          retention-days: 1
      - name: Enforce MCP client fixture contract
        if: steps.fixture-test.outputs.status != '0'
        run: |
          cat "$RUNNER_TEMP/mcpclientfixtures.log"
          exit "${{ steps.fixture-test.outputs.status }}"
      - name: Run complete repository verification
        id: repository-verify
        run: |
          set +e
          make verify >"$RUNNER_TEMP/make-verify.log" 2>&1
          status=$?
          set -e
          printf 'status=%s\n' "$status" >>"$GITHUB_OUTPUT"
      - name: Upload complete repository verification diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: make-verify-diagnostics
          path: ${{ runner.temp }}/make-verify.log
          if-no-files-found: error
          retention-days: 1
      - name: Enforce complete repository verification
        if: steps.repository-verify.outputs.status != '0'
        run: |
          cat "$RUNNER_TEMP/make-verify.log"
          exit "${{ steps.repository-verify.outputs.status }}"
      - name: Push verified fix
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          git push origin "HEAD:$HEAD_BRANCH"

---
name: chaos-14607-count20

"on":
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  packages: read

jobs:
  count20:
    name: project mix chunked parity cell x20
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      TESTCONTAINERS_HUB_IMAGE_NAME_PREFIX: ghcr.io/${{ github.repository }}
      TESTCONTAINERS_RYUK_DISABLED: 'true'
      ACR_CONTAINER_TESTS: '1'
      TESTCONTAINERS_SESSION_ID: ci-${{ github.run_id }}-${{ github.run_attempt }}-count20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with: {persist-credentials: false}
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.27.4'
          cache: true
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Run the cell 20 times
        shell: bash
        run: set -o pipefail; go test ./internal/contextfabric/devhealthfacts -run '^TestProjectMixChunkedReadEqualsTheOneChunkReadAgainstRealClickHouse$' -count=20 -timeout 110m -v 2>&1 | tee count20.log
      - name: Count pass and fail
        if: always()
        shell: bash
        run: |
          cell=TestProjectMixChunkedReadEqualsTheOneChunkReadAgainstRealClickHouse
          echo "PASS cell: $(grep -c -- "^--- PASS: ${cell} " count20.log || true)"
          echo "FAIL cell: $(grep -c -- "^--- FAIL: ${cell} " count20.log || true)"
          for sub in all_units_in_the_window a_quarter_of_the_units_in_the_window; do
            echo "PASS ${sub}: $(grep -c -F -- "--- PASS: ${cell}/${sub} " count20.log || true)"
            echo "FAIL ${sub}: $(grep -c -F -- "--- FAIL: ${cell}/${sub} " count20.log || true)"
          done
          echo "SKIP: $(grep -c -F -- "--- SKIP: ${cell}" count20.log || true)"
      - name: Remove this job's testcontainers by session id
        if: always()
        run: scripts/ci/reap-testcontainers-session.sh

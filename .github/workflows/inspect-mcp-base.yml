---
name: inspect-mcp-base

"on":
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  inspect:
    if: >-
      github.repository == 'full-chaos/dev-health-acr' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/fix-main-release-tag'
    runs-on: ubuntu-24.04
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
      - name: Compare pinned and current Chainguard Git images
        env:
          TRIVY_IMAGE: aquasec/trivy:0.69.3@sha256:bcc376de8d77cfe086a917230e818dc9f8528e3c852f7b1aff648949b6258d1c
          TRIVY_DB: ghcr.io/aquasecurity/trivy-db@sha256:7d5d30fa0e218e69d7f530f9ac32ccceeab48fb73245ae850b19e83186c66e6f
          PINNED_IMAGE: cgr.dev/chainguard/git:latest@sha256:7e0cf19de437467abd96f7ba86cf107d8872d0de85c9956dc2a69ad34eeff73b
        run: |
          set -euo pipefail
          mutable_ref='cgr.dev/chainguard/git:latest'
          current_raw="$RUNNER_TEMP/current-index.json"
          docker buildx imagetools inspect "$mutable_ref" --raw >"$current_raw"
          current_digest="sha256:$(sha256sum "$current_raw" | awk '{print $1}')"
          current_image="cgr.dev/chainguard/git:latest@$current_digest"
          jq -e '[.manifests[].platform | (.os + "/" + .architecture)] | contains(["linux/amd64", "linux/arm64"])' \
            "$current_raw" >/dev/null
          printf 'CURRENT_IMAGE=%s\n' "$current_image"

          docker pull "$TRIVY_IMAGE" >/dev/null
          cache="$RUNNER_TEMP/trivy-cache"
          reports="$RUNNER_TEMP/reports"
          mkdir -p "$cache" "$reports"
          docker run --rm --pull=never \
            --user "$(id -u):$(id -g)" \
            --read-only --tmpfs /tmp:rw,noexec,nosuid,nodev,size=512m,mode=1777 \
            --cap-drop ALL --security-opt no-new-privileges \
            -e HOME=/tmp \
            -v "$cache:/tmp/trivy-cache" \
            "$TRIVY_IMAGE" image \
            --cache-dir /tmp/trivy-cache \
            --db-repository "$TRIVY_DB" \
            --download-db-only \
            --no-progress

          for label in pinned current; do
            if [[ "$label" == pinned ]]; then image="$PINNED_IMAGE"; else image="$current_image"; fi
            docker pull --platform linux/amd64 "$image" >/dev/null
            docker run --rm --pull=never --network none \
              --user "$(id -u):$(id -g)" \
              --read-only --tmpfs /tmp:rw,noexec,nosuid,nodev,size=512m,mode=1777 \
              --cap-drop ALL --security-opt no-new-privileges \
              -e HOME=/tmp \
              -v /var/run/docker.sock:/var/run/docker.sock:ro \
              -v "$cache:/tmp/trivy-cache" \
              -v "$reports:/reports" \
              "$TRIVY_IMAGE" image \
              --cache-dir /tmp/trivy-cache \
              --skip-db-update \
              --skip-version-check \
              --severity HIGH,CRITICAL \
              --format json \
              --output "/reports/$label.json" \
              "$image"
            printf '%s findings:\n' "$label"
            jq -r '[.Results[]?.Vulnerabilities[]? | select(.Severity == "HIGH" or .Severity == "CRITICAL")] | if length == 0 then "none" else .[] | "\(.VulnerabilityID)\t\(.PkgName)\tinstalled=\(.InstalledVersion)\tfixed=\(.FixedVersion // "none")\tseverity=\(.Severity)" end' \
              "$reports/$label.json"
          done

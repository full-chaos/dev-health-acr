---
# The self-hosted ATTEMPT leg of Runner-routing contract v1.
#
# Why this is a separate workflow rather than sibling jobs inside ci.yml
# (the shape the ops reference implementation uses): ci.yml's `verify` job is
# the single required gate, it `needs` EVERY other job in that file, and it
# rejects any result that is not `success` -- and
# scripts/ci/test-workflow-contract.sh asserts SET EQUALITY between ci.yml's
# job list and verify.needs, with negative controls in both directions, so an
# added job can neither be left out of `needs` nor resolve to anything but
# success. An attempt job gated on the kill switch resolves `skipped` while
# the switch is off, which would turn the required gate red on every run.
# Putting the attempt here instead leaves ci.yml's job graph identical in
# name and count with the switch off or on, and leaves both `verify` and the
# contract test completely untouched.
#
# What that costs, stated plainly: the hosted leg in ci.yml cannot poll
# `runs/{GITHUB_RUN_ID}/jobs`, because this attempt is in a different run. It
# resolves this run by full 40-character head SHA + workflow name + workflow
# path + event + ref -- see scripts/ci/self-hosted-attempt.sh, which
# implements and tests that lookup.
#
# The checks this workflow registers on a pull request are exactly the job
# names below, each suffixed `-self-hosted`. They are deliberately NOT named
# after any job in ci.yml: nothing here should ever be mistaken for a
# required context, and the required gate remains ci.yml's `verify` alone.
name: ci-self-hosted

"on":
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A group of its own, so this workflow can neither cancel nor be cancelled by
# ci.yml's `ci-${{ github.workflow }}-${{ github.ref }}`. The two runs are
# independent: a new push cancels this run and ci.yml's run separately, each
# by its own group, which is what keeps a superseded attempt from holding an
# ephemeral ARC runner while its replacement queues behind it.
concurrency:
  group: ci-self-hosted-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The attempt for ci.yml's `race-devhealthschema` job.
  #
  # This job is the pilot for the whole routing because it is the ONE heavy
  # acr job with no image-architecture risk at all: it starts no containers,
  # logs in to no registry, and needs no psql client -- it is `go test -race`
  # over one package. Every other candidate (unit, the four race shards,
  # build) additionally bets on the ephemeral ARC pod providing a working
  # Docker daemon, which is measured by the probe step below rather than
  # assumed, and is a later PR's decision.
  #
  # `if:` carries contract v1's two gates: the repository variable must be
  # the literal string `enabled` (unset, or anything else, is OFF -- the
  # fail-safe default), and fork pull requests are excluded regardless of the
  # switch, so self-hosted capacity is never reachable from an untrusted
  # fork's workflow run.
  race-devhealthschema-self-hosted:
    if: >-
      vars.SELF_HOSTED_RUNNERS == 'enabled'
      && (github.event_name != 'pull_request'
      || github.event.pull_request.head.repo.full_name == github.repository)
    # The scale-set name ALONE, with no `self-hosted` label beside it. An
    # Actions Runner Controller gha-runner-scale-set assigns a job only when
    # `runs-on` matches the scale set's name exactly; a label array -- even one
    # whose entries are individually correct -- never matches, and the job sits
    # queued until GitHub's 24-hour backstop with no error anywhere. Measured
    # on the first pilot: the attempt job carrying [self-hosted,
    # oci-arc-runners] stayed queued for over an hour with a healthy listener
    # and zero assigned jobs, and the hosted leg took the work at its bound.
    # The takeover is what made that survivable rather than red.
    runs-on: oci-arc-runners
    # Kept in sync by hand with ATTEMPT_TIMEOUT_MINUTES in ci.yml's hosted
    # leg (workflow YAML has no cross-workflow expression for it); the hosted
    # leg allows this plus a three-minute reporting-lag buffer before it
    # calls a started-but-never-finished attempt a failure.
    timeout-minutes: 10
    steps:
      # actions/checkout v7.0.0 -- the same pin ci.yml uses. On a pull
      # request this checks out the merge ref, exactly as ci.yml's own jobs
      # do, so both legs test the identical tree.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with: {persist-credentials: false}
      # actions/setup-go v6.5.0 -- same pin, same version, same cache
      # setting as ci.yml's race-devhealthschema job.
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.27.0'
          cache: true

      # A mislabeled or reassigned runner would make this job's result mean
      # something other than what it claims. The pool is arm64-only by
      # construction (OCI Ampere), so anything else is a misconfiguration to
      # fail loudly on, not to quietly validate the wrong architecture.
      - name: Confirm this runner is actually arm64
        run: |
          set -euo pipefail
          uname -m
          arch="$(go env GOARCH)"
          if [ "${arch}" != "arm64" ]; then
            echo "expected GOARCH=arm64 on oci-arc-runners, got '${arch}'" >&2
            exit 1
          fi

      # Deliberately NON-FAILING, and deliberately not acted on. These are
      # the measurements that decide whether unit / the race shards / build
      # can move next, and every one of them is a question this lane refused
      # to answer by inference: the acr ghcr mirror was confirmed multi-arch
      # off-runner (see the PR body's imagetools table), but whether an
      # ephemeral ARC pod even has a Docker daemon to pull into, or a psql
      # client for the compose ACL integration test, or the memory to run
      # the race detector over a container-backed suite, cannot be read off
      # a manifest. A missing tool here must not sink the pilot -- the pilot
      # is proving the ROUTING; this step is gathering the evidence for the
      # next PR's scope. `|| true` is correct here for exactly that reason,
      # and is confined to this one reporting step.
      - name: Probe the runner for the tier-2 preconditions (never fails)
        run: |
          set -uo pipefail
          echo "--- cpu / memory / go bounds ---"
          nproc || true
          free -h 2>/dev/null || true
          go env GOARCH GOMAXPROCS GOFLAGS GOCACHE || true
          echo "--- docker daemon (gates unit / race shards / build) ---"
          if command -v docker >/dev/null 2>&1; then
            docker version --format '{{.Server.Arch}} {{.Server.Version}}' || true
            docker info --format '{{.OperatingSystem}} {{.Driver}}' || true
          else
            echo "docker: ABSENT -- the container-backed jobs cannot move here"
          fi
          echo "--- postgres client (gates unit / race shards) ---"
          command -v psql || echo "psql: ABSENT"
          command -v pg_isready || echo "pg_isready: ABSENT"
          echo "--- toolchain the make targets need ---"
          for tool in make git jq node curl; do
            printf '%s: %s\n' "$tool" "$(command -v "$tool" || echo ABSENT)"
          done
          echo "--- arm64 pull from acr's own ghcr mirror (gates tier 2) ---"
          # Confirms ON THE RUNNER what `docker buildx imagetools inspect`
          # showed off-runner: acr's repo-scoped mirror is multi-arch. The
          # ops mirror gap (CHAOS-4903) is a different package entirely.
          if command -v docker >/dev/null 2>&1; then
            pg='ghcr.io/full-chaos/dev-health-acr/postgres@sha256:a1d02e4bd40c94d3bf2bdd3678c137388e76d9efcd23c285e9429d336a834b44'
            if docker pull -q "$pg"; then
              docker image inspect "$pg" --format '{{.Architecture}}' || true
            else
              echo "pull FAILED (expected while unauthenticated to ghcr; not a pilot failure)"
            fi
          fi

      # The real work: the SAME `make test-race` invocation, with the same
      # package list and the same timeout override, that ci.yml's
      # race-devhealthschema job runs -- deliberately the make target rather
      # than an open-coded `go test`, so the two legs cannot drift apart on
      # flags (the shared target owns -count=1, -race and the shuffle seed).
      #
      # The result-line count is the salted positive, and it is keyed on the
      # POPULATION rather than on a pattern: `go test` exits 0 having run
      # nothing when its package list is empty, so an edit to test-shard.sh's
      # isolated_packages that emptied this set would leave this job green
      # having proved nothing. Asserting one `ok` line per package proves
      # every package the shard list names actually produced a result. On a
      # job whose whole purpose is to be a trustworthy stand-in for the
      # hosted leg, a silently vacuous pass is the worst failure available.
      - name: Run the isolated devhealthschema race suite on arm64
        run: |
          set -euo pipefail
          packages="$(scripts/ci/test-shard.sh isolated)"
          printf 'isolated packages:\n%s\n' "$packages"
          expected="$(printf '%s' "$packages" | wc -w | tr -d '[:space:]')"
          if [ "$expected" -eq 0 ]; then
            echo "test-shard.sh isolated printed no packages -- refusing to report a pass over an empty set" >&2
            exit 1
          fi
          out="${RUNNER_TEMP}/race-output.txt"
          make test-race GOTEST_PKGS="$packages" GOTEST_TIMEOUT=900s 2>&1 | tee "$out"
          passed="$(grep -c '^ok' "$out" || true)"
          printf 'packages expected: %s, packages reporting ok: %s\n' "$expected" "$passed"
          if [ "$passed" -ne "$expected" ]; then
            echo "expected one result line per isolated package; a package that produced no result means this job proved less than it claims" >&2
            exit 1
          fi

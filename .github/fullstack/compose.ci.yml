# CHAOS-3065 fullstack-acceptance gate: minimal CI product-slice compose.
#
# scripts/e2e/compose.sh's prepare_state() copies this file to
# $STATE/stage/compose.yml, then symlinks `ops/` and `web/` into that same
# stage directory from beside wherever this file lives. In CI the workflow
# assembles that layout by checking out the PUBLIC full-chaos/dev-health-ops
# and full-chaos/dev-health-web repositories to dev-health/{ops,web} and
# copying this file to dev-health/compose.yml — see
# .github/workflows/fullstack-acceptance.yml.
#
# This is NOT a copy of chris's local dev-health/compose.yml (untracked,
# never committed anywhere, may carry local-only config). It is authored
# from scratch using only what dev-health-ops's own tracked compose.yml and
# docker/Dockerfile publicly document: the Go operator image target bakes
# the api in (no source bind mount needed), the migrate service runs the dho target, and
# docker/init-extra-dbs.sh provisions the River roles from POSTGRES_USER/
# POSTGRES_DB container env. render_override() in compose.sh (the shared
# E2E driver) replaces postgres/clickhouse/valkey/pgbouncer/api images,
# ports and some environment keys at run time and exports the resolved
# credentials as shell vars, which is why api/migrate/pgbouncer below read
# ${POSTGRES_USER}/${POSTGRES_PASSWORD}/${POSTGRES_DB}/${CLICKHOUSE_*}
# rather than hardcoding them the way dev-health-ops's own standalone
# compose.yml does for local dev.
#
# query-api is included because dev-health-ops serves Go-owned GraphQL
# operations (catalog and the rest of the registry) only through it: the
# Python resolvers were deleted, so without a query-api service and a
# go_api_routing_state row the ops `api` raises GoServedOperationUnavailableError.
# It is built from the SAME ./ops checkout as `api`, so both planes hash the
# same schema SDL (a prebuilt image can drift from the checkout and
# seed_go_api_routing refuses a digest mismatch). The envelope key
# pair and the routing rows are per-run material created by
# scripts/e2e/compose.sh (write_go_api_envelope_material,
# seed_go_api_routing).
#
# Deliberately excluded (not needed to boot ACR + the two MCP tools + the
# smoke/full task set): billing-edge, worker-*, beat, bugsink, mailpit,
# SigNoz/observability. Scoped out explicitly rather than faked; see the
# fullstack-acceptance.yml PR body for what that means for L6/device-login
# coverage.

name: dev-health

networks:
  dev-health: {}

volumes:
  postgres_data: {}
  clickhouse_data: {}

services:
  postgres:
    image: postgres:18-alpine@sha256:9a8afca54e7861fd90fab5fdf4c42477a6b1cb7d293595148e674e0a3181de15
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-devhealth}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devhealth}
      POSTGRES_DB: ${POSTGRES_DB:-devhealth}
      PGDATA: /var/lib/postgresql/pgdata
      RIVER_DOMAIN_DATABASE_ROLE: ${RIVER_DOMAIN_DATABASE_ROLE:-devhealth_domain}
      RIVER_QUEUE_DATABASE_ROLE: ${RIVER_QUEUE_DATABASE_ROLE:-devhealth_queue}
      RIVER_COORDINATOR_DATABASE_ROLE: ${RIVER_COORDINATOR_DATABASE_ROLE:-devhealth_coordinator}
      RIVER_DOMAIN_DATABASE_PASSWORD: ${RIVER_DOMAIN_DATABASE_PASSWORD:-devhealth_domain}
      RIVER_QUEUE_DATABASE_PASSWORD: ${RIVER_QUEUE_DATABASE_PASSWORD:-devhealth_queue}
      RIVER_COORDINATOR_DATABASE_PASSWORD: ${RIVER_COORDINATOR_DATABASE_PASSWORD:-devhealth_coordinator}
    volumes:
      - postgres_data:/var/lib/postgresql/
      - ./ops/docker/init-extra-dbs.sh:/docker-entrypoint-initdb.d/init-extra-dbs.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-devhealth}"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks: [dev-health]

  pgbouncer:
    image: edoburu/pgbouncer:latest
    restart: unless-stopped
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: ${POSTGRES_USER:-devhealth}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-devhealth}
      DB_NAME: ${POSTGRES_DB:-devhealth}
      LISTEN_PORT: "6432"
      POOL_MODE: transaction
      AUTH_TYPE: scram-sha-256
      MAX_CLIENT_CONN: "200"
      DEFAULT_POOL_SIZE: "10"
      ADMIN_USERS: ${POSTGRES_USER:-devhealth}
      PGPASSWORD: ${POSTGRES_PASSWORD:-devhealth}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "psql", "-w", "-h", "localhost", "-p", "6432", "-U", "${POSTGRES_USER:-devhealth}", "-d", "${POSTGRES_DB:-devhealth}", "-c", "SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks: [dev-health]

  clickhouse:
    image: clickhouse/clickhouse-server:latest@sha256:d7556a3841027651307b5aa08d72b5c467d0241d3db5b67d9e158ef3975626f5
    restart: on-failure
    environment:
      CLICKHOUSE_LISTEN_HOST: 0.0.0.0
      CLICKHOUSE_USER: ch
      CLICKHOUSE_PASSWORD: ch
      CLICKHOUSE_DB: default
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --host clickhouse --user default --password ch --query 'SELECT 1'"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks: [dev-health]

  valkey:
    image: valkey/valkey:9-alpine@sha256:ee91f7a174ac4d6a6b0685b3a60e321f0a9dbbb691f9b0e285be2ba1d1be8328
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks: [dev-health]

  migrate:
    build:
      context: ./ops
      dockerfile: docker/go-worker.Dockerfile
      target: dho
    restart: "no"
    command: ["migrate", "upgrade", "--river"]
    environment:
      DEV_HEALTH_ALLOW_CELERY_RIVER_CUTOVER: ${DEV_HEALTH_ALLOW_CELERY_RIVER_CUTOVER:-1}
      RIVER_DATABASE_SCHEMA: ${RIVER_DATABASE_SCHEMA:-river}
      RIVER_DOMAIN_DATABASE_ROLE: ${RIVER_DOMAIN_DATABASE_ROLE:-devhealth_domain}
      RIVER_QUEUE_DATABASE_ROLE: ${RIVER_QUEUE_DATABASE_ROLE:-devhealth_queue}
      MIGRATION_DATABASE_URI: postgres://${POSTGRES_USER:-devhealth}:${POSTGRES_PASSWORD:-devhealth}@postgres:5432/${POSTGRES_DB:-devhealth}?sslmode=disable
      CLICKHOUSE_URI: clickhouse://${CLICKHOUSE_USER:-default}:${CLICKHOUSE_PASSWORD:-ch}@clickhouse:9000/${CLICKHOUSE_DB:-default}
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    networks: [dev-health]

  # One-shot: creates the unprivileged Postgres logins (`dho migrate roles`),
  # including the api's own, after the canonical migrate service has created every
  # semantic table the grants cover. Operator image, built from ./ops.
  go-api-roles:
    build:
      context: ./ops
      dockerfile: docker/go-worker.Dockerfile
      target: operator
    image: ${DEV_HEALTH_GO_OPERATOR_IMAGE:-ghcr.io/full-chaos/dev-health-go-operator:local}
    restart: "no"
    command: ["migrate", "roles"]
    environment:
      DEV_HEALTH_MIGRATION_PG_HOST: postgres
      DEV_HEALTH_MIGRATION_PG_USER: ${POSTGRES_USER:-devhealth}
      DEV_HEALTH_MIGRATION_PG_PASSWORD: ${POSTGRES_PASSWORD:-devhealth}
      DEV_HEALTH_MIGRATION_PG_DB: ${POSTGRES_DB:-devhealth}
      RIVER_DOMAIN_DATABASE_ROLE: ${RIVER_DOMAIN_DATABASE_ROLE:-devhealth_domain}
      RIVER_QUEUE_DATABASE_ROLE: ${RIVER_QUEUE_DATABASE_ROLE:-devhealth_queue}
      RIVER_COORDINATOR_DATABASE_ROLE: ${RIVER_COORDINATOR_DATABASE_ROLE:-devhealth_coordinator}
      RIVER_DOMAIN_DATABASE_PASSWORD: ${RIVER_DOMAIN_DATABASE_PASSWORD:-devhealth_domain}
      RIVER_QUEUE_DATABASE_PASSWORD: ${RIVER_QUEUE_DATABASE_PASSWORD:-devhealth_queue}
      RIVER_COORDINATOR_DATABASE_PASSWORD: ${RIVER_COORDINATOR_DATABASE_PASSWORD:-devhealth_coordinator}
      API_DATABASE_ROLE: ${API_DATABASE_ROLE:-devhealth_api}
      API_DATABASE_PASSWORD: ${API_DATABASE_PASSWORD:-devhealth_api}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks: [dev-health]

  # One-shot: applies the privilege policy for the roles above, including the api
  # role's grants on the semantic tables (`dho migrate river --apply-and-check` reads
  # API_DATABASE_ROLE). The canonical migrate service runs before the roles exist, so
  # its grants cannot cover the api login; without this step the api answers
  # "permission denied for table feature_flags".
  go-api-grants:
    image: ${DEV_HEALTH_GO_OPERATOR_IMAGE:-ghcr.io/full-chaos/dev-health-go-operator:local}
    pull_policy: never
    restart: "no"
    command: ["migrate", "river", "--apply-and-check"]
    environment:
      DEV_HEALTH_MIGRATION_PG_HOST: postgres
      DEV_HEALTH_MIGRATION_PG_USER: ${POSTGRES_USER:-devhealth}
      DEV_HEALTH_MIGRATION_PG_PASSWORD: ${POSTGRES_PASSWORD:-devhealth}
      DEV_HEALTH_MIGRATION_PG_DB: ${POSTGRES_DB:-devhealth}
      RIVER_DATABASE_SCHEMA: ${RIVER_DATABASE_SCHEMA:-river}
      RIVER_DOMAIN_DATABASE_ROLE: ${RIVER_DOMAIN_DATABASE_ROLE:-devhealth_domain}
      RIVER_QUEUE_DATABASE_ROLE: ${RIVER_QUEUE_DATABASE_ROLE:-devhealth_queue}
      RIVER_COORDINATOR_DATABASE_ROLE: ${RIVER_COORDINATOR_DATABASE_ROLE:-devhealth_coordinator}
      RIVER_COORDINATOR_DATABASE_PASSWORD: ${RIVER_COORDINATOR_DATABASE_PASSWORD:-devhealth_coordinator}
      API_DATABASE_ROLE: ${API_DATABASE_ROLE:-devhealth_api}
    depends_on:
      go-api-roles:
        condition: service_completed_successfully
    networks: [dev-health]

  # The Go ops api (`dho api`): public listener :8000 (login, session routes),
  # internal listener :8091 (the acr entitlement route), billing edge :8010.
  # Distroless runtime: no shell or wget, so no container healthcheck;
  # scripts/e2e/compose.sh wait_go_api probes the internal listener from the
  # network instead.
  go-api:
    image: ${DEV_HEALTH_GO_OPERATOR_IMAGE:-ghcr.io/full-chaos/dev-health-go-operator:local}
    pull_policy: never
    restart: unless-stopped
    command:
      - api
      - --api-addr=:8000
      - --api-billing-edge-addr=:8010
      - --api-internal-addr=:8091
      - --http-addr=:8080
      - --river-schema=${RIVER_DATABASE_SCHEMA:-river}
      - --domain-database-role=${RIVER_DOMAIN_DATABASE_ROLE:-devhealth_domain}
      - --queue-database-role=${RIVER_QUEUE_DATABASE_ROLE:-devhealth_queue}
      - --domain-transaction-pooler=true
    environment:
      DEV_HEALTH_PG_API_HOST: postgres
      DEV_HEALTH_PG_API_PORT: "5432"
      DEV_HEALTH_PG_API_USER: ${API_DATABASE_ROLE:-devhealth_api}
      DEV_HEALTH_PG_API_PASSWORD: ${API_DATABASE_PASSWORD:-devhealth_api}
      DEV_HEALTH_PG_DB: ${POSTGRES_DB:-devhealth}
      API_DATABASE_ROLE: ${API_DATABASE_ROLE:-devhealth_api}
      DEV_HEALTH_PG_DOMAIN_HOST: pgbouncer
      DEV_HEALTH_PG_DOMAIN_PORT: "6432"
      DEV_HEALTH_PG_DOMAIN_USER: ${RIVER_DOMAIN_DATABASE_ROLE:-devhealth_domain}
      DEV_HEALTH_PG_DOMAIN_PASSWORD: ${RIVER_DOMAIN_DATABASE_PASSWORD:-devhealth_domain}
      DEV_HEALTH_PG_QUEUE_HOST: postgres
      DEV_HEALTH_PG_QUEUE_PORT: "5432"
      DEV_HEALTH_PG_QUEUE_USER: ${RIVER_QUEUE_DATABASE_ROLE:-devhealth_queue}
      DEV_HEALTH_PG_QUEUE_PASSWORD: ${RIVER_QUEUE_DATABASE_PASSWORD:-devhealth_queue}
      DEV_HEALTH_CH_HOST: clickhouse
      DEV_HEALTH_CH_PORT: "9000"
      DEV_HEALTH_CH_USER: ${CLICKHOUSE_USER:-default}
      DEV_HEALTH_CH_PASSWORD: ${CLICKHOUSE_PASSWORD:-ch}
      DEV_HEALTH_CH_DB: ${CLICKHOUSE_DB:-default}
      VALKEY_URI: redis://valkey:6379/1
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-ci-fixture-jwt-secret-key-0123456789abcdef}
      SETTINGS_ENCRYPTION_KEY: ${SETTINGS_ENCRYPTION_KEY:-}
      STRIPE_SECRET_KEY: ""
      STRIPE_WEBHOOK_SECRET: ""
      LICENSE_PRIVATE_KEY: ""
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      valkey:
        condition: service_healthy
      pgbouncer:
        condition: service_healthy
      go-api-grants:
        condition: service_completed_successfully
    networks: [dev-health]

  # Go query-api: serves the Go-owned GraphQL operations the ops `api` dispatches
  # to. Same shape as dev-health-ops deploy/go-api/compose-query-api.yml: the
  # `query-api` verb of the dho image (docker/go-worker.Dockerfile, target dho;
  # the standalone docker/query-api.Dockerfile was retired, CHAOS-6434), built
  # from the checked-out ./ops tree (multi-arch: the build runs natively on
  # amd64 and arm64). Distroless runtime: no shell, so no container healthcheck;
  # scripts/e2e/compose.sh seed_go_api_routing proves reachability by reading
  # this service's /registry before it writes the routing rows.
  query-api:
    build:
      context: ./ops
      dockerfile: docker/go-worker.Dockerfile
      target: dho
    command: ["query-api"]
    restart: unless-stopped
    environment:
      QUERY_API_ADDR: ":8090"
      QUERY_API_INTERNAL_ADDR: ":8091"
      # Native ClickHouse port (9000), not the HTTP 8123 the Python services use.
      CLICKHOUSE_URI: clickhouse://${CLICKHOUSE_USER:-default}:${CLICKHOUSE_PASSWORD:-ch}@clickhouse:9000/${CLICKHOUSE_DB:-default}
      GO_API_REGISTRY_POSTGRES_URI: postgresql://${POSTGRES_USER:-devhealth}:${POSTGRES_PASSWORD:-devhealth}@pgbouncer:6432/${POSTGRES_DB:-devhealth}
      GO_API_EDGE_JWT_SECRET: ${JWT_SECRET_KEY:-ci-fixture-jwt-secret-key-0123456789abcdef}
      GO_API_ENVELOPE_JWKS_PATH: /secrets/envelope-jwks.json
      GO_API_ENVELOPE_ISSUER: ${GO_API_ENVELOPE_ISSUER:-dev-health-ops-edge}
      GO_API_ENVELOPE_AUDIENCE: ${GO_API_ENVELOPE_AUDIENCE:-query-api}
      # Each of the 32 Go-served REST routes is gated behind its own per-route
      # GO_API_*_ENABLED flag (cmd/query-api/*.go), default OFF -- without these,
      # query-api 404s every one of them regardless of ingress/router path routing.
      # Copied verbatim from full-chaos/dev-health-deploy's chart/values.prod.yaml
      # (the query-api Deployment env block), the same list the CHAOS-6326 fixture
      # router (scripts/e2e/fullstack-opencode.sh render_web_override) sends to
      # query-api. Keep both lists in lockstep by hand.
      GO_API_INVESTMENT_EXPLAIN_ENABLED: "true"
      GO_API_QUADRANT_ENABLED: "true"
      GO_API_FILTER_OPTIONS_ENABLED: "true"
      GO_API_DRILLDOWN_PRS_ENABLED: "true"
      GO_API_DRILLDOWN_ISSUES_ENABLED: "true"
      GO_API_META_ENABLED: "true"
      GO_API_EXPLAIN_ENABLED: "true"
      GO_API_PEOPLE_SEARCH_ENABLED: "true"
      GO_API_PEOPLE_SUMMARY_ENABLED: "true"
      GO_API_PEOPLE_METRIC_ENABLED: "true"
      GO_API_FLAME_ENABLED: "true"
      GO_API_PEOPLE_DRILLDOWN_PRS_ENABLED: "true"
      GO_API_PEOPLE_DRILLDOWN_ISSUES_ENABLED: "true"
      GO_API_FLAME_AGGREGATED_ENABLED: "true"
      GO_API_HEATMAP_ENABLED: "true"
      GO_API_SANKEY_ENABLED: "true"
      GO_API_INVESTMENT_ENABLED: "true"
      GO_API_INVESTMENT_FLOW_ENABLED: "true"
      GO_API_INVESTMENT_SUNBURST_ENABLED: "true"
      GO_API_HOME_ENABLED: "true"
      GO_API_OPPORTUNITIES_ENABLED: "true"
      GO_API_WORK_UNITS_ENABLED: "true"
      GO_API_WORK_UNIT_EXPLAIN_ENABLED: "true"
    volumes:
      - ${GO_API_ENVELOPE_JWKS_FILE:?set by scripts/e2e/compose.sh}:/secrets/envelope-jwks.json:ro
    depends_on:
      clickhouse:
        condition: service_healthy
      pgbouncer:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks: [dev-health]

  # Structural placeholder only. compose.sh's render_override() unconditionally sets
  # `traefik: { ports: [] }` (it is a no-op override on the shared local-dev router,
  # never a service this gate starts by name), which requires SOME valid image/build
  # to already exist in the base file for the merge to validate. Never started by
  # prepare_stack/bootstrap_ops, so the pinned image below is never pulled or run;
  # reusing this repo's own already-vetted nginx digest (see scripts/e2e/compose.sh
  # NGINX_IMAGE) avoids introducing a new, unrelated pin for a service with no
  # behavior to verify.
  traefik:
    image: nginx:1.27-alpine@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10
    networks: [dev-health]

  # Only started when the web agreement check is enabled (E2E_WEB=on): fullstack-opencode.sh's
  # render_web_override() adds `web-fullstack` as a depends_on for the Explorer's Sentry-compatible
  # error sink and overrides container_name/ports/restart here, but supplies no image -- this base
  # definition is what makes the merge valid. SECRET_KEY has no real secret behind it; this stack
  # is thrown away at the end of every run.
  bugsink:
    image: bugsink/bugsink@sha256:b697016950d8aa7d94020def15bc2727e8fc40148f079884ae4cdacf7ea1e9a3
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-devhealth}:${POSTGRES_PASSWORD:-devhealth}@postgres:5432/bugsink
      SECRET_KEY: ${BUGSINK_SECRET_KEY:-acr-fullstack-ci-only-not-a-secret}
      BASE_URL: http://localhost:8800
      PORT: "8000"
    depends_on:
      postgres:
        condition: service_healthy
    networks: [dev-health]

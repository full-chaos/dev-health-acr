        - name: acr-registry-pull
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: acr-grant-runtime-acl
          image: "registry.example/acr-api@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
          imagePullPolicy: IfNotPresent
          command: ["/usr/local/bin/acr-migrate", "grant-runtime-acl"]
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          envFrom:
            - configMapRef:
                name: acr-test-migrate-config
          env:
            - name: ACR_POSTGRES_MIGRATION_DSN
              valueFrom:
                secretKeyRef:
                  name: "acr-migration"
                  key: "ACR_POSTGRES_MIGRATION_DSN"
            # Read-only: acr-migrate grant-runtime-acl parses just the
            # embedded username out of this DSN (the runtime role it grants
            # to) and never dials it. Already a required Secret reference
            # (acr.validateCredentials) -- the SAME one the hosted runtime
            # workloads consume, so this adds no new credential surface.
            - name: ACR_POSTGRES_DSN
              valueFrom:
                secretKeyRef:
                  name: "acr-runtime"
                  key: "ACR_POSTGRES_DSN"
            # Which optional runtime features hold their table privileges: the
            # same settings the workloads read (templates/configmap.yaml).
            - name: ACR_ENABLE_EPISODE_WRITEBACK
              value: "false"
          resources:
            limits:
              cpu: "1"
              memory: 512Mi
            requests:
              cpu: 100m
              memory: 128Mi
          volumeMounts:

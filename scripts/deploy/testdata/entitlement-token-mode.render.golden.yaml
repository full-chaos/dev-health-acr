spec:
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: acr
      app.kubernetes.io/instance: acr-test
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: acr
        app.kubernetes.io/instance: acr-test
        app.kubernetes.io/component: api
      annotations:
    spec:
      serviceAccountName: "acr-test-api"
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: acr-registry-pull
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: acr
              app.kubernetes.io/instance: acr-test
              app.kubernetes.io/component: api
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: acr
              app.kubernetes.io/instance: acr-test
              app.kubernetes.io/component: api
      initContainers:
        - name: prepare-entitlement-token
          image: "docker.io/library/busybox@sha256:9532d8c39891ca2ecde4d30d7710e01fb739c87a8b9299685c63704296b16028"
          command: ["sh", "-c", 'umask 077 && cp /source/token /target/token && if [ -f /source-ca/ca.crt ]; then cp /source-ca/ca.crt /target-ca/ca.crt; fi']
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: entitlement-token-source
              mountPath: /source
              readOnly: true
            - name: entitlement-token
              mountPath: /target
            - name: entitlement-ca
              mountPath: /target-ca
      containers:
        - name: acr-api
          image: "registry.example/acr-api@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
          imagePullPolicy: IfNotPresent
          command: ["/usr/local/bin/acr-api", "serve"]
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          envFrom:
            - configMapRef:
                name: acr-test-config
          env:
            - name: ACR_POSTGRES_DSN
              valueFrom:
                secretKeyRef:
                  name: "acr-runtime"
                  key: "ACR_POSTGRES_DSN"
            - name: ACR_CLICKHOUSE_DSN
              valueFrom:
                secretKeyRef:
                  name: "acr-runtime"
                  key: "ACR_CLICKHOUSE_DSN"
            - name: ACR_EVIDENCE_ID_ACTIVE_KID
              valueFrom:
                secretKeyRef:
                  name: "acr-runtime"
                  key: "ACR_EVIDENCE_ID_ACTIVE_KID"
            - name: ACR_EVIDENCE_ID_KEYS
              valueFrom:
                secretKeyRef:
                  name: "acr-runtime"
                  key: "ACR_EVIDENCE_ID_KEYS"
            # CHAOS-3916: always rendered (never conditional) so an unset
            # deployment explicitly declares itself off, matching how
            # contextFabric.projector.projectionEnabled is always rendered
            # in projector-configmap.yaml. See values.yaml's own comment:
            # lifecycleEnabled MUST be set the same way on acr-projector
            # (templates/projector-deployment.yaml reads the SAME value).
            - name: ACR_CONTEXT_FABRIC_GRAPH_READS_ENABLED
              value: "false"
            - name: ACR_CONTEXT_FABRIC_GRAPH_LIFECYCLE_ENABLED
              value: "false"
            # CHAOS-12416: always rendered, so an unset deployment explicitly
            # declares itself off. See values.yaml's own comment.
            - name: ACR_CONTEXT_FABRIC_VOCABULARY_LABELS_ENABLED
              value: "false"
            # CHAOS-12521: always rendered, like the flag above. See values.yaml.
            - name: ACR_CONTEXT_FABRIC_INVESTMENT_TREEMAP_ENABLED
              value: "false"
            # CHAOS-12554: always rendered, like the flag above. See values.yaml.
            - name: ACR_CONTEXT_FABRIC_INVESTMENT_SUNBURST_ENABLED
              value: "false"
            # CHAOS-12690: always rendered, like the flag above. See values.yaml.
            - name: ACR_CONTEXT_FABRIC_INVESTMENT_REPOSITORY_FROM_OPS_ENABLED
              value: "false"
            # CHAOS-12690 I2: always rendered, like the flag above. See values.yaml.
            - name: ACR_CONTEXT_FABRIC_INVESTMENT_TEAM_FROM_OPS_ENABLED
              value: "false"
            # CHAOS-12582: always rendered, like the flag above. See values.yaml.
            - name: ACR_CONTEXT_FABRIC_INVESTMENT_SANKEY_ENABLED
              value: "false"
            # CHAOS-12513: always rendered, like the flag above. See values.yaml.
            - name: ACR_CONTEXT_FABRIC_COMPARISON_TABLE_ENABLED
              value: "false"
            # CHAOS-12626: always rendered, like the flag above. See values.yaml.
            - name: ACR_CONTEXT_FABRIC_LANDSCAPE_QUADRANT_ENABLED
              value: "false"
            # CHAOS-13002: always rendered, like the flag above. See values.yaml.
            - name: ACR_CONTEXT_FABRIC_READ_FALLBACK_ENABLED
              value: "false"
            # CHAOS-12472: always rendered, like the flag above. Ask Dev's Stop
            # needs it; see values.yaml's own comment.
            - name: ACR_CONTEXT_FABRIC_RUN_LEASE_ENABLED
              value: "false"
            - name: ACR_DEV_HEALTH_ENTITLEMENT_CREDENTIAL
              value: workload
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            failureThreshold: 30
          lifecycle:
            preStop:
              sleep:
                seconds: 10
          resources:
            limits:
              cpu: "1"
              memory: 512Mi
            requests:
              cpu: 25m
              memory: 128Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: entitlement-token
              mountPath: "/var/run/acr/entitlement"
              readOnly: true
            - name: auth-workload-subject
              mountPath: "/var/run/secrets/dev-health/auth-workload"
              readOnly: true
      # deployment.extraContainers is intentionally never rendered; the
      volumes:
        - name: tmp
          emptyDir: {}
        - name: entitlement-token
          emptyDir:
            medium: Memory
        - name: entitlement-token-source
          secret:
            secretName: "acr-entitlement-token"
            items:
              - key: "token"
                path: "token"
        - name: entitlement-ca
          emptyDir:
            medium: Memory
        # CHAOS-11195: the subject token of acr-api's workload-token exchange client. Audience and lifetime are
        # fixed: auth-service reviews every subject against the one audience dev-health-workload-exchange, and 600 s
        # is the Kubernetes minimum. 0400 (defaultMode 256); kubelet adds group read for the pod's fsGroup. The
        # client reads the file again for every exchange, so the mount has no subPath (it would never rotate).
        - name: auth-workload-subject
          projected:
            defaultMode: 256
            sources:
              - serviceAccountToken:
                  path: token
                  audience: "dev-health-workload-exchange"
                  expirationSeconds: 600


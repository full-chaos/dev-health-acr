kind: Deployment
metadata:
  name: acr-test
  namespace: acr-test
  labels:
    helm.sh/chart: acr-0.2.0
    app.kubernetes.io/name: acr
    app.kubernetes.io/instance: acr-test
    app.kubernetes.io/component: api
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm

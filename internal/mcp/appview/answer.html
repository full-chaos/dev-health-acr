<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dev Health answer</title>
<style>
/* Tokens: ask-dev src/app/tokens.css (web "infinity" palette), by name and value. */
:root{color-scheme:light;
--background:#f1f3f4;--foreground:#15171a;--ink-muted:#585e65;--accent:#d6421f;--accent-text:#b1361a;--accent-wash:#ffe9da;--accent-ink:#b1361a;--accent-2:#03627d;--card:#fdfdfc;--card-stroke:#dde1e4;--surface:#fdfdfc;--border:#dde1e4;--text-primary:#15171a;--text-secondary:#4b535b;--text-muted:#585e65;--positive:#18664d;--caution:#7d4f00;--negative:#a61708;--info:#03627d;--positive-wash:#e1f2eb;--caution-wash:#fff0d0;--negative-wash:#fbe6e1;--info-wash:#dcf0f4;--chart-grid:#e4e7e9;--chart-text:#15171a;--chart-muted:#656c73;--chart-color-1:#0087a9;--chart-color-2:#c88600;--chart-color-3:#2525d0;--chart-color-4:#00a2b8;--chart-color-5:#f06a00;--chart-color-6:#075a72;--theme-feature:var(--chart-color-5);--theme-quality:var(--chart-color-4);--theme-risk:var(--chart-color-2);--theme-maintenance:var(--chart-color-3);--theme-operational:var(--chart-color-1);
--radius-sm:6px;--radius-md:10px;--radius-lg:16px;--radius-pill:999px;--elevation-card:0 18px 48px -34px rgb(15 23 42 / .25)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;
--background:#0e1316;--foreground:#f1f3f4;--ink-muted:#a7afb5;--accent:#f47b20;--accent-text:#ffab66;--accent-wash:#3a2110;--accent-ink:#ffab66;--accent-2:#4fd3df;--card:#161c20;--card-stroke:#28323a;--surface:#161c20;--border:#28323a;--text-primary:#f1f3f4;--text-secondary:#a7afb5;--text-muted:#8b959c;--positive:#63cfa6;--caution:#f2b84b;--negative:#ff8266;--info:#4fd3df;--positive-wash:#13322a;--caution-wash:#33290f;--negative-wash:#3b1b15;--info-wash:#11333c;--chart-grid:#232c32;--chart-text:#f1f3f4;--chart-muted:#a7afb5;--chart-color-1:#0b8fb0;--chart-color-2:#c98500;--chart-color-3:#da2100;--chart-color-4:#02a2bc;--chart-color-5:#e8650a;--chart-color-6:#4fd3df;--theme-feature:#a64807;--theme-quality:#016e7f;--theme-risk:#885a00;--theme-maintenance:#cc1f00;--theme-operational:#086d86;
--elevation-card:0 18px 48px -30px rgb(0 0 0 / .6)}}
:root[data-theme="dark"]{color-scheme:dark;
--background:#0e1316;--foreground:#f1f3f4;--ink-muted:#a7afb5;--accent:#f47b20;--accent-text:#ffab66;--accent-wash:#3a2110;--accent-ink:#ffab66;--accent-2:#4fd3df;--card:#161c20;--card-stroke:#28323a;--surface:#161c20;--border:#28323a;--text-primary:#f1f3f4;--text-secondary:#a7afb5;--text-muted:#8b959c;--positive:#63cfa6;--caution:#f2b84b;--negative:#ff8266;--info:#4fd3df;--positive-wash:#13322a;--caution-wash:#33290f;--negative-wash:#3b1b15;--info-wash:#11333c;--chart-grid:#232c32;--chart-text:#f1f3f4;--chart-muted:#a7afb5;--chart-color-1:#0b8fb0;--chart-color-2:#c98500;--chart-color-3:#da2100;--chart-color-4:#02a2bc;--chart-color-5:#e8650a;--chart-color-6:#4fd3df;--theme-feature:#a64807;--theme-quality:#016e7f;--theme-risk:#885a00;--theme-maintenance:#cc1f00;--theme-operational:#086d86;
--elevation-card:0 18px 48px -30px rgb(0 0 0 / .6)}

html,body{margin:0;background:var(--background)}
body{padding:16px}
/* Rules below follow ask-dev src/app/ask-dev.css (.ask-dev scope), same names where a class exists there. */
.ask-dev{--surface-1:var(--card);--surface-2:color-mix(in srgb,var(--foreground) 4%,var(--card));--text-strong:var(--text-primary);--text:color-mix(in srgb,var(--text-primary) 82%,var(--text-secondary));--border-strong:color-mix(in srgb,var(--border) 86%,var(--foreground));--focus-ring:var(--accent-2);--state-ok:var(--positive);--state-warn:var(--caution);--state-bad:var(--negative);--gap:16px;
--font-sans-stack:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;--font-mono-stack:ui-monospace,SFMono-Regular,Menlo,monospace;
box-sizing:border-box;max-width:900px;margin:0 auto;color:var(--text);font-family:var(--font-sans-stack);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
.ask-dev *{box-sizing:border-box}
.ask-dev button:focus-visible,.ask-dev summary:focus-visible,.ask-dev [role=tab]:focus-visible{outline:2px solid var(--focus-ring);outline-offset:2px}
.ask-dev code{font-family:var(--font-mono-stack)}
.answer{display:flex;flex-direction:column}
.answer__top{display:flex;flex-wrap:wrap;align-items:center;gap:8px;justify-content:space-between}
.answer__q{margin:0;color:var(--text-muted);font-size:13px}
.panel{min-width:0;max-width:100%;margin-top:var(--gap);padding:20px 22px;border:1px solid var(--border);border-radius:var(--radius-lg);background:var(--surface-1)}
.panel--card{box-shadow:var(--elevation-card)}
.panel--compact{padding:14px 18px}
.panel__title{display:inline-flex;align-items:center;margin:0 0 14px;padding:4px 8px;border-radius:var(--radius-sm);background:var(--surface-2);color:var(--text-secondary);font-size:11px;font-weight:600;line-height:16px;letter-spacing:.1em;text-transform:uppercase}
.panel__empty{margin:0;color:var(--text-muted);font-size:13px}
.answer__judgment{margin:0 0 10px;color:var(--text-strong);font-size:22px;font-weight:650;line-height:1.3;letter-spacing:-.015em}
.answer__body{margin:0 0 12px}
.stack{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px}
.stack--tight{gap:6px}
.record{padding:12px 14px;border:1px solid var(--border);border-radius:12px;background:var(--surface-2)}
.record__head{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px}
.record__title{color:var(--text-strong);font-weight:600}
.record__meta{color:var(--text-muted);font-size:12px;margin:0}
.record__body{margin:6px 0 0}
.record--principal{background:var(--caution-wash);border-color:color-mix(in srgb,var(--caution) 22%,var(--caution-wash))}
.badge{display:inline-block;padding:3px 8px;border:none;border-radius:var(--radius-pill);background:var(--surface-2);color:var(--text-secondary);font-size:12px;font-weight:600;line-height:1.35;white-space:nowrap}
.badge--ok{background:var(--positive-wash);color:var(--state-ok)}
.badge--warn{background:var(--caution-wash);color:var(--state-warn)}
.badge--bad{background:var(--negative-wash);color:var(--state-bad)}
.chip-row{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chip-row>.badge{max-width:100%;white-space:normal;overflow-wrap:anywhere}
.disclosure{margin-top:8px}
.disclosure>summary{color:var(--accent-2);font-size:13px;font-weight:600;cursor:pointer;list-style:none}
.disclosure>summary::-webkit-details-marker{display:none}
.disclosure>summary::before{content:"\25B8  "}
.disclosure[open]>summary::before{content:"\25BE  "}
.disclosure>summary:hover{color:var(--accent-ink)}
.disclosure[open]>summary{margin-bottom:8px}
.coverage{display:grid;gap:8px}
.coverage__source{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:baseline;padding:10px 12px;border:1px solid var(--border);border-radius:12px;background:var(--surface-2)}
.coverage__name{color:var(--text-strong);font-family:var(--font-mono-stack);font-size:13px;overflow-wrap:anywhere}
.coverage__reason{grid-column:1/-1;margin:0;color:var(--text-muted);font-size:12px}
.evidence-list{display:flex;flex-direction:column;gap:6px;padding:0;margin:0;list-style:none}
.evidence-row{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:6px 10px;border-radius:8px;background:var(--surface-2)}
.evidence-ref{flex:1 1 200px;color:var(--text);font-size:13px;overflow-wrap:anywhere}
.evidence-ref code{font-size:11px;color:var(--text-muted);margin-left:6px}
.btn{font:inherit;font-size:12px;font-weight:600;padding:4px 10px;border:none;border-radius:var(--radius-pill);background:var(--surface-2);color:var(--accent-2);cursor:pointer;box-shadow:inset 0 0 0 1px var(--border)}
.btn:hover{color:var(--accent-ink)}
.btn[disabled]{opacity:.55;cursor:default}
.tabs{display:flex;gap:6px;margin:0 0 12px;flex-wrap:wrap}
.tabs [role=tab]{font:inherit;font-size:12px;font-weight:600;padding:5px 12px;border:none;border-radius:var(--radius-pill);background:var(--surface-2);color:var(--text-secondary);cursor:pointer}
.tabs [role=tab][aria-selected=true]{background:var(--accent-wash);color:var(--accent-ink)}
.fact-table-wrap{min-width:0;max-width:100%;overflow-x:auto}
.fact-table{width:100%;min-width:max-content;border-collapse:collapse;font-size:13px}
.fact-table th,.fact-table td{padding:6px 10px;border-bottom:1px solid var(--border);text-align:left;white-space:nowrap}
.fact-table th{color:var(--text-muted);font-weight:600}
.fact-table td{color:var(--text);font-variant-numeric:tabular-nums}
.fact-table th button{font:inherit;color:inherit;background:none;border:none;padding:0;cursor:pointer;font-weight:600}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(140px,100%),1fr));gap:12px;margin:12px 0}
.tile{min-width:0;display:flex;flex-direction:column-reverse;justify-content:flex-end;gap:6px;padding:14px 16px;border:1px solid var(--border);border-radius:12px;background:var(--surface-1)}
.tile__value{color:var(--text-strong);font-size:24px;font-weight:650;line-height:1.15;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.tile__label{color:var(--text-muted);font-size:12px;font-weight:500}
.render-shape{min-width:0;max-width:100%;margin:0 0 12px}
.render-shape__title{margin:0 0 2px;color:var(--text-muted);font-size:12px}
.fact-chart__svg{display:block;max-width:none;overflow:visible}
.fact-chart__gridline{stroke:var(--border);stroke-width:1}
.fact-chart__axis-label{fill:var(--text-muted);font-size:10px}
.chart-label{font-family:var(--font-sans-stack);pointer-events:none}
.fact-chart__value-label{fill:var(--text-strong);font-size:10px;font-weight:600}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.render-shape+.render-shape{margin-top:22px}
.chart-note{margin:0 0 12px;color:var(--text-muted);font-size:12px}
.notice{margin-top:var(--gap);padding:10px 14px;border-radius:12px;background:var(--caution-wash);color:var(--state-warn);font-size:13px;font-weight:600}
.notice a{color:inherit;text-decoration:underline;cursor:pointer}
.foot{margin-top:var(--gap);display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;color:var(--text-muted);font-size:12px}
.foot code{color:var(--text)}
.toast{position:fixed;left:50%;bottom:52px;transform:translateX(-50%);padding:8px 14px;border-radius:10px;background:var(--text-primary);color:var(--background);font:12px/1.3 system-ui,sans-serif;display:none;max-width:90vw}
@media (max-width:520px){body{padding:10px}.panel{padding:16px}.answer__judgment{font-size:19px}}
</style>
</head>
<body>
<div class="ask-dev" id="root" aria-live="polite"></div>
<div class="toast" id="toast" role="status"></div>
<script>
(function(){
"use strict";
/* Every model or source string goes in through textContent or setAttribute only: no HTML parsing, no markdown, no link parsing.
   The view makes no network call and calls no server tool. It reads only the tool result the host sends. */
var root=document.getElementById("root");
var SVGNS="http://www.w3.org/2000/svg";
var S=null,L={},CW=480,curTab="facts",chartsHost=null,tabs=null,tabBody=null,views={};
var canMessage=false;

function h(tag,attrs,kids){var e=document.createElement(tag);
  if(attrs)for(var k in attrs){if(k==="class")e.className=attrs[k];else if(k==="text")e.textContent=attrs[k];else e.setAttribute(k,attrs[k]);}
  (kids||[]).forEach(function(c){if(c==null)return;e.appendChild(typeof c==="string"?document.createTextNode(c):c);});return e;}
function sv(tag,attrs,kids){var e=document.createElementNS(SVGNS,tag);
  if(attrs)for(var k in attrs){if(k==="text")e.textContent=attrs[k];else e.setAttribute(k,attrs[k]);}
  (kids||[]).forEach(function(c){e.appendChild(c);});return e;}
function arr(v){return Array.isArray(v)?v:[];}
function str(v){return v==null?"":String(v);}
function word(v,key,fallback){var w=L[v+":"+key];return w&&String(w).trim()?String(w):fallback;}
function human(t){return str(t).replace(/_/g," ").replace(/^./,function(c){return c.toUpperCase();});}
function toast(msg){var t=document.getElementById("toast");t.textContent=msg;t.style.display="block";clearTimeout(toast.id);toast.id=setTimeout(function(){t.style.display="none";},2200);}
function scalar(v){if(!v||typeof v!=="object")return "";if(v["null"])return "—";var k=Object.keys(v)[0];if(k===undefined)return "";return v[k]===true?"yes":v[k]===false?"no":str(v[k]);}
function tone(state){return state==="available"?"ok":(state==="unavailable"||state==="unauthorized"||state==="conflicted")?"bad":"warn";}
function statusTone(s){return s==="complete"?"ok":s==="no_match"?"":"warn";}
function panel(title,id,extra){var s=h("section",{class:"panel "+(extra||""),role:"group","aria-labelledby":id});s.appendChild(h("h2",{class:"panel__title",id:id,text:title}));return s;}
function copy(text){try{navigator.clipboard.writeText(text).then(function(){toast("Copied");},function(){toast("Copy is not available here");});}catch(e){toast("Copy is not available here");}}
function num(v){return typeof v==="number"&&isFinite(v);}

/* ---------- MCP Apps client (ext-apps specification 2026-01-26), postMessage JSON-RPC to the host ---------- */
var nextId=1,pending={};
function post(msg){msg.jsonrpc="2.0";window.parent.postMessage(msg,"*");}
function request(method,params){var id=nextId++;post({id:id,method:method,params:params});return new Promise(function(res,rej){pending[id]={res:res,rej:rej};});}
function notify(method,params){post({method:method,params:params||{}});}
var lastW=0,lastH=0;
function reportSize(){var w=Math.ceil(document.documentElement.scrollWidth),hh=Math.ceil(document.documentElement.scrollHeight);
  if(w===lastW&&hh===lastH)return;lastW=w;lastH=hh;notify("ui/notifications/size-changed",{width:w,height:hh});}
function applyHost(ctx){if(!ctx||typeof ctx!=="object")return;
  if(ctx.theme==="light"||ctx.theme==="dark")document.documentElement.setAttribute("data-theme",ctx.theme);
  if(S)renderCharts();}
window.addEventListener("message",function(ev){
  if(ev.source!==window.parent)return;
  var m=ev.data;if(!m||typeof m!=="object"||m.jsonrpc!=="2.0")return;
  if(m.id!=null&&!m.method){var p=pending[m.id];if(!p)return;delete pending[m.id];if(m.error)p.rej(m.error);else p.res(m.result);return;}
  switch(m.method){
    case "ui/notifications/tool-input":waiting(m.params&&m.params.arguments);break;
    case "ui/notifications/tool-result":showResult(m.params);break;
    case "ui/notifications/tool-cancelled":message("The question was cancelled. Nothing to show.");break;
    case "ui/notifications/host-context-changed":applyHost(m.params);break;
    case "ui/resource-teardown":case "ping":if(m.id!=null)post({id:m.id,result:{}});break;
    default:if(m.id!=null)post({id:m.id,error:{code:-32601,message:"Method not found"}});}
});
function ask(text){if(!canMessage){toast("This host cannot take a message from the view.");return;}
  request("ui/message",{role:"user",content:[{type:"text",text:text}]}).then(function(r){if(r&&r.isError)toast("The message was not sent.");},function(){toast("The message was not sent.");});}

/* ---------- states before the answer ---------- */
function message(text){root.textContent="";root.appendChild(h("div",{class:"answer"},[h("section",{class:"panel"},[h("p",{class:"panel__empty",text:text})])]));reportSize();}
function waiting(args){if(S)return;var q=args&&typeof args.question==="string"?args.question:"";
  root.textContent="";var p=h("section",{class:"panel"});
  if(q)p.appendChild(h("p",{class:"answer__q",text:q}));
  p.appendChild(h("p",{class:"panel__empty",text:"Investigating. The answer shows here when it is ready."}));
  root.appendChild(h("div",{class:"answer"},[p]));reportSize();}
function showResult(result){
  var sc=result&&result.structuredContent;
  var proj=sc&&typeof sc==="object"?(sc.structured&&typeof sc.structured==="object"?sc.structured:(sc.status?sc:null)):null;
  if(!proj||(result&&result.isError)){S=null;message("This answer cannot be shown here. The text answer is in the chat.");return;}
  S=proj;L=S.vocabulary_labels&&typeof S.vocabulary_labels==="object"?S.vocabulary_labels:{};
  try{render();}catch(e){S=null;message("This answer cannot be shown here. The text answer is in the chat.");}}

/* ---------- the answer ---------- */
function render(){
  root.textContent="";
  var a=h("div",{class:"answer"});
  a.appendChild(h("div",{class:"answer__top"},[
    h("span",{class:"badge badge--"+statusTone(S.status),text:word("answer_status",S.status,human(S.status))}),
    h("p",{class:"answer__q",text:str(S.question)})]));
  var p1=panel("Answer","t-answer");
  var lead=S.deterministic_answer||S.direct_judgment;
  if(lead)p1.appendChild(h("p",{class:"answer__judgment",text:str(lead)}));
  if(S.direct_judgment&&S.direct_judgment!==lead)p1.appendChild(h("p",{class:"answer__body",text:str(S.direct_judgment)}));
  if(S.current_state)p1.appendChild(h("details",{class:"disclosure"},[h("summary",{text:"More detail"}),h("p",{class:"answer__body",text:str(S.current_state)})]));
  if(!lead&&!S.current_state)p1.appendChild(h("p",{class:"panel__empty",text:"No judgment was given. Read the text answer in the chat."}));
  a.appendChild(p1);
  if(S.coverage_partial){
    var link=h("a",{text:"See coverage",href:"#coverage"});
    link.onclick=function(e){e.preventDefault();var c=document.getElementById("coverage");if(c)c.scrollIntoView({behavior:"smooth"});};
    a.appendChild(h("div",{class:"notice",role:"note"},[document.createTextNode("Coverage is partial: some sources are stale or missing. "),link]));}

  var drivers=arr(S.principal_drivers),pressures=arr(S.strongest_pressures);
  if(drivers.length||pressures.length){
    var pd=panel("Drivers","t-drivers","panel--card");
    if(pressures.length){
      pd.appendChild(h("p",{class:"record__meta",text:"Strongest pressures"}));
      pd.appendChild(h("ul",{class:"stack stack--tight",style:"margin-bottom:14px"},pressures.map(function(t){return h("li",{class:"record",text:str(t)});})));}
    pd.appendChild(h("ul",{class:"stack"},drivers.map(function(d){
      var li=h("li",{class:"record record--card"+(d.standing==="principal"?" record--principal":"")});
      li.appendChild(h("div",{class:"record__head"},[
        h("span",{class:"record__title",text:str(d.title)}),
        d.standing?h("span",{class:"badge",text:word("driver_standing",d.standing,human(d.standing))}):null,
        d.source_state?h("span",{class:"badge badge--warn",text:word("driver_source_state",d.source_state,human(d.source_state))}):null]));
      if(d.summary)li.appendChild(h("p",{class:"record__body",text:str(d.summary)}));
      if(d.source_state_note)li.appendChild(h("p",{class:"record__meta",text:str(d.source_state_note)}));
      var more=h("details",{class:"disclosure"},[h("summary",{text:"Details"})]);
      if(d.qualification)more.appendChild(h("p",{class:"record__meta",text:str(d.qualification)}));
      if(num(d.confidence))more.appendChild(h("p",{class:"record__meta",text:"Confidence "+Math.round(d.confidence*100)+" %"}));
      var aff=arr(d.affected_subjects);
      if(aff.length)more.appendChild(h("p",{class:"record__meta",text:"Affects: "+aff.map(function(x){return str(x&&(x.label||x.canonical_id));}).join(", ")}));
      li.appendChild(more);return li;})));
    a.appendChild(pd);}

  var facts=arr(S.key_facts),limits=arr(S.limitations).length+arr(S.warnings).length;
  if(facts.length||limits){
    var pf=panel("Key facts","t-facts");
    tabs=h("div",{class:"tabs",role:"tablist"});tabBody=h("div",{});
    views={facts:factsView,limits:limitsView};
    [["facts","Facts"],["limits","Limits ("+limits+")"]].forEach(function(t){
      var b=h("button",{role:"tab",type:"button",text:t[1]});b.dataset.k=t[0];b.onclick=function(){select(t[0]);};tabs.appendChild(b);});
    pf.appendChild(tabs);pf.appendChild(tabBody);a.appendChild(pf);}
  else{tabs=null;tabBody=null;}

  var shapes=arr(S.render_shapes);
  var charted=shapes.filter(function(sh){return !isPercentiles(sh);});
  chartsHost=null;
  if(charted.length){var pcs=panel("Charts","t-charts");chartsHost=h("div",{});pcs.appendChild(chartsHost);a.appendChild(pcs);}
  shapes.filter(isPercentiles).forEach(function(sh,i){
    var pp=panel(str(sh.title)||"Completion forecast percentiles","t-pct-"+i,"forecast-percentiles");pp.appendChild(dataTable(sh));a.appendChild(pp);});

  var cov=arr(S.coverage_summary);
  var pc=panel("Coverage","t-coverage","panel--card panel--compact");pc.id="coverage";
  var notFull=cov.filter(function(c){return c.state!=="available";}).length;
  pc.appendChild(h("p",{class:cov.length?"record__meta":"panel__empty",text:!cov.length?"No source rows were served.":S.coverage_partial?"Partial: "+notFull+" of "+cov.length+" sources are not fully served.":notFull?notFull+" of "+cov.length+" sources are not fully served.":"All "+cov.length+" sources served."}));
  if(cov.length){
    pc.appendChild(h("div",{class:"chip-row"},cov.map(function(c){return h("span",{class:"badge badge--"+tone(c.state),text:str(c.label||c.source)+": "+str(c.state_label||human(c.state))});})));

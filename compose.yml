name: dev-health-context-fabric

# Context Fabric is a platform Compose application, not a copied Ops stack.
# Docker Compose 2.20.3+ resolves each included model relative to its declared
# project directory, then the root compose.override.yml applies the local
# TLS/bootstrap integration across the combined graph.
include:
  - path: ${DEV_HEALTH_OPS_COMPOSE:-../dev-health-ops/compose.yml}
    project_directory: ${DEV_HEALTH_OPS_DIR:-../dev-health-ops}
  - path: deploy/compose/acr.compose.yml
    project_directory: .
  - path: ${DEV_HEALTH_WEB_COMPOSE:-../dev-health-web/deploy/compose/web.compose.yml}
    project_directory: ${DEV_HEALTH_WEB_DIR:-../dev-health-web}

networks:
  dev-health:
    name: ${DEV_HEALTH_NETWORK_NAME:-dev-health-context-fabric}

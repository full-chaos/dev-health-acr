apiVersion: apps/v1
kind: Deployment
metadata:
  name: acr-api
  labels:
    app.kubernetes.io/name: acr
    app.kubernetes.io/component: api
spec:
  replicas: 2
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: acr
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: acr
        app.kubernetes.io/component: api
      annotations:
        acr.fullchaos.dev/credentials-revision: required
    spec:
      serviceAccountName: acr-api
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: acr-registry-pull
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: acr
              app.kubernetes.io/component: api
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: acr
              app.kubernetes.io/component: api
      containers:
        - name: acr-api
          image: acr-api
          imagePullPolicy: IfNotPresent
          command: ["/usr/local/bin/acr-api", "serve"]
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          envFrom:
            - configMapRef:
                name: acr-config
          env:
            - name: ACR_POSTGRES_DSN
              valueFrom:
                secretKeyRef:
                  name: acr-runtime-credentials
                  key: ACR_POSTGRES_DSN
            - name: ACR_CLICKHOUSE_DSN
              valueFrom:
                secretKeyRef:
                  name: acr-runtime-credentials
                  key: ACR_CLICKHOUSE_DSN
            - name: ACR_EVIDENCE_ID_ACTIVE_KID
              valueFrom:
                secretKeyRef:
                  name: acr-runtime-credentials
                  key: ACR_EVIDENCE_ID_ACTIVE_KID
            - name: ACR_EVIDENCE_ID_KEYS
              valueFrom:
                secretKeyRef:
                  name: acr-runtime-credentials
                  key: ACR_EVIDENCE_ID_KEYS
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            failureThreshold: 30
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: entitlement-token
              mountPath: /var/run/acr/entitlement
              readOnly: true
      volumes:
        - name: tmp
          emptyDir: {}
        - name: entitlement-token
          secret:
            secretName: acr-entitlement-token
            items:
              - key: token
                path: token

apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: acr-mcp
  labels:
    app.kubernetes.io/name: acr
    app.kubernetes.io/component: mcp
spec:
  parentRefs:
    - name: development-internal
      namespace: gateway-system
      sectionName: https
  hostnames:
    - mcp.development.internal
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /mcp
      backendRefs:
        - name: acr-mcp
          port: 8081

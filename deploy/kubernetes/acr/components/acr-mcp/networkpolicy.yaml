apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: acr-mcp
  labels:
    app.kubernetes.io/name: acr
    app.kubernetes.io/component: mcp
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: acr
      app.kubernetes.io/component: mcp
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: gateway-system
      ports:
        - protocol: TCP
          port: 8081
  egress:
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: acr
              app.kubernetes.io/component: api
      ports:
        - protocol: TCP
          port: 8080

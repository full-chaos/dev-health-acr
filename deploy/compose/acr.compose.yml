services:
  acr-db-init:
    image: postgres:18-alpine@sha256:9a8afca54e7861fd90fab5fdf4c42477a6b1cb7d293595148e674e0a3181de15
    restart: "no"
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD_FILE: /run/secrets/acr_postgres_password
      ACR_DB_NAME: ${ACR_DB_NAME:-acr}
      ACR_RUNTIME_DB_USER: ${ACR_RUNTIME_DB_USER:?ACR_RUNTIME_DB_USER is required}
      ACR_RUNTIME_DB_PASSWORD_FILE: /run/secrets/acr_runtime_db_password
      ACR_MIGRATION_DB_USER: ${ACR_MIGRATION_DB_USER:?ACR_MIGRATION_DB_USER is required}
      ACR_MIGRATION_DB_PASSWORD_FILE: /run/secrets/acr_migration_db_password
    secrets: [acr_postgres_password, acr_runtime_db_password, acr_migration_db_password]
    volumes:
      - ./deploy/compose/acr-db-init.sh:/usr/local/bin/acr-db-init:ro
    entrypoint: ["/usr/local/bin/acr-db-init"]
    command: ["roles"]
    depends_on:
      postgres:
        condition: service_healthy
    networks: [dev-health]
  acr-migrate:
    image: ${ACR_IMAGE:?ACR_IMAGE must be an immutable image digest}
    restart: "no"
    entrypoint: ["/usr/local/bin/acr-migrate"]
    command: ["up"]
    environment:
      ACR_ENVIRONMENT: development
      ACR_POSTGRES_CONNECTION_KIND: direct
      ACR_POSTGRES_MIGRATION_DSN_FILE: /run/secrets/acr_migration_dsn
    secrets: [acr_migration_dsn]
    depends_on:
      postgres: { condition: service_healthy }
      acr-db-init: { condition: service_completed_successfully }
    networks: [dev-health]
  acr-db-acl:
    image: postgres:18-alpine@sha256:9a8afca54e7861fd90fab5fdf4c42477a6b1cb7d293595148e674e0a3181de15
    restart: "no"
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD_FILE: /run/secrets/acr_postgres_password
      ACR_DB_NAME: ${ACR_DB_NAME:-acr}
      ACR_RUNTIME_DB_USER: ${ACR_RUNTIME_DB_USER:?ACR_RUNTIME_DB_USER is required}
      ACR_RUNTIME_DB_PASSWORD_FILE: /run/secrets/acr_runtime_db_password
      ACR_MIGRATION_DB_USER: ${ACR_MIGRATION_DB_USER:?ACR_MIGRATION_DB_USER is required}
      ACR_MIGRATION_DB_PASSWORD_FILE: /run/secrets/acr_migration_db_password
      ACR_ENABLE_EPISODE_WRITEBACK: ${ACR_ENABLE_EPISODE_WRITEBACK:-false}
    secrets: [acr_postgres_password, acr_runtime_db_password, acr_migration_db_password]
    volumes:
      - ./deploy/compose/acr-db-init.sh:/usr/local/bin/acr-db-init:ro
    entrypoint: ["/usr/local/bin/acr-db-init"]
    command: ["runtime-acl"]
    depends_on:
      postgres: { condition: service_healthy }
      acr-migrate: { condition: service_completed_successfully }
    networks: [dev-health]
  acr-api:
    image: ${ACR_IMAGE:?ACR_IMAGE must be an immutable image digest}
    command: ["serve"]
    environment:
      ACR_ADDR: :8080
      ACR_ENVIRONMENT: development
      ACR_REQUIRE_BACKING_STORES: "true"
      ACR_POSTGRES_CONNECTION_KIND: direct
      ACR_ENABLE_EPISODE_WRITEBACK: ${ACR_ENABLE_EPISODE_WRITEBACK:-false}
      ACR_DEVICE_VERIFICATION_URL: ${ACR_DEVICE_VERIFICATION_URL:-http://localhost:3000/acr/device}
      ACR_POSTGRES_DSN_FILE: /run/secrets/acr_runtime_dsn
      ACR_CLICKHOUSE_DSN_FILE: /run/secrets/acr_clickhouse_dsn
      ACR_EVIDENCE_ID_ACTIVE_KID_FILE: /run/secrets/acr_evidence_active_kid
      ACR_EVIDENCE_ID_KEYS_FILE: /run/secrets/acr_evidence_keys
    secrets: [acr_runtime_dsn, acr_clickhouse_dsn, acr_evidence_active_kid, acr_evidence_keys]
    depends_on:
      postgres: { condition: service_healthy }
      clickhouse: { condition: service_healthy }
      acr-db-acl: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/readyz"]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 30s
    labels:
      traefik.enable: "true"
      traefik.scope: dev-health
      traefik.http.routers.acr.rule: Host(`acr.localhost`)
      traefik.http.routers.acr.entrypoints: web
      traefik.http.services.acr.loadbalancer.server.port: "8080"
    networks: [dev-health]
  # acr-projector runs the Context Fabric projection worker (CHAOS-3753)
  # directly from the shared ACR image, entrypoint overridden exactly like
  # acr-migrate above -- independent lifecycle/deployment control from
  # acr-api, not a separate build. Disabled (ACR_CONTEXT_FABRIC_PROJECTION_ENABLED=false)
  # by default: there is no self-hostable Zep/Graphiti backend and no Zep
  # Cloud credential in local development (ADR 0007), so this service comes
  # up healthy-and-idle rather than crash-looping over a dependency nothing
  # here can supply. Set ACR_CONTEXT_FABRIC_PROJECTION_ENABLED=true and the
  # ACR_CONTEXT_FABRIC_ZEP_* / ACR_CONTEXT_FABRIC_PROJECTOR_ORG_IDS
  # variables once a Zep Cloud credential exists to enable it.
  acr-projector:
    image: ${ACR_IMAGE:?ACR_IMAGE must be an immutable image digest}
    entrypoint: ["/usr/local/bin/acr-projector"]
    command: ["serve"]
    environment:
      ACR_PROJECTOR_ADDR: :8090
      ACR_ENVIRONMENT: development
      ACR_REQUIRE_BACKING_STORES: "true"
      ACR_POSTGRES_CONNECTION_KIND: direct
      ACR_CONTEXT_FABRIC_PROJECTION_ENABLED: ${ACR_CONTEXT_FABRIC_PROJECTION_ENABLED:-false}
      ACR_CONTEXT_FABRIC_PROJECTOR_ORG_IDS: ${ACR_CONTEXT_FABRIC_PROJECTOR_ORG_IDS:-}
      ACR_CONTEXT_FABRIC_PROJECT_TEAMS_PROJECTS_ENABLED: ${ACR_CONTEXT_FABRIC_PROJECT_TEAMS_PROJECTS_ENABLED:-false}
      ACR_POSTGRES_DSN_FILE: /run/secrets/acr_runtime_dsn
      ACR_CLICKHOUSE_DSN_FILE: /run/secrets/acr_clickhouse_dsn
    secrets: [acr_runtime_dsn, acr_clickhouse_dsn]
    depends_on:
      postgres: { condition: service_healthy }
      clickhouse: { condition: service_healthy }
      acr-db-acl: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8090/readyz"]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks: [dev-health]
secrets:
  acr_postgres_password: { file: "${ACR_POSTGRES_ADMIN_PASSWORD_FILE:?ACR_POSTGRES_ADMIN_PASSWORD_FILE is required}" }
  acr_runtime_db_password: { file: "${ACR_RUNTIME_DB_PASSWORD_FILE:?ACR_RUNTIME_DB_PASSWORD_FILE is required}" }
  acr_migration_db_password: { file: "${ACR_MIGRATION_DB_PASSWORD_FILE:?ACR_MIGRATION_DB_PASSWORD_FILE is required}" }
  acr_runtime_dsn: { file: "${ACR_RUNTIME_DSN_FILE:?ACR_RUNTIME_DSN_FILE is required}" }
  acr_migration_dsn: { file: "${ACR_MIGRATION_DSN_FILE:?ACR_MIGRATION_DSN_FILE is required}" }
  acr_clickhouse_dsn: { file: "${ACR_CLICKHOUSE_DSN_FILE:?ACR_CLICKHOUSE_DSN_FILE is required}" }
  acr_evidence_active_kid: { file: "${ACR_EVIDENCE_ACTIVE_KID_FILE:?ACR_EVIDENCE_ACTIVE_KID_FILE is required}" }
  acr_evidence_keys: { file: "${ACR_EVIDENCE_KEYS_FILE:?ACR_EVIDENCE_KEYS_FILE is required}" }

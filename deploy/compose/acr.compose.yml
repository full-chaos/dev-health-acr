services:
  acr-db-init:
    image: postgres:18-alpine@sha256:9a8afca54e7861fd90fab5fdf4c42477a6b1cb7d293595148e674e0a3181de15
    restart: "no"
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD_FILE: /run/secrets/acr_postgres_password
      ACR_DB_NAME: ${ACR_DB_NAME:-acr}
      ACR_RUNTIME_DB_USER: ${ACR_RUNTIME_DB_USER:?ACR_RUNTIME_DB_USER is required}
      ACR_RUNTIME_DB_PASSWORD_FILE: /run/secrets/acr_runtime_db_password
      ACR_MIGRATION_DB_USER: ${ACR_MIGRATION_DB_USER:?ACR_MIGRATION_DB_USER is required}
      ACR_MIGRATION_DB_PASSWORD_FILE: /run/secrets/acr_migration_db_password
    secrets: [acr_postgres_password, acr_runtime_db_password, acr_migration_db_password]
    volumes:
      - ./deploy/compose/acr-db-init.sh:/usr/local/bin/acr-db-init:ro
    entrypoint: ["/usr/local/bin/acr-db-init"]
    command: ["roles"]
    depends_on:
      postgres:
        condition: service_healthy
    networks: [dev-health]
  acr-migrate:
    image: ${ACR_IMAGE:?ACR_IMAGE must be an immutable image digest}
    restart: "no"
    entrypoint: ["/usr/local/bin/acr-migrate"]
    command: ["up"]
    environment:
      ACR_ENVIRONMENT: development
      ACR_POSTGRES_CONNECTION_KIND: direct
      ACR_POSTGRES_MIGRATION_DSN_FILE: /run/secrets/acr_migration_dsn
    secrets: [acr_migration_dsn]
    depends_on:
      postgres: { condition: service_healthy }
      acr-db-init: { condition: service_completed_successfully }
    networks: [dev-health]
  acr-db-acl:
    image: postgres:18-alpine@sha256:9a8afca54e7861fd90fab5fdf4c42477a6b1cb7d293595148e674e0a3181de15
    restart: "no"
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD_FILE: /run/secrets/acr_postgres_password
      ACR_DB_NAME: ${ACR_DB_NAME:-acr}
      ACR_RUNTIME_DB_USER: ${ACR_RUNTIME_DB_USER:?ACR_RUNTIME_DB_USER is required}
      ACR_RUNTIME_DB_PASSWORD_FILE: /run/secrets/acr_runtime_db_password
      ACR_MIGRATION_DB_USER: ${ACR_MIGRATION_DB_USER:?ACR_MIGRATION_DB_USER is required}
      ACR_MIGRATION_DB_PASSWORD_FILE: /run/secrets/acr_migration_db_password
      ACR_ENABLE_EPISODE_WRITEBACK: ${ACR_ENABLE_EPISODE_WRITEBACK:-false}
    secrets: [acr_postgres_password, acr_runtime_db_password, acr_migration_db_password]
    volumes:
      - ./deploy/compose/acr-db-init.sh:/usr/local/bin/acr-db-init:ro
    entrypoint: ["/usr/local/bin/acr-db-init"]
    command: ["runtime-acl"]
    depends_on:
      postgres: { condition: service_healthy }
      acr-migrate: { condition: service_completed_successfully }
    networks: [dev-health]
  acr-api:
    image: ${ACR_IMAGE:?ACR_IMAGE must be an immutable image digest}
    command: ["serve"]
    environment:
      ACR_ADDR: :8080
      ACR_ENVIRONMENT: development
      ACR_REQUIRE_BACKING_STORES: "true"
      ACR_POSTGRES_CONNECTION_KIND: direct
      ACR_ENABLE_EPISODE_WRITEBACK: ${ACR_ENABLE_EPISODE_WRITEBACK:-false}
      ACR_DEVICE_VERIFICATION_URL: ${ACR_DEVICE_VERIFICATION_URL:-http://localhost:3000/acr/device}
      ACR_POSTGRES_DSN_FILE: /run/secrets/acr_runtime_dsn
      ACR_CLICKHOUSE_DSN_FILE: /run/secrets/acr_clickhouse_dsn
      ACR_EVIDENCE_ID_ACTIVE_KID_FILE: /run/secrets/acr_evidence_active_kid
      ACR_EVIDENCE_ID_KEYS_FILE: /run/secrets/acr_evidence_keys
    secrets: [acr_runtime_dsn, acr_clickhouse_dsn, acr_evidence_active_kid, acr_evidence_keys]
    depends_on:
      postgres: { condition: service_healthy }
      clickhouse: { condition: service_healthy }
      acr-db-acl: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/readyz"]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 30s
    labels:
      traefik.enable: "true"
      traefik.scope: dev-health
      traefik.http.routers.acr.rule: Host(`acr.localhost`)
      traefik.http.routers.acr.entrypoints: web
      traefik.http.services.acr.loadbalancer.server.port: "8080"
    networks: [dev-health]
  # acr-projector runs the Context Fabric projection worker (CHAOS-3753)
  # directly from the shared ACR image, entrypoint overridden exactly like
  # acr-migrate above -- independent lifecycle/deployment control from
  # acr-api, not a separate build. Disabled (ACR_CONTEXT_FABRIC_PROJECTION_ENABLED=false)
  # by default: the `falkordb` service below is itself profile-gated
  # (`context-fabric-graph`), disabled unless an operator opts in, so this
  # service comes up healthy-and-idle rather than depending hard on a graph
  # backend that may not be running -- see the FalkorDB env block below for
  # what to set to enable it.
  acr-projector:
    image: ${ACR_IMAGE:?ACR_IMAGE must be an immutable image digest}
    entrypoint: ["/usr/local/bin/acr-projector"]
    command: ["serve"]
    environment:
      ACR_PROJECTOR_ADDR: :8090
      ACR_ENVIRONMENT: development
      ACR_REQUIRE_BACKING_STORES: "true"
      ACR_POSTGRES_CONNECTION_KIND: direct
      ACR_CONTEXT_FABRIC_PROJECTION_ENABLED: ${ACR_CONTEXT_FABRIC_PROJECTION_ENABLED:-false}
      ACR_CONTEXT_FABRIC_PROJECTOR_ORG_IDS: ${ACR_CONTEXT_FABRIC_PROJECTOR_ORG_IDS:-}
      ACR_CONTEXT_FABRIC_PROJECT_TEAMS_PROJECTS_ENABLED: ${ACR_CONTEXT_FABRIC_PROJECT_TEAMS_PROJECTS_ENABLED:-false}
      # FalkorDB graph backend (ADR 0009): self-hosted, no external
      # credential required, so there is no secret to leave unprovisioned
      # here. Still left unset/disabled by default: the `falkordb` service
      # below is itself gated behind the `context-fabric-graph` profile,
      # disabled unless an operator opts in, so acr-projector comes up
      # healthy-and-idle (falkorgraph.Configured's own "unset dependency
      # fails open, not closed" behavior) rather than depending hard on a
      # profile-gated service that may not be running.
      ACR_CONTEXT_FABRIC_FALKOR_ADDR: ${ACR_CONTEXT_FABRIC_FALKOR_ADDR:-}
      ACR_CONTEXT_FABRIC_FALKOR_PASSWORD_FILE: ${ACR_CONTEXT_FABRIC_FALKOR_PASSWORD_FILE:-}
      ACR_CONTEXT_FABRIC_FALKOR_TLS: ${ACR_CONTEXT_FABRIC_FALKOR_TLS:-false}
      ACR_CONTEXT_FABRIC_FALKOR_ALLOW_INSECURE: ${ACR_CONTEXT_FABRIC_FALKOR_ALLOW_INSECURE:-true}
      ACR_POSTGRES_DSN_FILE: /run/secrets/acr_runtime_dsn
      ACR_CLICKHOUSE_DSN_FILE: /run/secrets/acr_clickhouse_dsn
    secrets: [acr_runtime_dsn, acr_clickhouse_dsn]
    depends_on:
      postgres: { condition: service_healthy }
      clickhouse: { condition: service_healthy }
      acr-db-acl: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8090/readyz"]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks: [dev-health]
  # falkordb is the Context Fabric graph backend (ADR 0009). Self-hosted,
  # no external credential required. Disabled by default (profile-gated): local dev
  # and CI do not pay for a graph database they have not opted into. Enable
  # with `docker compose --profile context-fabric-graph up`, and set
  # ACR_CONTEXT_FABRIC_FALKOR_ADDR=falkordb:6379 (plus
  # ACR_CONTEXT_FABRIC_PROJECTION_ENABLED=true) to wire acr-projector to it.
  # Image pinned by digest to the exact version this backend was developed
  # and verified against (FalkorDB 4.20.2, module ver 42002, Redis 8.6.3) --
  # see docs/design/context-fabric-falkordb-adapter.md §1.1 and
  # internal/contextfabric/falkorgraph's live integration test, which pins
  # the same digest.
  falkordb:
    image: falkordb/falkordb@sha256:ad09d5051bbda1cfee8cef9d7f41ffe1bcb1c5327b82c442c989e84ab8cc33d3
    profiles: ["context-fabric-graph"]
    # A real GRAPH.QUERY, not PING: proves the graph module is loaded and
    # actually executing Cypher, not just that Redis itself is up (verified
    # necessary -- PING succeeding is not sufficient, see the design doc).
    healthcheck:
      test: ["CMD", "redis-cli", "GRAPH.QUERY", "_acr_health", "RETURN 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    volumes:
      - acr_falkordb_data:/data
    networks: [dev-health]
volumes:
  acr_falkordb_data:
secrets:
  acr_postgres_password: { file: "${ACR_POSTGRES_ADMIN_PASSWORD_FILE:?ACR_POSTGRES_ADMIN_PASSWORD_FILE is required}" }
  acr_runtime_db_password: { file: "${ACR_RUNTIME_DB_PASSWORD_FILE:?ACR_RUNTIME_DB_PASSWORD_FILE is required}" }
  acr_migration_db_password: { file: "${ACR_MIGRATION_DB_PASSWORD_FILE:?ACR_MIGRATION_DB_PASSWORD_FILE is required}" }
  acr_runtime_dsn: { file: "${ACR_RUNTIME_DSN_FILE:?ACR_RUNTIME_DSN_FILE is required}" }
  acr_migration_dsn: { file: "${ACR_MIGRATION_DSN_FILE:?ACR_MIGRATION_DSN_FILE is required}" }
  acr_clickhouse_dsn: { file: "${ACR_CLICKHOUSE_DSN_FILE:?ACR_CLICKHOUSE_DSN_FILE is required}" }
  acr_evidence_active_kid: { file: "${ACR_EVIDENCE_ACTIVE_KID_FILE:?ACR_EVIDENCE_ACTIVE_KID_FILE is required}" }
  acr_evidence_keys: { file: "${ACR_EVIDENCE_KEYS_FILE:?ACR_EVIDENCE_KEYS_FILE is required}" }

events {}
http {
  server {
    listen 8443 ssl;
    ssl_certificate /run/context-fabric/pki/server.crt;
    ssl_certificate_key /run/context-fabric/pki/server.key;
    location / {
      proxy_pass http://api:8000;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto https;
    }
  }
}

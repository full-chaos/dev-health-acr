# Example: enable the hosted acr-mcp on a kiac/k3s trial cluster (no Gateway
# controller, no CNI network-policy guarantees). Layer it AFTER the values that
# deploy acr-api itself:
#
#   helm upgrade --install <release> deploy/helm/acr -n <namespace> \
#     -f <acr-api values> -f deploy/helm/acr/values-acr-mcp-trial.example.yaml \
#     --set-string acrMcp.image.reference=ghcr.io/full-chaos/dev-health-acr/acr-mcp@sha256:<64 hex>
#
# acr-mcp holds no credential, so nothing here references a Secret. Clients
# reach it on the NodePort Kubernetes assigns to <fullname>-mcp (read it with
# `kubectl -n <namespace> get svc <fullname>-mcp`), path /mcp, sending their own
# ACR API bearer.
acrMcp:
  enabled: true
  image:
    # Supplied at deploy time: an @sha256 digest of the acr-mcp image (a local
    # tag is accepted only when config.environment is development or test).
    reference: ""
    pullPolicy: IfNotPresent
  replicaCount: 1
  service:
    type: NodePort
  # No Gateway on the trial cluster. Ingress from outside the namespace arrives
  # through the NodePort, which a default-deny policy would refuse.
  networkPolicy:
    enabled: false
  podDisruptionBudget:
    enabled: false

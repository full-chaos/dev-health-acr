# Default values for the private ACR Helm chart.
#
# Security contract (enforced by templates/_helpers.tpl and values.schema.json):
#   - image.reference MUST be an immutable @sha256 digest reference.
#   - Every credential is a reference to a pre-existing Secret; this chart never
#     creates a Secret or embeds a credential literal.
#   - The migration DSN reference MUST differ from the runtime DSN reference.
#   - acr-mcp runs only as its own workload (acrMcp below), from its own image,
#     holding no credential; it is never injected beside acr-api.

nameOverride: ""
fullnameOverride: ""

# Immutable application image. Supplied at deploy time as a fully qualified
# digest reference in production, e.g.
# ghcr.io/full-chaos/dev-health-acr/acr-api@sha256:<64 hex>.
# A bare/mutable tag (for example :latest) is rejected before rendering outside
# development and test, where a kind-loaded image has no registry digest.
image:
  reference: ""
  pullPolicy: IfNotPresent

security:
  tokenCopyImage: "docker.io/library/busybox@sha256:9532d8c39891ca2ecde4d30d7710e01fb739c87a8b9299685c63704296b16028"

# References to pre-existing image pull Secrets. Each entry is {name: <secret>}.
imagePullSecrets: []

serviceAccount:
  create: true
  name: ""
  annotations: {}
  automountServiceAccountToken: false

# Non-secret process configuration rendered into a ConfigMap and consumed by
# both the acr-api Deployment and the acr-migrate Job.
config:
  environment: production
  logLevel: info
  # Listen address is fixed to :8080 in the ConfigMap (matches containerPort);
  # it is intentionally NOT an operator knob and is rejected under config.
  # (no addr key here)
  requestTimeout: "15s"
  # Internal ops query service base URL (ACR_DATA_QUERY_URL); empty = feature
  # off. Per-call deadline (ACR_DATA_QUERY_TIMEOUT) must be within 1s..55s.
  dataQueryUrl: ""
  dataQueryTimeout: ""
  # GWC's MCP listener base URL for graphql_query (ACR_DATA_GRAPHQL_URL,
  # CHAOS-7075/7085: its own port, POST <url>/query; prod Service
  # http://dev-health-ops-query-api-mcp.dev-health.svc:8092). Empty = the
  # tool is off. Shares dataQueryTimeout. Needs networkPolicy.egress.queryMcpPort.
  dataGraphqlUrl: ""
  readHeaderTimeout: "5s"
  readTimeout: "20s"
  writeTimeout: "20s"
  idleTimeout: "60s"
  shutdownTimeout: "10s"
  requireBackingStores: true
  localCompositionReady: false
  # direct or pgbouncer; must not contradict a PgBouncer admin DSN.
  postgresConnectionKind: direct
  maxItems: 30
  maxOutputTokens: 4000
  maxSerializedBytes: 262144
  requestsPerMinute: 60
  enableEpisodeWriteback: false
  # Absolute browser URL shown by the device authorization flow. This normally
  # points at the Dev Health Web approval page, not at acr-api itself.
  deviceVerificationUrl: ""
  # Dev Health Ops entitlement origin. HTTP and HTTPS are both supported; use
  # HTTPS plus entitlementCaBundle when the internal service explicitly uses TLS.
  entitlement:
    url: ""
    timeout: "5s"
    # Mount path for the entitlement bearer token file sourced from an existing
    # Secret (see credentials.entitlementToken).
    tokenMountPath: /var/run/acr/entitlement
    tokenFileName: token
  # Optional PEM CA bundles mounted from existing Secrets (references only).
  postgresCaBundle:
    existingSecret: ""
    key: ca.crt
  clickhouseCaBundle:
    existingSecret: ""
    key: ca.crt
  entitlementCaBundle:
    existingSecret: ""
    key: ca.crt
  # Web-BFF assertion verification is intentionally enabled only for test and
  # development renders. The Secret is mounted read-only into acr-api.
  webAssertion:
    issuer: ""
    audience: ""
    existingSecret: ""
    key: web-jwks.json
    mountPath: /var/run/acr/web-assertion
  # OAuth 2.1 authorization-code login for hosted MCP clients (acr-api is the
  # authorization server). Consent is the device flow's web approval, so
  # enabling it also enables webAssertion (issuer, audience, existingSecret)
  # in every environment, production included.
  oauth:
    enabled: false
    # acr-api public origin, e.g. https://acr.example.com (no path).
    issuer: ""
    # Public URLs of the hosted MCP endpoints a credential may be bound to,
    # e.g. [https://mcp.example.com/mcp].
    resources: []
    # The web consent page /authorize sends the browser to (the handle is
    # appended as ?handle=...), e.g. https://www.example.com/acr/authorize.
    # Required with enabled. Roll it only once that web page is live.
    consentUrl: ""
    # Accept client ID metadata documents (HTTPS client_id URLs). Fetches go
    # to public addresses only.
    clientMetadataDocuments: true

# Existing-Secret-only credential contract. Each existingSecret is the NAME of a
# Secret that already exists in the release namespace. This chart validates the
# reference syntax offline; live object existence is verified at deploy time
# (Todo 19), not here.
credentials:
  # Runtime (least-privilege) ACR operational Postgres DSN and read-only
  # ClickHouse evidence DSN consumed by acr-api.
  runtime:
    existingSecret: ""
    postgresDsnKey: ACR_POSTGRES_DSN
    clickhouseDsnKey: ACR_CLICKHOUSE_DSN
    # Evidence-ID signing keyring (required by the hosted runtime). Both are
    # sourced from the existing runtime Secret; key material is never templated.
    evidenceIdActiveKidKey: ACR_EVIDENCE_ID_ACTIVE_KID
    evidenceIdKeysKey: ACR_EVIDENCE_ID_KEYS
    # PgBouncer admin DSN key; required when config.postgresConnectionKind is
    # pgbouncer, otherwise leave empty.
    poolerAdminDsnKey: ""
  # Migration (schema-owner) Postgres DSN consumed only by the acr-migrate Job.
  # MUST reference a different Secret or key than the runtime DSN.
  migration:
    existingSecret: ""
    postgresDsnKey: ACR_POSTGRES_MIGRATION_DSN
    # Optional PgBouncer admin DSN key for transaction-pool validation.
    poolerAdminDsnKey: ""
  # Bearer token used to authenticate to the Dev Health Ops entitlement service.
  entitlementToken:
    existingSecret: ""
    key: token
  # Bump this opaque revision whenever a referenced Secret's CONTENT is rotated
  # (name unchanged). Helm cannot observe external Secret content, so changing
  # this value forces the API and migration pods to roll onto the new material.
  rotationRevision: ""

deployment:
  replicaCount: 2
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  podAnnotations: {}
  podLabels: {}
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: "1"
      memory: 512Mi
  nodeSelector: {}
  tolerations: []
  # Spread replicas across zones and nodes by default.
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: topology.kubernetes.io/zone
      whenUnsatisfiable: ScheduleAnyway
      labelSelectorFromRelease: true
    - maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: ScheduleAnyway
      labelSelectorFromRelease: true
  affinity: {}
  # UNSUPPORTED escape hatch. Additional workload containers would bypass the
  # restricted pod-security guarantees, so any non-empty value fails
  # closed and this list is never rendered. Keep empty.
  extraContainers: []
  # CHAOS-4076: generic escape hatch for acr-api container env vars this
  # chart has no first-class key for yet. A plain list of Kubernetes EnvVar
  # entries ({name, value} or {name, valueFrom: {...}}), appended verbatim
  # after every first-class env var above -- unlike extraContainers this DOES
  # render, so it is the operator's responsibility to avoid duplicating a
  # name already set above (Kubernetes takes the LAST entry for a duplicate
  # name, so an extraEnv entry can deliberately override a first-class one).
  # Prefer adding a first-class values key over reaching for this when the
  # same env var will be set the same way across deployments.
  #
  # Two contracts this chart enforces elsewhere do NOT apply to this list --
  # a raw EnvVar list cannot be schema-restricted to a closed name set:
  #   1. Existing-Secret-only credentials. Every first-class credential
  #      above is a secretKeyRef; extraEnv accepts a literal `value:` too,
  #      so it CAN carry a literal credential string into the rendered
  #      Deployment/values. Never put credential material here -- add a
  #      first-class existingSecret-backed key instead (open a ticket if
  #      one does not exist yet).
  #   2. contextFabric.model's own `enabled` gate. That gate exists
  #      specifically because modelprovider.Configured() (see its own
  #      comment above) opts in on ANY nonblank ACR_CONTEXT_FABRIC_MODEL*
  #      variable -- setting one here with contextFabric.model.enabled left
  #      false silently opts this deployment into a model provider anyway.
  #      Use contextFabric.model.enabled + its first-class fields for any
  #      ACR_CONTEXT_FABRIC_MODEL* variable; do not set one through here.
  extraEnv: []

migration:
  enabled: true
  # Bounded retries for the pre-install/pre-upgrade migration hook.
  backoffLimit: 3
  activeDeadlineSeconds: 600
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: "1"
      memory: 512Mi
  podAnnotations: {}

service:
  type: ClusterIP
  port: 8080
  annotations: {}

# Context Fabric projection worker (CHAOS-3753): an independently deployed
# and scaled Deployment running the acr-projector binary from the same
# image as acr-api, entrypoint overridden -- matching how the acr-migrate
# Job already reuses this image. Disabled by default: enabling it before a
# FalkorDB endpoint exists would bring the workload up in its documented
# healthy-disabled state, so there is no reason to run the extra pod until
# one exists.
contextFabric:
  # CHAOS-3916/CHAOS-3898 S2a-2: shared master switch for the
  # build-aside-and-swap graph rebuild path
  # (ACR_CONTEXT_FABRIC_GRAPH_LIFECYCLE_ENABLED). A SINGLE shared key here
  # -- rather than one per Deployment -- makes it structurally impossible
  # to set it on only one of acr-api/acr-projector: both resolve an
  # organization's graph key through the SAME epoch pointer once either
  # has it on (see templates/deployment.yaml and
  # templates/projector-deployment.yaml, which both read this one value).
  # Flag-off routes `acr-projector rebuild --org` through the legacy
  # in-place purge instead of build-aside-and-swap. See
  # docs/operations.md's "CHAOS-3916 production graph cutover runbook"
  # before flipping this in a real deployment -- it is inert without
  # readsEnabled below AND a correctly-populated embed.existingSecret (see
  # CHAOS-4147: a set embed.baseURL with a blank/absent key silently
  # constructs a broken embedder that destroys vectors on first use).
  lifecycleEnabled: false
  # Independent graph-READ enablement lever for acr-api's Investigator
  # (ACR_CONTEXT_FABRIC_GRAPH_READS_ENABLED,
  # internal/config/hosted_runtime.go). lifecycleEnabled above is INERT on
  # acr-api unless this is ALSO true -- internal/runtime/hosted/open.go
  # only constructs the falkorgraph adapter when both
  # EnableContextFabricInvestigations and falkorgraph.Configured() hold.
  readsEnabled: false
  # FalkorDB graph backend (ADR 0009), consumed by acr-projector's
  # ProjectionBackend (contextFabric.projector below wires these values
  # into that Deployment). Empty addr leaves Context Fabric unconfigured --
  # falkorgraph.Configured() then keeps the adapter from ever constructing,
  # matching the "an unset deployment should never fail closed" contract.
  # FalkorDB is self-hosted -- by default this chart does not run a FalkorDB
  # workload, the same posture as postgres/clickhouse being externally
  # provisioned; point addr at wherever it runs. CHAOS-4055: the optional
  # `falkordb` workload block below can deploy a single-instance FalkorDB
  # in-release (values-gated, off by default); enabling it does NOT auto-wire
  # this addr -- set addr to the rendered Service
  # (<fullname>-falkordb:6379, with tls=false / allowInsecure=true, matching
  # the compose overlay's plaintext in-network posture) explicitly, so an
  # unset deployment still never fails closed. No credential is required
  # by default (FalkorDB has no auth out of the box), so existingSecret is
  # optional and empty by default. acr-api's own optional Investigator (gated
  # by ACR_CONTEXT_FABRIC_GRAPH_READS_ENABLED) reads this same env var
  # contract; templates/deployment.yaml wires it into the acr-api Deployment
  # too (CHAOS-3774), mirroring templates/projector-deployment.yaml exactly.
  falkor:
    addr: ""
    tls: true
    allowInsecure: false
    graphPrefix: "acr-cf"
    existingSecret: ""
    passwordKey: ACR_CONTEXT_FABRIC_FALKOR_PASSWORD
  # Embedding provider for acr-projector's vector projection (CHAOS-3778),
  # consumed by templates/projector-deployment.yaml. Empty baseURL leaves
  # the embedder unconfigured -- embedprovider.Configured() constructs
  # nothing, matching the falkor.addr contract above.
  #
  # CHAOS-4147 (read before setting baseURL): Configured() checks ONLY
  # baseURL, never the API key. A set baseURL with an absent or blank
  # existingSecret key constructs a FULLY "configured", silently-broken
  # embedder -- every projection batch it processes then clears the
  # vector for every row whose text it just rewrote, by design (stale
  # vector vs. new text), which during a full `rebuild --org` means
  # losing the WHOLE organization's vectors in one pass. Never set
  # baseURL without existingSecret pointing at a real, live key, and
  # verify by inspecting the resolved Pod env after deploy -- not by
  # inspecting this file or confirming the Secret merely exists.
  embed:
    baseURL: ""
    provider: ""
    model: ""
    dimension: ""
    timeout: "45s"
    maxTransportRetries: "5"
    existingSecret: ""
    apiKeyKey: ACR_CONTEXT_FABRIC_EMBED_API_KEY
  # CHAOS-4076: acr-api's Investigator model runtime (internal/contextfabric/
  # modelprovider), consumed by templates/deployment.yaml. Unlike falkor/embed
  # above, modelprovider.Configured() opts in on ANY nonblank
  # ACR_CONTEXT_FABRIC_MODEL* variable (not just baseURL/model), so this
  # block uses its own explicit `enabled` switch rather than gating on a
  # single field -- an implicit-opt-in gate here could enable a paid hosted
  # provider from an unrelated tuning value alone. `enabled: false` renders
  # none of this block's env vars, matching the falkor.addr /
  # embed.baseURL "unset deployment never fails closed" contract. When
  # enabling, `model` is required (validate() rejects a blank
  # ACR_CONTEXT_FABRIC_MODEL); `provider`/`baseURL`/existingSecret select a
  # BYO OpenAI-compatible endpoint, empty selects the hosted OpenAI default
  # (api.openai.com) and then existingSecret is required. See
  # internal/contextfabric/modelprovider/config.go for the full contract.
  model:
    enabled: false
    provider: ""
    baseURL: ""
    model: ""
    fallbackModel: ""
    # CHAOS-4171 PR2: optional distinct model for the SECOND bounded
    # offer-phrasing call (internal/contextfabric/chaos4171_offer_phrasing.go).
    # Empty means phrasing shares `model` above -- an operator opts into a
    # smaller/cheaper model explicitly.
    phrasingModel: ""
    timeout: "45s"
    maxAttempts: "2"
    maxTransportRetries: "2"
    allowInsecureBaseURL: false
    existingSecret: ""
    apiKeyKey: ACR_CONTEXT_FABRIC_MODEL_API_KEY
  # CHAOS-4055: optional in-release FalkorDB workload so the COMPLETE ACR
  # topology (api + migration + projector + graph backend) is deployable from
  # this chart alone on a local cluster. Disabled by default -- production
  # keeps the externally-provisioned posture above, exactly like the
  # profile-gated `falkordb` service in deploy/compose/acr.compose.yml.
  # Vocabulary mirrors that compose service: same digest-pinned image
  # (FalkorDB 4.20.2 / module 42002 / Redis 8.6.3, the version the
  # falkorgraph adapter was verified against), same GRAPH.QUERY readiness
  # probe (PING is not sufficient -- see
  # docs/design/context-fabric-falkordb-adapter.md), port 6379, persistent
  # data volume. One deliberate divergence: the volume mounts at
  # /var/lib/falkordb/data (the image's FALKORDB_DATA_PATH, where
  # redis-server --dir actually writes) -- the compose service's /data mount
  # point predates that image layout and does not capture the dump files.
  falkordb:
    enabled: false
    # Immutable digest, identical to deploy/compose/acr.compose.yml.
    image: "docker.io/falkordb/falkordb@sha256:ad09d5051bbda1cfee8cef9d7f41ffe1bcb1c5327b82c442c989e84ab8cc33d3"
    imagePullPolicy: IfNotPresent
    service:
      port: 6379
    # Single instance, fixed: FalkorDB here is a single-node store; a replica
    # knob would only pretend at an HA topology this chart does not provide.
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: "1"
        memory: 1Gi
    persistence:
      enabled: true
      size: 1Gi
      # Empty selects the cluster default StorageClass.
      storageClassName: ""
    # The upstream image runs redis-server as root via its run.sh entrypoint
    # (no USER directive) and its bundled browser UI is disabled below
    # (BROWSER=0) to keep the workload headless. The restricted
    # acr.containerSecurityContext (runAsNonRoot, uid 65532, read-only root)
    # does not apply to this vendored image; the template still drops all
    # capabilities, forbids privilege escalation, and pins seccomp to
    # RuntimeDefault.
    #
    # CHAOS-4076: this root requirement is a hard PodSecurity Admission (PSA)
    # constraint, not just a note. A namespace enforcing the `restricted`
    # level rejects this StatefulSet's Pod outright (0/1, runAsNonRoot
    # violation) -- enabling falkordb.enabled here REQUIRES the target
    # namespace to carry `pod-security.kubernetes.io/enforce: baseline` (or
    # `privileged`), e.g.:
    #   kubectl label namespace <ns> pod-security.kubernetes.io/enforce=baseline --overwrite
    # This is namespace-wide: it relaxes PSA for every workload in that
    # namespace, not just this one, so prefer a dedicated namespace for the
    # in-release FalkorDB workload over relaxing PSA on a shared namespace
    # that also runs acr-api/acr-projector under the restricted contract
    # above. Externally-provisioned FalkorDB (the default, falkordb.enabled
    # false, contextFabric.falkor.addr pointed elsewhere) has no PSA
    # implication for this chart's own namespace at all.
    podAnnotations: {}
    podLabels: {}
    nodeSelector: {}
    tolerations: []
    affinity: {}
  projector:
    enabled: false
    replicaCount: 1
    revisionHistoryLimit: 3
    # Independent from `enabled` above: `enabled` controls whether this
    # Deployment exists at all; `projectionEnabled` is the acr-projector
    # process's own ACR_CONTEXT_FABRIC_PROJECTION_ENABLED master switch
    # (rollback/disable lever without deleting the Deployment).
    projectionEnabled: false
    # Static organization allowlist. With `orgDiscovery: false` (the
    # default) it is the WHOLE set of organizations this projector serves,
    # and an empty list with `projectionEnabled: true` is refused at
    # startup. With `orgDiscovery: true` it is a floor: the projector
    # unions it with the organizations it discovers, so an empty list is
    # accepted and is the normal setting.
    orgIds: []
    # CHAOS-6182: auto-discover organizations (ACR_CONTEXT_FABRIC_PROJECTOR_ORG_DISCOVERY).
    # When true the projector re-reads the distinct organization set from
    # ClickHouse at the start of every poll, so a new tenant gets a graph
    # without a chart edit or a redeploy. Off by default: a chart that does
    # not set it behaves exactly as it did before.
    orgDiscovery: false
    # How recently a DISCOVERED organization's canonical data must have
    # moved (repos.last_synced / work_items.updated_at /
    # git_pull_requests.last_synced) for discovery to give it a graph.
    # Exists because a shared ClickHouse accumulates throwaway tenants and
    # each one would otherwise cost real projection, key and embedding
    # work. "0s" disables the activity condition (repository ownership
    # still applies); a negative value is refused at startup. Ignored when
    # orgDiscovery is false, and it NEVER filters orgIds above.
    orgActivityWindow: "720h"
    # Organizations discovery must never admit. Filters the DISCOVERED set
    # only -- orgIds above is an always-include list, so an organization
    # named in both is projected.
    orgDiscoveryDenyIds: []
    pollInterval: "15s"
    concurrency: 4
    teamsProjectsEnabled: false
    podAnnotations: {}
    podLabels: {}
    nodeSelector: {}
    tolerations: []
    affinity: {}
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: "1"
        memory: 512Mi
    service:
      port: 8090

# Hosted acr-mcp: the stateless Streamable HTTP MCP server (MCP 2026-07-28), an
# independent workload from its own image (the acr-mcp Dockerfile target, not
# the acr-api image). Disabled by default.
#
# Credential model: the pod holds NO credential. No Secret is mounted or read
# into its environment, no ServiceAccount token is mounted, and ACR_API_TOKEN is
# never set. The only Secret reference it can carry is the chart-wide
# imagePullSecrets (registry pull auth, not an ACR credential); leave that list
# empty for a public image and the pod references no Secret at all.
# Each request must carry the caller's own `Authorization: Bearer <ACR API
# token>`; acr-mcp decides it against acr-api and forwards the same bearer on
# every tool call, so acr-api stays the only place credentials are checked.
# There is no service-to-service credential between the two workloads.
acrMcp:
  enabled: false
  # Immutable acr-mcp image (ghcr.io/full-chaos/dev-health-acr/acr-mcp@sha256:...);
  # same digest rule as image.reference (a local tag is accepted only when
  # config.environment is development or test).
  image:
    reference: ""
    pullPolicy: IfNotPresent
  # Stateless: replicas are interchangeable, scale freely.
  replicaCount: 2
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  # Origin of acr-api. Empty selects the in-cluster Service of this release
  # (http://<fullname>.<namespace>.svc:<service.port>, plain HTTP inside the
  # cluster, TLS terminating at the Gateway). Set an https origin to reach an
  # acr-api elsewhere; the in-cluster default also sets
  # ACR_API_ALLOW_INSECURE_INTERNAL_HTTP.
  apiUrl: ""
  # MCP endpoint path served by the pod and matched by the HTTPRoute. The probe
  # paths /healthz and /readyz are fixed by the binary.
  basePath: /mcp
  # Proxies in front of acr-mcp (ingress controller and any node/tunnel source
  # address) whose X-Forwarded-For the per-address failure gate believes.
  # Empty keys the gate on the peer address (every caller behind one ingress
  # shares one bucket) and logs a startup Warn. acr-api needs the acr-mcp pod
  # range in its own trusted proxies (config.trustedProxyCidrs / extraEnv
  # ACR_TRUSTED_PROXY_CIDRS) for the forwarded caller address to count there.
  trustedProxyCidrs: []
  # OAuth discovery (RFC 9728): set both to advertise acr-api as the
  # authorization server. resourceUrl is this endpoint's public URL and must
  # end in basePath; authorizationServer is config.oauth.issuer.
  oauth:
    resourceUrl: ""
    authorizationServer: ""
  logLevel: info
  # ACR_API_TIMEOUT: also bounds each per-request credential decision.
  apiTimeout: "15s"
  http:
    readHeaderTimeout: "10s"
    readTimeout: "30s"
    writeTimeout: "300s"
    idleTimeout: "120s"
    shutdownTimeout: "30s"
    maxBodyBytes: 1048576
  # Must exceed http.shutdownTimeout so a rollout lets in-flight calls finish.
  terminationGracePeriodSeconds: 45
  service:
    type: ClusterIP
    port: 8081
    annotations: {}
  # Optional Gateway API HTTPRoute for a caller-supplied, pre-existing Gateway;
  # same posture as the acr-api route above. Routes only acrMcp.basePath.
  gateway:
    enabled: false
    httpRoute:
      annotations: {}
      parentRefs: []
      hostnames: []
  # Rendered only when replicaCount > 1.
  podDisruptionBudget:
    enabled: true
    minAvailable: 1
    maxUnavailable: null
  # Default-deny. Ingress only from these namespace selectors plus the
  # namespace of each acrMcp.gateway parentRef; with neither, same-namespace only. Egress is DNS plus
  # acr-api: the release's own acr-api pods when apiUrl is empty, otherwise
  # egress.apiPort with no destination restriction.
  networkPolicy:
    enabled: true
    ingressNamespaceSelectors: []
    egress:
      dns: true
      apiPort: 443
  podAnnotations: {}
  podLabels: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  topologySpreadConstraints: []
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: "1"
      memory: 256Mi

# Optional Gateway API HTTPRoute targeting a caller-supplied, pre-existing
# Gateway. This chart never installs a Gateway controller or a Gateway object.
gateway:
  enabled: false
  httpRoute:
    annotations: {}
    # Caller-supplied Gateway references. Each: {name, namespace?, sectionName?}.
    parentRefs: []
    hostnames: []
    matches:
      - path:
          type: PathPrefix
          value: /api/v1/agent-context

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 75
  targetMemoryUtilizationPercentage: 80

podDisruptionBudget:
  enabled: true
  minAvailable: 1
  maxUnavailable: null

# Default-deny NetworkPolicy with explicit egress to external dependencies. It
# constrains TCP ports; Kubernetes NetworkPolicy cannot inspect TLS or resolve
# the secret-supplied dependency hostnames into destination peers.
networkPolicy:
  enabled: true
  # Ingress to the API port is allowed from these namespace selectors (for
  # example the Gateway namespace). Empty means same-namespace only.
  ingressNamespaceSelectors: []
  egress:
    # Allow DNS resolution.
    dns: true
    # Internal dependency ports. Override these when the explicit DSNs or
    # entitlement origin select different ports, including TLS-native ports.
    postgresPort: 5432
    clickhousePort: 9000
    entitlementPort: 8000
    # Ops query service internal listener (acr-api egress only). The port is
    # reserved as DHO_QUERY_INTERNAL_PORT: 8095 in GWC's draft, NOT final
    # until their merge (design r5 text says 8091). Set 0 to render no rule.
    queryInternalPort: 8095
    # GWC's MCP listener (graphql_query, CHAOS-7085; acr-api egress only).
    # 0 renders no rule; the values roll sets 8092 with dataGraphqlUrl.
    queryMcpPort: 0
    # Optional pod labels of the ops query-api pods (same namespace) that
    # narrow the 8092 rule to those pods. Empty = port-only, like the rules above.
    queryMcpPodSelector: {}
    # FalkorDB graph backend port. Rendered into the API egress only when
    # contextFabric.falkor.addr is set (acr-api's optional Investigator and
    # acr-projector share the same endpoint contract); an unconfigured
    # Context Fabric adds no egress. Same convention as the ports above:
    # override this to match the port in the addr you configured (including
    # contextFabric.falkordb.service.port when using the in-release
    # workload on a non-default port).
    falkorPort: 6379
    # Kubernetes API server port, needed only when workloadTokenExchange.enabled
    # (acr-api calls TokenReview). Ports-only, same convention as the other
    # egress rules above -- NetworkPolicy cannot target the API server by pod
    # label the way it can an in-cluster Service.
    kubernetesAPIPort: 443

# OTLP/gRPC export of each workload's own telemetry (acr-api, acr-mcp,
# acr-projector): HTTP server spans and metrics, projection-tick spans, and a
# copy of every structured log line. Off by default. Genkit's own telemetry
# (model prompt/response content) is never exported -- see
# docs/operations.md "OpenTelemetry export".
otel:
  enabled: false
  # OTLP/gRPC collector, e.g. http://otel-collector:4317 (http:// = plaintext
  # gRPC). Required when enabled.
  endpoint: ""
  # service.name per workload (OTEL_SERVICE_NAME).
  serviceNames:
    api: acr-api
    mcp: acr-mcp
    projector: acr-projector
  # Collector port the api and mcp NetworkPolicies allow egress to when
  # enabled. Port-only, the same convention as networkPolicy.egress: a
  # NetworkPolicy cannot name the collector host.
  egressPort: 4317

# CHAOS-4013: RFC 8693 workload token exchange. Disabled by default -- an
# unconfigured deployment leaves api.RuntimeDependencies.WorkloadTokenExchange
# nil and the grant on POST /api/v1/oauth/token degrades to a clean 503; the
# pre-existing device-code grant on that endpoint is unaffected either way.
workloadTokenExchange:
  enabled: false
  # ACR-specific TokenReview audience every subject token must be minted
  # for; ACR_WORKLOAD_TOKEN_EXCHANGE_AUDIENCE.
  audience: "dev-health-acr-token-exchange"
  # Fixed, deployment-configured cluster identifier -- see
  # internal/auth.KubernetesTokenReviewOptions.TrustDomain's own doc
  # comment for why this is static rather than derived from the token.
  # ACR_WORKLOAD_TRUST_DOMAIN.
  trustDomain: ""
  # Per-grant-class consumer ServiceAccounts this chart provisions so an
  # operator can bind acr.workload_bindings rows against a stable identity.
  # automountServiceAccountToken is always false for these -- a consuming
  # workload's OWN pod spec must project a token scoped to `audience`
  # explicitly (serviceAccountToken volume, no subPath -- subPath mounts
  # never receive kubelet's live token rotation) rather than relying on the
  # unscoped default automount.
  consumerServiceAccounts:
    - name: panel-read
    - name: mcp-read
    - name: ci-ops

apiVersion: v2
name: acr
description: >-
  Private Dev Health Agent Context Runtime (ACR) hosted API. Packages the ACR
  `acr-api` workload, its pre-install/pre-upgrade migration Job, and an optional
  credential-less hosted `acr-mcp` workload (off by default). External
  Postgres and ClickHouse are consumed as pre-existing dependencies. Dev Health
  Ops entitlement is remote in staging/production and may be local/offline in
  development/test.
type: application
# Chart version tracks the packaging revision; appVersion tracks the immutable
# application image, which is always supplied as a digest reference at deploy
# time (see values.image.reference).
version: 0.2.0
appVersion: "0.1.0"
kubeVersion: ">=1.29.0-0"
home: https://github.com/full-chaos/dev-health-acr
sources:
  - https://github.com/full-chaos/dev-health-acr
keywords:
  - agent-context-runtime
  - dev-health
  - private
annotations:
  # This chart must never be vendored into dev-health-ops (see ADR-0004).
  dev-health.io/ownership: dev-health-acr

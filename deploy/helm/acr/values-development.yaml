# Development values for the private ACR Helm chart.
#
# These values exercise the full happy-path render used by
# scripts/deploy/test-helm.sh. The image reference is intentionally left empty
# here and supplied by the harness via --image "$TEST_IMAGE_DIGEST" so the chart
# is always pinned to an immutable digest.

image:
  reference: ""
  pullPolicy: IfNotPresent

imagePullSecrets:
  - name: acr-registry-pull

serviceAccount:
  create: true
  automountServiceAccountToken: false

config:
  environment: development
  logLevel: debug
  # r1 P2 finding 1: a bare requireBackingStores: false is no longer a
  # storeless opt-out by itself -- the code now honors it only paired with
  # the explicit dev flag below (the same interlock Config.Validate already
  # enforces: LocalCompositionReady requires development with backing
  # stores disabled). Both must be set together.
  requireBackingStores: false
  localCompositionReady: true
  postgresConnectionKind: direct
  deviceVerificationUrl: https://dev-health.internal/acr/device
  webAssertion:
    issuer: dev-health-web
    audience: dev-health-acr
    existingSecret: acr-web-assertion-jwks
    key: web-jwks.json

credentials:
  runtime:
    existingSecret: acr-runtime-credentials
    postgresDsnKey: ACR_POSTGRES_DSN
    clickhouseDsnKey: ACR_CLICKHOUSE_DSN
  migration:
    existingSecret: acr-migration-credentials
    postgresDsnKey: ACR_POSTGRES_MIGRATION_DSN
deployment:
  replicaCount: 2

gateway:
  enabled: true
  httpRoute:
    parentRefs:
      - name: acr-gateway
        namespace: gateway-system
        sectionName: https
    hostnames:
      - acr.dev-health.internal

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 4

podDisruptionBudget:
  enabled: true
  minAvailable: 1

networkPolicy:
  enabled: true
  ingressNamespaceSelectors:
    - matchLabels:
        kubernetes.io/metadata.name: gateway-system

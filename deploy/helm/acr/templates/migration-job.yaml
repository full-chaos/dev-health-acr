{{- /*
Pre-install/pre-upgrade migration Job. Runs acr-migrate up with the
schema-owner migration DSN (never the runtime DSN) and completes before the
Deployment rolls out. Credential and no-MCP guards run here first.
*/ -}}
{{- include "acr.validateCredentials" . -}}
{{- include "acr.validateConnectionKind" . -}}
{{- include "acr.validateNoMcp" . -}}
{{- include "acr.validateEntitlementOrigin" . -}}
{{- $image := include "acr.image" . -}}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "acr.fullname" . }}-migrate
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "acr.migrationLabels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: {{ .Values.migration.backoffLimit }}
  activeDeadlineSeconds: {{ .Values.migration.activeDeadlineSeconds }}
  template:
    metadata:
      labels:
        {{- include "acr.migrationSelectorLabels" . | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/migration-prereqs.yaml") . | sha256sum }}
        checksum/credentials: {{ include "acr.credentialsChecksumInput" . | sha256sum }}
        {{- with .Values.migration.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      restartPolicy: Never
      serviceAccountName: {{ include "acr.fullname" . }}-migrate
      automountServiceAccountToken: false
      {{- include "acr.imagePullSecrets" . | nindent 6 }}
      securityContext:
        {{- include "acr.podSecurityContext" . | nindent 8 }}
      containers:
        - name: acr-migrate
          image: {{ $image | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/usr/local/bin/acr-migrate", "up"]
          securityContext:
            {{- include "acr.containerSecurityContext" . | nindent 12 }}
          envFrom:
            - configMapRef:
                name: {{ include "acr.fullname" . }}-migrate-config
          env:
            - name: ACR_POSTGRES_MIGRATION_DSN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.credentials.migration.existingSecret | quote }}
                  key: {{ .Values.credentials.migration.postgresDsnKey | default "ACR_POSTGRES_MIGRATION_DSN" | quote }}
            {{- if .Values.credentials.migration.poolerAdminDsnKey }}
            - name: ACR_POSTGRES_MIGRATION_POOLER_ADMIN_DSN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.credentials.migration.existingSecret | quote }}
                  key: {{ .Values.credentials.migration.poolerAdminDsnKey | quote }}
            {{- end }}
          resources:
            {{- toYaml .Values.migration.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}

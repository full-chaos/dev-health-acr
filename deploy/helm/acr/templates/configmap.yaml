{{- /* Non-secret process configuration. Credentials never appear here. */ -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "acr.fullname" . }}-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "acr.labels" . | nindent 4 }}
data:
  ACR_ENVIRONMENT: {{ .Values.config.environment | quote }}
  # Fixed to the container/probe port; not operator-tunable so the listen
  # address can never diverge from containerPort 8080.
  ACR_ADDR: ":8080"
  ACR_LOG_LEVEL: {{ .Values.config.logLevel | quote }}
  ACR_REQUEST_TIMEOUT: {{ .Values.config.requestTimeout | quote }}
  ACR_READ_HEADER_TIMEOUT: {{ .Values.config.readHeaderTimeout | quote }}
  ACR_READ_TIMEOUT: {{ .Values.config.readTimeout | quote }}
  ACR_WRITE_TIMEOUT: {{ .Values.config.writeTimeout | quote }}
  ACR_IDLE_TIMEOUT: {{ .Values.config.idleTimeout | quote }}
  ACR_SHUTDOWN_TIMEOUT: {{ .Values.config.shutdownTimeout | quote }}
  ACR_REQUIRE_BACKING_STORES: {{ .Values.config.requireBackingStores | quote }}
  ACR_POSTGRES_CONNECTION_KIND: {{ .Values.config.postgresConnectionKind | quote }}
  ACR_MAX_ITEMS: {{ .Values.config.maxItems | quote }}
  ACR_MAX_OUTPUT_TOKENS: {{ .Values.config.maxOutputTokens | quote }}
  ACR_MAX_SERIALIZED_BYTES: {{ .Values.config.maxSerializedBytes | quote }}
  ACR_REQUESTS_PER_MINUTE: {{ .Values.config.requestsPerMinute | quote }}
  ACR_ENABLE_EPISODE_WRITEBACK: {{ .Values.config.enableEpisodeWriteback | quote }}
  ACR_DEVICE_VERIFICATION_URL: {{ .Values.config.deviceVerificationUrl | quote }}
  {{- if or (eq .Values.config.environment "development") (eq .Values.config.environment "test") }}
  {{- with .Values.config.webAssertion }}
  {{- if and .issuer .audience .existingSecret }}
  ACR_WEB_ASSERTION_ISSUER: {{ .issuer | quote }}
  ACR_WEB_ASSERTION_AUDIENCE: {{ .audience | quote }}
  ACR_WEB_ASSERTION_JWKS_FILE: {{ printf "%s/%s" (.mountPath | trimSuffix "/") .key | quote }}
  {{- end }}
  {{- end }}
  {{- end }}
  {{- if include "acr.remoteEntitlement" . }}
  ACR_DEV_HEALTH_ENTITLEMENT_URL: {{ .Values.config.entitlement.url | quote }}
  ACR_DEV_HEALTH_ENTITLEMENT_TIMEOUT: {{ .Values.config.entitlement.timeout | quote }}
  ACR_DEV_HEALTH_ENTITLEMENT_TOKEN_FILE: {{ printf "%s/%s" (.Values.config.entitlement.tokenMountPath | trimSuffix "/") .Values.config.entitlement.tokenFileName | quote }}
  {{- end }}
  {{- if .Values.config.postgresCaBundle.existingSecret }}
  ACR_POSTGRES_CA_BUNDLE: "/var/run/acr/postgres-ca/ca.crt"
  {{- end }}
  {{- if .Values.config.clickhouseCaBundle.existingSecret }}
  ACR_CLICKHOUSE_CA_BUNDLE: "/var/run/acr/clickhouse-ca/ca.crt"
  {{- end }}
  {{- if and (include "acr.remoteEntitlement" .) .Values.config.entitlementCaBundle.existingSecret }}
  ACR_DEV_HEALTH_ENTITLEMENT_CA_BUNDLE: "/var/run/acr/entitlement-ca/ca.crt"
  {{- end }}

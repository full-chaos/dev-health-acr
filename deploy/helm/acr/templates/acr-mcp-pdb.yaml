{{- /*
Rendered only when more than one replica exists: minAvailable 1 on a single
replica would block every node drain.
*/ -}}
{{- if and .Values.acrMcp.enabled .Values.acrMcp.podDisruptionBudget.enabled (gt (int .Values.acrMcp.replicaCount) 1) }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "acr.fullname" . }}-mcp
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "acr.mcpLabels" . | nindent 4 }}
spec:
  {{- if .Values.acrMcp.podDisruptionBudget.maxUnavailable }}
  maxUnavailable: {{ .Values.acrMcp.podDisruptionBudget.maxUnavailable }}
  {{- else }}
  minAvailable: {{ .Values.acrMcp.podDisruptionBudget.minAvailable }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "acr.mcpSelectorLabels" . | nindent 6 }}
{{- end }}

{{- /*
acr-api Deployment. Guards run first; the runtime container uses the
least-privilege runtime credentials and never runs acr-mcp.
*/ -}}
{{- include "acr.validateCredentials" . -}}
{{- include "acr.validateConnectionKind" . -}}
{{- include "acr.validateNoMcp" . -}}
{{- include "acr.validateEntitlementOrigin" . -}}
{{- $image := include "acr.image" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "acr.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "acr.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.deployment.replicaCount }}
  {{- end }}
  revisionHistoryLimit: {{ .Values.deployment.revisionHistoryLimit }}
  strategy:
    type: {{ .Values.deployment.strategy.type }}
    {{- if eq .Values.deployment.strategy.type "RollingUpdate" }}
    rollingUpdate:
      {{- toYaml .Values.deployment.strategy.rollingUpdate | nindent 6 }}
    {{- end }}
  selector:
    matchLabels:
      {{- include "acr.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "acr.selectorLabels" . | nindent 8 }}
        {{- with .Values.deployment.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/credentials: {{ include "acr.credentialsChecksumInput" . | sha256sum }}
        {{- with .Values.deployment.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "acr.serviceAccountName" . }}
      automountServiceAccountToken: false
      {{- include "acr.imagePullSecrets" . | nindent 6 }}
      securityContext:
        {{- include "acr.podSecurityContext" . | nindent 8 }}
      {{- with .Values.deployment.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.deployment.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.deployment.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.deployment.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- range .Values.deployment.topologySpreadConstraints }}
        - maxSkew: {{ .maxSkew }}
          topologyKey: {{ .topologyKey }}
          whenUnsatisfiable: {{ .whenUnsatisfiable }}
          {{- if .labelSelectorFromRelease }}
          labelSelector:
            matchLabels:
              {{- include "acr.selectorLabels" $ | nindent 14 }}
          {{- else if .labelSelector }}
          labelSelector:
            {{- toYaml .labelSelector | nindent 12 }}
          {{- end }}
        {{- end }}
      {{- end }}
      initContainers:
        - name: prepare-entitlement-token
          image: docker.io/library/busybox@sha256:9532d8c39891ca2ecde4d30d7710e01fb739c87a8b9299685c63704296b16028
          command: ["sh", "-c", 'umask 077 && cp /source/{{ .Values.config.entitlement.tokenFileName }} /target/{{ .Values.config.entitlement.tokenFileName }} && if [ -f /source-ca/ca.crt ]; then cp /source-ca/ca.crt /target-ca/ca.crt; fi']
          securityContext:
            {{- include "acr.containerSecurityContext" . | nindent 12 }}
          volumeMounts:
            - name: entitlement-token-source
              mountPath: /source
              readOnly: true
            - name: entitlement-token
              mountPath: /target
            {{- if .Values.config.entitlementCaBundle.existingSecret }}
            - name: entitlement-ca-source
              mountPath: /source-ca
              readOnly: true
            {{- end }}
            - name: entitlement-ca
              mountPath: /target-ca
      containers:
        - name: acr-api
          image: {{ $image | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/usr/local/bin/acr-api", "serve"]
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          securityContext:
            {{- include "acr.containerSecurityContext" . | nindent 12 }}
          envFrom:
            {{- include "acr.configEnvFrom" . | nindent 12 }}
          env:
            - name: ACR_POSTGRES_DSN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.credentials.runtime.existingSecret | quote }}
                  key: {{ .Values.credentials.runtime.postgresDsnKey | default "ACR_POSTGRES_DSN" | quote }}
            - name: ACR_CLICKHOUSE_DSN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.credentials.runtime.existingSecret | quote }}
                  key: {{ .Values.credentials.runtime.clickhouseDsnKey | default "ACR_CLICKHOUSE_DSN" | quote }}
            - name: ACR_EVIDENCE_ID_ACTIVE_KID
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.credentials.runtime.existingSecret | quote }}
                  key: {{ .Values.credentials.runtime.evidenceIdActiveKidKey | default "ACR_EVIDENCE_ID_ACTIVE_KID" | quote }}
            - name: ACR_EVIDENCE_ID_KEYS
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.credentials.runtime.existingSecret | quote }}
                  key: {{ .Values.credentials.runtime.evidenceIdKeysKey | default "ACR_EVIDENCE_ID_KEYS" | quote }}
            {{- if eq .Values.config.postgresConnectionKind "pgbouncer" }}
            - name: ACR_POSTGRES_POOLER_ADMIN_DSN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.credentials.runtime.existingSecret | quote }}
                  key: {{ .Values.credentials.runtime.poolerAdminDsnKey | quote }}
            {{- end }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            failureThreshold: 30
          resources:
            {{- toYaml .Values.deployment.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: entitlement-token
              mountPath: {{ .Values.config.entitlement.tokenMountPath | quote }}
              readOnly: true
            {{- if .Values.config.postgresCaBundle.existingSecret }}
            - name: postgres-ca
              mountPath: /var/run/acr/postgres-ca
              readOnly: true
            {{- end }}
            {{- if .Values.config.clickhouseCaBundle.existingSecret }}
            - name: clickhouse-ca
              mountPath: /var/run/acr/clickhouse-ca
              readOnly: true
            {{- end }}
            {{- if .Values.config.entitlementCaBundle.existingSecret }}
            - name: entitlement-ca
              mountPath: /var/run/acr/entitlement-ca
              readOnly: true
            {{- end }}
      # deployment.extraContainers is intentionally never rendered; the
      volumes:
        - name: tmp
          emptyDir: {}
        - name: entitlement-token
          emptyDir:
            medium: Memory
        - name: entitlement-token-source
          secret:
            secretName: {{ .Values.credentials.entitlementToken.existingSecret | quote }}
            items:
              - key: {{ .Values.credentials.entitlementToken.key | default "token" | quote }}
                path: {{ .Values.config.entitlement.tokenFileName | quote }}
        - name: entitlement-ca
          emptyDir:
            medium: Memory
        {{- if .Values.config.entitlementCaBundle.existingSecret }}
        - name: entitlement-ca-source
          secret:
            secretName: {{ .Values.config.entitlementCaBundle.existingSecret | quote }}
            items:
              - key: {{ .Values.config.entitlementCaBundle.key | quote }}
                path: ca.crt
        {{- end }}
        {{- if .Values.config.postgresCaBundle.existingSecret }}
        - name: postgres-ca
          secret:
            secretName: {{ .Values.config.postgresCaBundle.existingSecret | quote }}
            items:
              - key: {{ .Values.config.postgresCaBundle.key | quote }}
                path: ca.crt
        {{- end }}
        {{- if .Values.config.clickhouseCaBundle.existingSecret }}
        - name: clickhouse-ca
          secret:
            secretName: {{ .Values.config.clickhouseCaBundle.existingSecret | quote }}
            items:
              - key: {{ .Values.config.clickhouseCaBundle.key | quote }}
                path: ca.crt
        {{- end }}

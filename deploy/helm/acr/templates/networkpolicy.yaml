{{- /*
Default-deny NetworkPolicy with explicit ingress to the API port and explicit
egress to DNS and the external Postgres/ClickHouse/entitlement dependency ports.
Endpoints are resolved from referenced Secrets at runtime, so standard Kubernetes
NetworkPolicy can constrain protocol and port but cannot inspect TLS or restrict a
secret-supplied hostname. Callers must configure ports matching their explicit DSNs and origins.
*/ -}}
{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "acr.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "acr.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "acr.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        {{- if .Values.networkPolicy.ingressNamespaceSelectors }}
        {{- range .Values.networkPolicy.ingressNamespaceSelectors }}
        - namespaceSelector:
            {{- toYaml . | nindent 12 }}
        {{- end }}
        {{- else }}
        - podSelector: {}
        {{- end }}
      ports:
        - protocol: TCP
          port: 8080
    {{- if .Values.acrMcp.enabled }}
    {{- /* acr-mcp reaches acr-api in-cluster to decide each caller's bearer
         and to forward its calls; without this rule a gateway-only ingress
         selector would cut the MCP workload off. */}}
    - from:
        - podSelector:
            matchLabels:
              {{- include "acr.mcpSelectorLabels" . | nindent 14 }}
      ports:
        - protocol: TCP
          port: 8080
    {{- end }}
  egress:
    {{- if .Values.networkPolicy.egress.dns }}
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    {{- end }}
    {{- if .Values.networkPolicy.egress.postgresPort }}
    - ports:
        - protocol: TCP
          port: {{ .Values.networkPolicy.egress.postgresPort }}
    {{- end }}
    {{- if .Values.networkPolicy.egress.clickhousePort }}
    - ports:
        - protocol: TCP
          port: {{ .Values.networkPolicy.egress.clickhousePort }}
    {{- end }}
    {{- range .Values.networkPolicy.egress.clickhouseExtraPorts }}
    - ports:
        - protocol: TCP
          port: {{ . }}
    {{- end }}
    {{- /* S1a: acr-api calls the ops query service internal listener
         (POST <ACR_DATA_QUERY_URL><ACR_DATA_QUERY_PATH>, default /query). Port-only like the rules above;
         0/unset renders no rule. This policy selects acr-api only; acr-mcp
         has its own policy and never dials the query service. */}}
    {{- if .Values.networkPolicy.egress.queryInternalPort }}
    - ports:
        - protocol: TCP
          port: {{ .Values.networkPolicy.egress.queryInternalPort }}
    {{- end }}
    {{- /* CHAOS-7075: acr-api calls GWC's MCP listener for graphql_query
         (POST <ACR_DATA_GRAPHQL_URL>/query, CHAOS-7085). Port-only; 0/unset
         renders no rule. */}}
    {{- if .Values.networkPolicy.egress.queryMcpPort }}
    {{- with .Values.networkPolicy.egress.queryMcpPodSelector }}
    - to:
        - podSelector:
            matchLabels:
              {{- toYaml . | nindent 14 }}
      ports:
        - protocol: TCP
          port: {{ $.Values.networkPolicy.egress.queryMcpPort }}
    {{- else }}
    - ports:
        - protocol: TCP
          port: {{ .Values.networkPolicy.egress.queryMcpPort }}
    {{- end }}
    {{- end }}
    {{- /* CHAOS-4055: acr-api's optional Investigator dials FalkorDB on the
         same endpoint contract as acr-projector; without this rule a
         configured contextFabric.falkor.addr was unreachable from the API
         pods under this default-deny policy. Rendered only when Context
         Fabric is actually wired, mirroring the entitlement gate below. */}}
    {{- if and .Values.contextFabric.falkor.addr .Values.networkPolicy.egress.falkorPort }}
    - ports:
        - protocol: TCP
          port: {{ .Values.networkPolicy.egress.falkorPort }}
    {{- end }}
    {{- /* acr-api's query embedder dials the embedding provider (HTTPS). Rendered
         only when the explicit switch contextFabric.embed.apiEnabled and
         embed.baseURL are both set; port-only like the rules above (the
         provider hostname cannot be named by a standard NetworkPolicy). */}}
    {{- if and .Values.contextFabric.embed.apiEnabled .Values.contextFabric.embed.baseURL .Values.networkPolicy.egress.embedPort }}
    - ports:
        - protocol: TCP
          port: {{ .Values.networkPolicy.egress.embedPort }}
    {{- end }}
    {{- if and (include "acr.remoteEntitlement" .) .Values.networkPolicy.egress.entitlementPort }}
    - ports:
        - protocol: TCP
          port: {{ .Values.networkPolicy.egress.entitlementPort }}
    {{- end }}
    {{- /* CHAOS-4076: port-only, no destination restriction (standard
         NetworkPolicy has no way to name a Service like
         kubernetes.default.svc -- only ipBlock/podSelector/namespaceSelector
         on pods/CIDRs -- and this chart does not know the cluster's real
         apiserver ClusterIP at author time). This SHAPE is a DELIBERATE,
         RATIFIED POSTURE (chris, 2026-08-23), not an oversight: standard
         NetworkPolicy cannot express "the in-cluster apiserver" any more
         precisely without a cluster-specific ipBlock, so port-only is what
         this chart can offer generically.
         IMPORTANT, do not overclaim from this rule alone: the CHAOS-4034
         live P6 validation run's A/B/A evidence found this exact rule
         PRESENT and RFC 8693 TokenReview STILL timed out on that
         kind+Calico cluster -- only deleting the ENTIRE NetworkPolicy
         restored a 200. Root cause is unresolved (a Calico/kind ClusterIP
         DNAT interaction is suspected, not ruled). Do not read "this rule
         renders" as "workloadTokenExchange is proven reachable" on every
         CNI; verify apiserver reachability for TokenReview on the actual
         target cluster/CNI before relying on this rule. A destination-
         restricted rule (an ipBlock pinned to the cluster's actual
         apiserver Service IP) becomes a chart change when a scale/
         multi-tenant deployment needs one -- track that separately, do not
         silently narrow this rule without a new ticket.
         CHAOS-13481: networkPolicy.egress.kubernetesAPIEndpoints, when set,
         replaces the port-only rule with one ipBlock /32 + port per entry.
         On k3s (kube-router) the policy matches the packet AFTER the Service
         DNAT, so an entry names the apiserver endpoint address and port (the
         `kubernetes` EndpointSlice, e.g. 6443), not the ClusterIP and 443: a
         ClusterIP:443 entry opens nothing (bigboy proof, 2026-11-10). An
         empty list renders the port-only rule exactly as before. */}}
    {{- $kubeAPI := .Values.networkPolicy.egress.kubernetesAPIEndpoints | default list }}
    {{- range $i, $e := $kubeAPI }}
    {{- if not (and (kindIs "map" $e) (kindIs "string" $e.cidr) (regexMatch "^((25[0-5]|2[0-4][0-9]|1[0-9][0-9]|[1-9]?[0-9])\\.){3}(25[0-5]|2[0-4][0-9]|1[0-9][0-9]|[1-9]?[0-9])/32$" (toString $e.cidr))) }}
    {{- fail (printf "networkPolicy.egress.kubernetesAPIEndpoints[%d].cidr must be one IPv4 address as a /32 CIDR" $i) }}
    {{- end }}
    {{- if not (and (or (kindIs "float64" $e.port) (kindIs "int" $e.port) (kindIs "int64" $e.port)) (ge (int $e.port) 1) (le (int $e.port) 65535)) }}
    {{- fail (printf "networkPolicy.egress.kubernetesAPIEndpoints[%d].port must be a TCP port 1-65535" $i) }}
    {{- end }}
    {{- end }}
    {{- if include "acr.tokenReview" . }}
    {{- if $kubeAPI }}
    {{- range $kubeAPI }}
    - to:
        - ipBlock:
            cidr: {{ .cidr | quote }}
      ports:
        - protocol: TCP
          port: {{ int .port }}
    {{- end }}
    {{- else if .Values.networkPolicy.egress.kubernetesAPIPort }}
    - ports:
        - protocol: TCP
          port: {{ .Values.networkPolicy.egress.kubernetesAPIPort }}
    {{- end }}
    {{- end }}
    {{- with include "acr.otelEgress" . }}
    {{- . | nindent 4 }}
    {{- end }}
{{- end }}

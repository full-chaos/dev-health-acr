{{- /*
CHAOS-4013: per-grant-class consumer ServiceAccounts. These are the
IDENTITIES a workload token-exchange binding is declared against
(acr.workload_bindings: {trust domain, namespace, service account name,
service account uid}) -- an operator provisions the binding row out of
band against one of these, and a consuming workload's OWN pod spec (owned
by a different chart/manifest, not this one) sets serviceAccountName to
match and projects its own audience-scoped token. This chart declares only
the identity, never a consumer's pod spec.
*/ -}}
{{- if .Values.workloadTokenExchange.enabled }}
{{- range .Values.workloadTokenExchange.consumerServiceAccounts }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "acr.labels" $ | nindent 4 }}
# Never automounted -- a consuming workload's own pod spec must project a
# token scoped to workloadTokenExchange.audience explicitly (no subPath;
# see the reviewer-token volume's own comment in deployment.yaml for why).
automountServiceAccountToken: false
---
{{- end }}
{{- end }}

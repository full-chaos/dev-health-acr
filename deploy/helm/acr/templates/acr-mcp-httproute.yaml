{{- /*
Optional Gateway API HTTPRoute for acr-mcp, targeting a caller-supplied,
pre-existing Gateway exactly like the acr-api route. Only the MCP base path is
routed; the probe paths stay in-cluster. TLS terminates at the Gateway.
*/ -}}
{{- if and .Values.acrMcp.enabled .Values.acrMcp.gateway.enabled }}
{{- include "acr.validateAcrMcp" . -}}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "acr.fullname" . }}-mcp
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "acr.mcpLabels" . | nindent 4 }}
  {{- with .Values.acrMcp.gateway.httpRoute.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  parentRefs:
    {{- range .Values.acrMcp.gateway.httpRoute.parentRefs }}
    - name: {{ .name | quote }}
      {{- if .namespace }}
      namespace: {{ .namespace | quote }}
      {{- end }}
      {{- if .sectionName }}
      sectionName: {{ .sectionName | quote }}
      {{- end }}
      {{- if .port }}
      port: {{ .port }}
      {{- end }}
    {{- end }}
  {{- with .Values.acrMcp.gateway.httpRoute.hostnames }}
  hostnames:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: {{ .Values.acrMcp.basePath | quote }}
      backendRefs:
        - name: {{ include "acr.fullname" . }}-mcp
          port: {{ .Values.acrMcp.service.port }}
{{- end }}

{{- /*
Default-deny NetworkPolicy for the optional in-release FalkorDB workload
(CHAOS-4055), matching the posture of the API and migration policies: ingress
is limited to this release's own pods on the redis port, and the store needs
no egress at all (empty egress list denies everything, the same convention as
the migration policy's empty ingress).
*/ -}}
{{- if and .Values.contextFabric.falkordb.enabled .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "acr.fullname" . }}-falkordb
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "acr.falkordbLabels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "acr.falkordbSelectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: {{ include "acr.name" . }}
              app.kubernetes.io/instance: {{ .Release.Name }}
      ports:
        - protocol: TCP
          port: 6379
  # The graph store initiates no outbound connections.
  egress: []
{{- end }}

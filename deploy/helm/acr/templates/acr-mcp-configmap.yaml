{{- /*
acr-mcp process configuration. Non-secret only: the hosted MCP server holds no
credential of its own (each caller's bearer is forwarded to acr-api), so this
ConfigMap is the whole configuration surface. The listen address is fixed to
:8081 to match containerPort and is not an operator knob.
*/ -}}
{{- if .Values.acrMcp.enabled }}
{{- include "acr.validateAcrMcp" . -}}
{{- $m := .Values.acrMcp -}}
{{- $apiUrl := include "acr.mcpApiUrl" . -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "acr.fullname" . }}-mcp-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "acr.mcpLabels" . | nindent 4 }}
data:
  ACR_MCP_TRANSPORT: "http"
  ACR_MCP_HTTP_LISTEN: ":8081"
  ACR_MCP_HTTP_BASE_PATH: {{ $m.basePath | quote }}
  ACR_MCP_HTTP_READ_HEADER_TIMEOUT: {{ $m.http.readHeaderTimeout | quote }}
  ACR_MCP_HTTP_READ_TIMEOUT: {{ $m.http.readTimeout | quote }}
  ACR_MCP_HTTP_WRITE_TIMEOUT: {{ $m.http.writeTimeout | quote }}
  ACR_MCP_HTTP_IDLE_TIMEOUT: {{ $m.http.idleTimeout | quote }}
  ACR_MCP_HTTP_SHUTDOWN_TIMEOUT: {{ $m.http.shutdownTimeout | quote }}
  ACR_MCP_HTTP_MAX_BODY_BYTES: {{ $m.http.maxBodyBytes | int | quote }}
  ACR_API_URL: {{ $apiUrl | quote }}
  ACR_API_TIMEOUT: {{ $m.apiTimeout | quote }}
  {{- if hasPrefix "http://" $apiUrl }}
  ACR_API_ALLOW_INSECURE_INTERNAL_HTTP: "true"
  {{- end }}
  ACR_LOG_LEVEL: {{ $m.logLevel | quote }}
  {{- /* The edge failure gate must resolve the same limits as acr-api (CHAOS-7196):
       ACR_REQUESTS_PER_MINUTE is the fallback of the failure limit; explicit
       ACR_AUTH_* / ACR_LIMIT_WINDOW literals set through deployment.extraEnv
       for acr-api are mirrored here so one value configures both. */}}
  ACR_REQUESTS_PER_MINUTE: {{ .Values.config.requestsPerMinute | quote }}
  {{- range $e := .Values.deployment.extraEnv }}
  {{- if and (hasKey $e "value") (or (hasPrefix "ACR_AUTH_" $e.name) (eq $e.name "ACR_LIMIT_WINDOW")) }}
  {{ $e.name }}: {{ $e.value | toString | quote }}
  {{- end }}
  {{- end }}
  {{- if $m.trustedProxyCidrs }}
  ACR_MCP_TRUSTED_PROXY_CIDRS: {{ join "," $m.trustedProxyCidrs | quote }}
  {{- end }}
  {{- with include "acr.otelEnv" (dict "root" $ "name" $.Values.otel.serviceNames.mcp) }}
  {{- . | nindent 2 }}
  {{- end }}
  {{- with $m.oauth }}
  {{- if or .resourceUrl .authorizationServer }}
  {{- include "acr.validateMcpOAuth" $ }}
  ACR_MCP_RESOURCE_URL: {{ required "acrMcp.oauth.resourceUrl is required with acrMcp.oauth.authorizationServer" .resourceUrl | quote }}
  ACR_MCP_AUTHORIZATION_SERVER: {{ required "acrMcp.oauth.authorizationServer is required with acrMcp.oauth.resourceUrl" .authorizationServer | quote }}
  {{- end }}
  {{- end }}
{{- end }}

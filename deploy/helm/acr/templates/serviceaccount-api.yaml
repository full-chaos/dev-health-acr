{{- /*
Dedicated ServiceAccount for acr-api. It is shared with no other workload (the
projector keeps acr.serviceAccountName), carries no secrets and no
imagePullSecrets (the pod spec carries those), and never automounts a token:
acr-api's only token is the explicit projected volume in deployment.yaml.
*/ -}}
{{- include "acr.validateServiceAccountNames" . -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "acr.apiServiceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "acr.labels" . | nindent 4 }}
automountServiceAccountToken: false

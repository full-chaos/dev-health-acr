{{- /*
Dedicated ServiceAccount for acr-mcp. It carries no secrets, no imagePullSecrets
of its own, no RBAC, and no mounted token: the hosted MCP server never talks to
the Kubernetes API.
*/ -}}
{{- if .Values.acrMcp.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "acr.fullname" . }}-mcp
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "acr.mcpLabels" . | nindent 4 }}
automountServiceAccountToken: false
{{- end }}

{{- /*
Context Fabric projection worker (CHAOS-3753) non-secret configuration.
Separate from templates/configmap.yaml so acr-api never receives a
projector-only key by accident. Only rendered when
contextFabric.projector.enabled.
*/ -}}
{{- if .Values.contextFabric.projector.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "acr.fullname" . }}-projector-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "acr.projectorLabels" . | nindent 4 }}
data:
  ACR_ENVIRONMENT: {{ .Values.config.environment | quote }}
  ACR_LOG_LEVEL: {{ .Values.config.logLevel | quote }}
  # Fixed to the container/probe port, matching acr-api's ACR_ADDR convention.
  ACR_PROJECTOR_ADDR: ":8090"
  ACR_REQUIRE_BACKING_STORES: {{ .Values.config.requireBackingStores | quote }}
  # r1 P2 finding 1: a bare ACR_REQUIRE_BACKING_STORES=false is not a
  # storeless opt-out on its own -- the projector honors it only paired with
  # this explicit dev flag (same interlock acr-api's ConfigMap already
  # renders below and Config/ProjectorConfig.Validate both enforce).
  ACR_LOCAL_COMPOSITION_READY: {{ .Values.config.localCompositionReady | quote }}
  ACR_POSTGRES_CONNECTION_KIND: {{ .Values.config.postgresConnectionKind | quote }}
  ACR_CONTEXT_FABRIC_PROJECTION_ENABLED: {{ .Values.contextFabric.projector.projectionEnabled | quote }}
  # CHAOS-6182: rendered only when a static allowlist is actually
  # configured. An empty key would be indistinguishable from an unset one
  # to ProjectorConfig (stringListValue treats "" as no entries), but
  # leaving it out keeps the ConfigMap an honest statement of what this
  # deployment configures -- with orgDiscovery on, an empty allowlist is
  # the normal setting, not an omission.
  {{- if .Values.contextFabric.projector.orgIds }}
  ACR_CONTEXT_FABRIC_PROJECTOR_ORG_IDS: {{ join "," .Values.contextFabric.projector.orgIds | quote }}
  {{- end }}
  ACR_CONTEXT_FABRIC_PROJECTOR_ORG_DISCOVERY: {{ .Values.contextFabric.projector.orgDiscovery | default false | quote }}
  ACR_CONTEXT_FABRIC_PROJECTOR_ORG_ACTIVITY_WINDOW: {{ .Values.contextFabric.projector.orgActivityWindow | default "720h" | quote }}
  {{- if .Values.contextFabric.projector.orgDiscoveryDenyIds }}
  ACR_CONTEXT_FABRIC_PROJECTOR_ORG_DISCOVERY_DENY_IDS: {{ join "," .Values.contextFabric.projector.orgDiscoveryDenyIds | quote }}
  {{- end }}
  ACR_CONTEXT_FABRIC_PROJECTION_POLL_INTERVAL: {{ .Values.contextFabric.projector.pollInterval | quote }}
  ACR_CONTEXT_FABRIC_PROJECTION_CONCURRENCY: {{ .Values.contextFabric.projector.concurrency | quote }}
  ACR_CONTEXT_FABRIC_PROJECT_TEAMS_PROJECTS_ENABLED: {{ .Values.contextFabric.projector.teamsProjectsEnabled | quote }}
  ACR_ENABLE_EPISODE_WRITEBACK: {{ .Values.config.enableEpisodeWriteback | quote }}
  {{- with include "acr.otelEnv" (dict "root" . "name" .Values.otel.serviceNames.projector) }}
  {{- . | nindent 2 }}
  {{- end }}
  {{- if .Values.config.postgresCaBundle.existingSecret }}
  ACR_POSTGRES_CA_BUNDLE: "/var/run/acr/postgres-ca/ca.crt"
  {{- end }}
  {{- if .Values.config.clickhouseCaBundle.existingSecret }}
  ACR_CLICKHOUSE_CA_BUNDLE: "/var/run/acr/clickhouse-ca/ca.crt"
  {{- end }}
{{- end }}

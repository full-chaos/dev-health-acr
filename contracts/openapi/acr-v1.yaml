            - "untrusted"
            - "fields"
          type: "object"
      required:
        - "call"
        - "completeness"
        - "source"
        - "errors"
        - "page"
        - "consistency"
        - "untrusted_content"
        - "request"
        - "root_fields"
      type: "object"
    DataOperationRequest:
      additionalProperties: false
      properties:
        max_bytes:
          description: "Budget for the serialized data; 0 = 32768, values above 262144 are clamped."
          maximum: 262144
          minimum: 0
          type: "integer"
        operation:

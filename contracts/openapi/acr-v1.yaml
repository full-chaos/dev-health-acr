              type: "string"
            contract:
              type: "string"
            ops_repository:
              type: "string"
            ops_source_sha:
              type: "string"
            schema_digest:
              type: "string"
          required:
            - "contract"
            - "catalogue_contract"
            - "ops_repository"
            - "ops_source_sha"
            - "schema_digest"
          type: "object"
      required:
        - "contract_version"
        - "sections"
        - "versions"
        - "caller"
        - "consistency"
        - "untrusted_content"
      type: "object"
    DataGraphQLRequest:
      additionalProperties: false
      properties:
        max_bytes:
          description: "Budget for the serialized data; 0 = 32768, values above 262144 are clamped."
          maximum: 262144
          minimum: 0
          type: "integer"
        query:
          description: "One GraphQL query operation over the allowed schema. No mutation, subscription, fragment, directive or introspection; aliases on root fields only; orgId is never a client argument."
          maxLength: 8192
          minLength: 1
          type: "string"
        variables:
          description: "Values for the variables the query declares."
          type: "object"
      required:
        - "query"
      type: "object"
    DataGraphQLResponse:
      additionalProperties: false
      properties:
        call:
          enum:
            - "served"
            - "refused"
            - "operation_unavailable"
            - "upstream_error"
            - "upstream_timeout"
        completeness:
          enum:
            - "declared_complete"
            - "declared_partial"
            - "unknown"
        consistency:
          const: "best_effort"
        data:
          description: "Keyed by the client's root response keys; only the selected allowed fields. Untrusted content."

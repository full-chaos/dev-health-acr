                  disclosure_fields:
                    items:
                      type: "string"
                    type: "array"
                  document_digest:
                    type: "string"
                  forced_variable:
                    type: "string"
                  max_in_flight_per_org:
                    minimum: 1
                    type: "integer"
                  name:
                    type: "string"
                  notes:
                    items:
                      type: "string"
                    type: "array"
                  purpose:
                    maxLength: 200
                    type: "string"
                  reason:
                    enum:
                      - "scope_missing_data_read"
                      - "data_query_not_configured"
                      - "subject_gate_unavailable"
                  response_root:
                    type: "string"
                  scope_class:
                    enum:
                      - "org_wide"
                      - "forced_grant"
                  scope_variables:
                    items:
                      type: "string"
                    type: "array"
                  variables:
                    items:
                      properties:

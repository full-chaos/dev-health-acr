              type: "array"
            roots:
              items:
                type: "object"
              type: "array"
            schema_digest:
              type: "string"
            sdl:
              type: "string"
          required:
            - "caller_class"
            - "available"
            - "schema_digest"
            - "limits"
            - "roots"
            - "refused_root_fields"
            - "sdl"
          type: "object"
        sections:
          items:
            enum:
              - "operations"
              - "facts"
              - "subjects"
              - "relationships"
              - "limits"
              - "schema"
          type: "array"
        subjects:
          properties:
            kinds:
              items:
                properties:
                  default_name_kind:
                    type: "boolean"
                  kind:
                    type: "string"
                  listable:
                    type: "boolean"

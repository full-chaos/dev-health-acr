  "/api/v1/context-fabric/investigations/{result_id}":
    get:
      description: "Returns the canonical result a prior investigation persisted. A bounded consumer that received an answer projection uses this to fetch the full detail behind a claim, so every answer does not have to be inflated for the rare caller that wants everything; replay and diagnostics read the same way. Strictly read-only: no graph, canonical fact, or model work happens. view=projection returns the bounded answer projection instead of the canonical snapshot, produced by the same projection code the MCP answer tool calls, so a consumer cannot receive a different judgment from either surface. result_id is a frozen, opaque handle and must not be parsed. An unknown result_id, a malformed one, and one belonging to another organization are indistinguishable: all three answer 404, so result_id can never act as a cross-tenant existence oracle."
      operationId: "getContextFabricInvestigation"
      parameters:
        -
          "$ref": "#/components/parameters/RequestID"
        -
          "$ref": "#/components/parameters/ClientVersion"
        -
          in: "path"
          name: "result_id"
          required: true
          schema:
            maxLength: 256
            minLength: 8
            type: "string"
        -
          description: "Representation to return. 'canonical' (default) returns the full context_fabric_investigation_result.v1 or .v2 (CHAOS-4042). 'projection' returns the bounded context_fabric_answer_projection.v1, produced by the SAME projection code the MCP answer tool uses, so the two surfaces cannot disagree about what an answer says."
          in: "query"
          name: "view"
          required: false
          schema:
            enum:
              - "canonical"
              - "projection"
            type: "string"
        -
          description: "Maximum drivers to retain in the projection view. Valid only with view=projection; omitted means the projection default. Every drop it causes is declared in projection_budget."
          in: "query"
          name: "max_drivers"
          required: false
          schema:
            maximum: 50
            minimum: 1
            type: "integer"
        -
          description: "Maximum cohort members to retain in the projection view. Valid only with view=projection; omitted means the projection default. Every drop it causes is declared in projection_budget."
          in: "query"
          name: "max_cohort_members"
          required: false
          schema:
            maximum: 250
            minimum: 1
            type: "integer"
        -
          description: "Maximum evidence references the projection's index may carry. Valid only with view=projection; omitted means the projection default. Every drop it causes is declared in projection_budget."
          in: "query"
          name: "max_evidence_refs"
          required: false
          schema:
            maximum: 500
            minimum: 1
            type: "integer"
      responses:
        "200":
          content:
            application/json:
              schema:
                oneOf:
                  -
                    "$ref": "../jsonschema/v1/context_fabric_investigation_result.v1.schema.json"
                  -
                    "$ref": "../jsonschema/v1/context_fabric_investigation_result.v2.schema.json"
                  -
                    "$ref": "../jsonschema/v1/context_fabric_answer_projection.v1.schema.json"
          description: "Persisted immutable investigation result. The canonical snapshot by default (schema_version context_fabric_investigation_result.v1, or .v2 when the result minted an anchor membership-verify offer -- see CHAOS-4042), or its bounded consumer projection when view=projection."
        "400":
          "$ref": "#/components/responses/Error"
        "401":
          "$ref": "#/components/responses/Error"
        "403":
          "$ref": "#/components/responses/Error"
        "404":
          "$ref": "#/components/responses/Error"
        "413":
          "$ref": "#/components/responses/Error"
        "426":

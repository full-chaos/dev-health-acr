            - "served"
            - "note"
          type: "object"
        limits:
          additionalProperties:
            type: "integer"
          type: "object"
        notes:
          items:
            type: "string"
          type: "array"
        operations:
          properties:
            available:
              type: "boolean"
            caller_class:
              enum:
                - "unrestricted"
                - "restricted"
            not_served:

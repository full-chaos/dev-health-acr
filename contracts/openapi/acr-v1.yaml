                  - "http_status"
                  - "transport"
                  - "canceled"
                  - "acr_deadline"
                  - "carrier_refused"
                  - "listener_refused"
                  - "not_found"
                  - "concurrency_wait"
            required:
              - "class"
            type: "object"
          type: "array"
        page:
          additionalProperties: false
          properties:
            max_bytes:
              type: "integer"
            returned_bytes:
              type: "integer"
          required:
            - "returned_bytes"
            - "max_bytes"
          type: "object"
        refusal:
          additionalProperties: false
          properties:
            code:
              enum:
                - "variable_not_allowed"
                - "variable_out_of_range"
                - "person_scope_not_served"
                - "basis_dependent_shape"
                - "no_granted_scope"
                - "operation_not_served_for_caller"
                - "response_budget"
                - "invalid_request"
                - "scope_required"
                - "row_outside_grant"
                - "policy_stale"
                - "denied_or_not_found"
                - "query_invalid"
                - "operation_type_not_allowed"
                - "root_field_not_allowed"
                - "field_not_allowed"
                - "fragment_not_allowed"
                - "directive_not_allowed"
                - "query_limit_exceeded"
                - "read_budget_exceeded"
            max_bytes:
              type: "integer"
            measured_bytes:
              type: "integer"
            path:
              type: "string"
            read_budget:
              enum:
                - "bytes_ceiling"
                - "rows_ceiling"
                - "time_ceiling"
                - "unknown"
            reason:
              type: "string"
          required:
            - "code"
            - "reason"
          type: "object"
        request:
          additionalProperties: false
          properties:
            max_bytes:
              type: "integer"
          required:
            - "max_bytes"
          type: "object"
        result:
          enum:
            - "data"
            - "empty_unverified"
            - "empty_declared"
        root_fields:
          items:
            additionalProperties: false
            properties:
